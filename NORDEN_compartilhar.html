ode te oferecer uma antecipação, que só acontece se você aceitar.<\/p>\n          <\/div>\n\n          <label class=\"opcao-check\">\n            <input type=\"checkbox\" id=\"aceite-politica\" aria-describedby=\"aceite-politica-erro\">\n            <span>Li e concordo com a política de cancelamento.<\/span>\n          <\/label>\n          <p class=\"campo-erro\" id=\"aceite-politica-erro\" aria-live=\"polite\"><\/p>\n\n          <div class=\"form-status\" id=\"status-confirmacao\" role=\"status\" aria-live=\"polite\"><\/div>\n        <\/section>\n\n        <!-- Navegação das etapas -->\n        <div class=\"passo-acoes\" id=\"passo-acoes\">\n          <button type=\"button\" class=\"btn btn-contorno-escuro\" id=\"btn-voltar\">Voltar<\/button>\n          <button type=\"button\" class=\"btn btn-escuro\" id=\"btn-avancar\">Continuar<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- ======================= RESUMO ======================= -->\n      <aside class=\"resumo\" aria-labelledby=\"titulo-resumo\">\n        <h2 id=\"titulo-resumo\" class=\"resumo-titulo\">Resumo<\/h2>\n        <dl class=\"resumo-lista\" id=\"resumo-lista\">\n          <div><dt>Serviço<\/dt><dd data-resumo=\"servico\">—<\/dd><\/div>\n          <div><dt>Profissional<\/dt><dd data-resumo=\"profissional\">—<\/dd><\/div>\n          <div><dt>Data<\/dt><dd data-resumo=\"data\">—<\/dd><\/div>\n          <div><dt>Horário<\/dt><dd data-resumo=\"horario\">—<\/dd><\/div>\n          <div><dt>Produtos<\/dt><dd data-resumo=\"produtos\">Nenhum<\/dd><\/div>\n        <\/dl>\n        <div class=\"resumo-total\">\n          <span>Duração <strong data-resumo=\"duracao\">—<\/strong><\/span>\n          <span>Total <strong data-resumo=\"preco\">—<\/strong><\/span>\n        <\/div>\n        <p class=\"resumo-nota\">Produtos de preferência não são cobrados no agendamento.<\/p>\n      <\/aside>\n    <\/div>\n\n    <!-- ==================== CONFIRMAÇÃO (DEMO) ==================== -->\n    <section class=\"confirmado\ 500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/auth.css\">\n<\/head>\n\n<body class=\"pagina-auth\">\n  <a class=\"skip-link\" href=\"#conteudo\">Pular para o formulário<\/a>\n\n  <div class=\"auth auth-cadastro\">\n    <!-- =================== PAINEL DA MARCA =================== -->\n    <aside class=\"auth-marca\" aria-label=\"Sobre o cadastro\">\n      <a href=\"index.html\" class=\"marca\" aria-label=\"NORDEN — voltar ao site\">\n        <span class=\"marca-nome\">NORDEN<\/span>\n        <span class=\"marca-sub\">Salão masculino premium<\/span>\n      <\/a>\n\n      <div class=\"auth-marca-conteudo\">\n        <span class=\"rotulo\">Criar conta<\/span>\n        <h2>Um cadastro rápido. Pedimos só o necessário.<\/h2>\n        <ul class=\"auth-beneficios\">\n          <li><strong>Etapa 1 — Acesso<\/strong><span>Nome, e-mail, telefone e senha.<\/span><\/li>\n          <li><strong>Etapa 2 — Preferências e segurança<\/strong><span>Preferências opcionais e alertas importantes para o atendimento.<\/span><\/li>\n          <li><strong>Endereço só quando precisar<\/strong><span>Ele é pedido apenas se você escolher entrega na loja.<\/span><\/li>\n        <\/ul>\n      <\/div>\n\n      <p class=\"auth-marca-rodape\">Wordmark provisório · projeto acadêmico em desenvolvimento.<\/p>\n    <\/aside>\n\n    <!-- ====================== FORMULÁRIO ====================== -->\n    <main class=\"auth-conteudo\" id=\"conteudo\">\n      <div class=\"auth-topo-movel\">\n        <a href=\"index.html\" class=\"marca\" aria-label=\"NORDEN — voltar ao site\">\n          <span class=\"marca-nome\">NORDEN<\/span>\n        <\/a>\n      <\/div>\n\n      <a href=\"index.html\" class=\"auth-voltar\">← Voltar ao site<\/a>\n\n      <div class=\"auth-caixa\">\n        <div class=\"aviso-modo-demo\" role=\"note\">\n          <strong>Modo demonstração.<\/strong> O cadastro ainda não cad-telefone-ajuda\">Usado para avisos sobre seus horários.<\/p>\n                  <p class=\"campo-erro\" id=\"cad-telefone-erro\" aria-live=\"polite\"><\/p>\n                <\/div>\n\n                <div class=\"campo\">\n                  <label for=\"cad-nascimento\">Data de nascimento <span class=\"opcional\">(opcional)<\/span><\/label>\n                  <input type=\"date\" id=\"cad-nascimento\" name=\"nascimento\" autocomplete=\"bday\" aria-describedby=\"cad-nascimento-erro\">\n                  <p class=\"campo-erro\" id=\"cad-nascimento-erro\" aria-live=\"polite\"><\/p>\n                <\/div>\n              <\/div>\n\n              <div class=\"campo\">\n                <label for=\"cad-senha\">Senha<\/label>\n                <div class=\"campo-senha\">\n                  <input type=\"password\" id=\"cad-senha\" name=\"senha\" autocomplete=\"new-password\" required aria-describedby=\"cad-senha-regras cad-senha-erro\">\n                  <button type=\"button\" class=\"btn-ver-senha\" aria-controls=\"cad-senha\" aria-pressed=\"false\">Mostrar<\/button>\n                <\/div>\n                <ul class=\"regras-senha\" id=\"cad-senha-regras\" aria-label=\"Requisitos da senha\">\n                  <li data-regra=\"tamanho\">Pelo menos 8 caracteres<\/li>\n                  <li data-regra=\"letra\">Uma letra<\/li>\n                  <li data-regra=\"numero\">Um número<\/li>\n                <\/ul>\n                <p class=\"campo-erro\" id=\"cad-senha-erro\" aria-live=\"polite\"><\/p>\n              <\/div>\n\n              <div class=\"campo\">\n                <label for=\"cad-confirmar\">Confirmar senha<\/label>\n                <div class=\"campo-senha\">\n                  <input type=\"password\" id=\"cad-confirmar\" name=\"confirmar\" autocomplete=\"new-password\" required aria-describedby=\"cad-confirmar-erro\">\n                  <button type=\"button\" class=\"btn-ver-senha\" aria-controls=\"cad-confirmar\" aria-pressed=\"false\">Mostrar<\/button>\n                <\/div>\n                <p class=\"campo-erro\" id=\"cad-confirmar-erro\" aria-live=\"polite\"><\/p>\n              <\/div>\n\n              <button type=\"button\" class=\"btn btn-escuro btn-bloco\" data-ir-etapa=\"2\">Continuar<\/button>\n            <\/fieldset>\n\n            <!-- ======= ETAPA 2 — PREFERÊNCIAS E SEGURANÇA ======= -->\n            <fieldset class=\"etapa-form\" data-etapa=\"2\" hidden>\n              <legend class=\"sr-only\">Etapa 2 de 2 — Preferências e segurança<\/legend>\n\n              <fieldset class=\"grupo\">\n                <legend>Quais serviços mais te interessam? <span class=\"opcional\">(opcional)<\/span><\/legend>\n                <div class=\"opcoes-chip\">\n                  <label class=\"opcao-chip\"><input type=\"checkbox\" name=\"preferencias\" value=\"corte\"><span>Corte<\/span><\/label>\n                  <label class=\"opcao-chip\"><input type=\"checkbox\" name=\"preferencias\" value=\"barba\"><span>Barba<\/span><\/label>\n                  <label class=\"opcao-chip\"><input type=\"checkbox\" name=\"preferencias\" value=\"capilar\"><span>Tratamento capilar<\/span><\/label>\n                  <label class=\"opcao-chip\"><input type=\"checkbox\" name=\"preferencias\" value=\"pele\"><span>Cuidados com a pele<\/span><\/label>\n                <\/div>\n              <\/fieldset>\n\n              <div class=\"bloco-sensivel\">\n                <div class=\"bloco-sensivel-cabeca\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"/><path d=\"M12 8v5M12 16h.01\"/><\/svg>\n                  <div>\n                    <strong>Alergias e sensibilidades<\/strong>\n                    <p>Ajuda o profissional a escolher produtos com segurança. Somente o profissional do seu atendimento poderá consultar esta informação. Você pode alterá-la ou removê-la no seu perfil.<\/p>\n                  <\/div>\n                <\/div>\n\n                <fieldset class=\"grupo\" aria-describedby=\"cad-alergia-erro\">\n                  <legend>Você tem alguma alergia ou sensibilidade a produtos?<\/legend>\n                  <div class=\"opcoes-radio\">\n                    <label class=\"opcao-radio\"><input type=\"radio\" name=\"alergia\" value=\"sim\" required><span>Sim<\/span><\/label>\n                    <label class=\"opcao-radio\"><input type=\"radio\" name=\"alergia\" value=\"nao\"><span>Não<\/span><\/label>\n                    <label class=\"opcao-radio\"><input type=\"radio\" name=\"alergia\" value=\"nao-sei\"><span>Não sei<\/span><\/label>\n                    <label class=\"opcao-radio\"><input type=\"radio\" name=\"alergia\" value=\"informar-profissional\"><span>Prefiro informar ao profissional<\/span><\/label>\n                  <\/div>\n                  <p class=\"campo-erro\" id=\"cad-alergia-erro\" aria-live=\"polite\"><\/p>\n                <\/fieldset>\n\n                <div id=\"detalhe-alergia\" hidden>\n                  <div class=\"campo\">\n                    <label for=\"cad-alergia-detalhe\">Quais substâncias ou produtos?<\/label>\n                    <textarea id=\"cad-alergia-detalhe\" name=\"alergiaDetalhe\" rows=\"3\" maxlength=\"300\" placeholder=\"Ex.: fragrâncias fortes, determinado tipo de óleo...\" aria-describedby=\"cad-alergia-detalhe-ajuda cad-alergia-detalhe-erro\"><\/textarea>\n                    <p class=\"campo-ajuda\" id=\"cad-alergia-detalhe-ajuda\">Não é necessário informar diagnóstico ou histórico médico.<\/p>\n                    <p class=\"campo-erro\" id=\"cad-alergia-detalhe-erro\" aria-live=\"polite\"><\/p>\n                  <\/div>\n\n                  <label class=\"opcao-check\">\n                    <input type=\"checkbox\" id=\"cad-consentimento-saude\" name=\"consentimentoSaude\" aria-describedby=\"cad-consentimento-saude-erro\">\n                    <span>Autorizo o uso desta informação exclusivamente para a segurança dos meus atendimentos.<\/span>\n                  <\/label>\n                  <p class=\"campo-erro\" id=\"cad-consentimento-saude-erro\" aria-live=\"polite\"><\/p>\n                <\/div>\n\n                <p class=\"campo-ajuda aviso-nao-sei\" id=\"aviso-nao-sei\" hidden>\n                  Sem problema. Avise o profissional antes do atendimento se notar qualquer reação a produtos.\n                <\/p>\n              <\/div>\n\n              <div class=\"campo\">\n                <label for=\"cad-outros\">Outros cuidados que o profissional deve saber <span class=\"opcional\">(opcional)<\/span><\/label>\n                <textarea id=\"cad-outros\" name=\"outros\" rows=\"2\" maxlength=\"300\" placeholder=\"Ex.: couro cabeludo sensível, prefiro não usar navalha...\"><\/textarea>\n              <\/div>\n\n              <div class=\"grupo-termos\">\n                <label class=\"opcao-check\">\n                  <input type=\"checkbox\" id=\"cad-termos\" name=\"termos\" required aria-describedby=\"cad-termos-erro\">\n                  <span>Li e aceito os <a href=\"#\" data-em-breve=\"Termos de uso\">Termos de uso<\/a> e a <a href=\"index.html#privacidade\">Política de privacidade<\/a>.<\/span>\n                <\/label>\n                <p class=\"campo-erro\" id=\"cad-termos-erro\" aria-live=\"polite\"><\/p>\n\n                <label class=\"opcao-check\">\n                  <input type=\"checkbox\" name=\"marketing\">\n                  <span>Quero receber novidades e ofertas do NORDEN. <span class=\"opcional\">(opcional)<\/span><\/span>\n                <\/label>\n              <\/div>\n\n              <div class=\"form-status\" role=\"status\" aria-live=\"polite\"><\/div>\n\n              <div class=\"acoes-etapa\">\n                <button type=\"button\" class=\"btn btn-contorno-escuro\" data-ir-etapa=\"1\">Voltar<\/button>\n                <button type=\"submit\" class=\"btn btn-escuro\">Criar conta<\/b        <p>Horários, endereço e respostas para as perguntas mais comuns sobre agendamento, loja e privacidade.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"secao secao-clara\" id=\"faq\" aria-labelledby=\"titulo-faq\">\n      <div class=\"container\">\n        <div class=\"cabeca-secao revelar\">\n          <div>\n            <span class=\"rotulo\">Dúvidas frequentes<\/span>\n            <h2 class=\"titulo-secao\" id=\"titulo-faq\">Perguntas frequentes<\/h2>\n          <\/div>\n        <\/div>\n\n        <div class=\"faq revelar\">\n          <details>\n            <summary>Preciso criar uma conta para agendar?<\/summary>\n            <p>Você pode explorar serviços, preços e profissionais sem conta. Para confirmar um horário, é preciso entrar ou criar um cadastro rápido — suas escolhas são mantidas durante esse processo.<\/p>\n          <\/details>\n          <details>\n            <summary>O sistema pode mudar meu horário sozinho?<\/summary>\n            <p>Não. O NORDEN Flow apenas sugere uma antecipação quando um horário fica livre. A sua reserva só muda se você aceitar.<\/p>\n          <\/details>\n          <details>\n            <summary>Os produtos que escolho no agendamento são cobrados?<\/summary>\n            <p>Não. A escolha de produtos no agendamento é apenas uma preferência. O profissional verifica se são adequados e registra o que foi realmente usado.<\/p>\n          <\/details>\n          <details>\n            <summary>Como é calculada a taxa de entrega?<\/summary>\n            <p>A taxa é calculada pela distância até o endereço informado e exibida antes da conclusão do pedido. Você também pode optar pela retirada no salão.<\/p>\n          <\/details>\n          <details>\n            <summary>Quem vê minhas informações de alergia?<\/summary>\n            <p>Apenas o profissional responsável pelo seu atendimento, quando necessário. Você pode atualizar ou remover essas informações no seu perfil.<\/p>\n          <\/details>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ======================= CONTATO ======================= -->\n    <section class=\"secao\" id=\"contato\" aria-labelledby=\"titulo-contato\">\n      <div class=\"container\">\n        <div class=\"cabeca-secao revelar\">\n          <div>\n            <span class=\"rotulo\">Contato<\/span>\n            <h2 class=\"titulo-secao\" id=\"titulo-contato\">Visite o NORDEN.<\/h2>\n            <span class=\"aviso-demo\">Endereço, contatos e horários a definir pelo salão.<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"contato revelar\">\n          <div>\n            <h3>Endereço<\/h3>\n            <p>Endereço a definir<br>Cidade — UF<\/p>\n          <\/div>\n          <div>\n            <h3>Horários<\/h3>\n            <dl>\n              <dt>Seg a Sex<\/dt><dd>A definir<\/dd>\n              <dt>Sábado<\/dt><dd>A definir<\/dd>\n              <dt>Domingo<\/dt><dd>A definir<\/dd>\n            <\/dl>\n          <\/div>\n          <div>\n            <h3>Fale conosco<\/h3>\n            <ul>\n              <li>Telefone: a definir<\/li>\n              <li>E-mail: a definir<\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer id=\"rodape\"><\/footer>\n\n  <script src=\"js/core.js\"><\/script>\n  <script src=\"js/script.js\"><\/script>\n<\/body>\n<\/html>\n", "gestao.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Gestão — NORDEN<\/title>\n  <meta name=\"theme-color\" content=\"#0B0B0D\">\n  <meta name=\"robots\" content=\"noindex\">\n\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/app.css\">\n<\/head>\n\n<body class=\"pagina-clara\">\n  <a class=\"skip-link\" href=\"#conteudo\">Pular para o conteúdo<\/a>\n\n  <!-- Cabeçalho com menus suspensos (gerado por js/core.js) -->\n  <header id=\"topo\"><\/header>\n\n  <div class=\"container app-layout\">\n    <!-- Menu lateral (desktop) -->\n    <nav class=\"app-lateral\" id=\"app-lateral\" data-titulo=\"Gestão do salão\" aria-label=\"Gestão do salão\"><\/nav>\n\n    <main id=\"conteudo\">\n      <!-- Menu suspenso de seções (celular/tablet) -->\n      <div class=\"seletor-secao\" id=\"seletor-secao\"><\/div>\n      <section class=\"app-secao\" id=\"secao\" tabindex=\"-1\"><\/section>\n    <\/main>\n  <\/div>\n\n  <footer id=\"rodape\"><\/footer>\n\n  <script src=\"js/core.js\"><\/script>\n  <script src=\"js/ui.js\"><\/script>\n  <script src=\"js/gestao.js\"><\/script>\n<\/body>\n<\/html>\n", "index.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>NORDEN — Salão Masculino Premium<\/title>\n  <meta name=\"description\" content=\"NORDEN, salão inteligente masculino: agende pelo celular, acompanhe seu histórico, receba o manual de cuidados e encontre os produtos usados no seu atendimento.\">\n  <meta name=\"theme-color\" content=\"#0B0B0D\">\n\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/app.css\">\n<\/head>\n\n<body class=\"sem-js\">\n  <a class=\"skip-link\" href=\"#conteudo\">Pular para o conteúdo<\/a>\n\n  <!-- Cabeçalho com menus suspensos (gerado por js/core.js) -->\n  <header id=\"topo\"><\/header>\n\n  <main id=\"conteudo\">\n\n    <!-- ========================= HERO (simples) ========================= -->\n    <section class=\"hero hero-simples\" id=\"inicio\" aria-labelledby=\"titulo-hero\">\n      <div class=\"container\">\n        <div class=\"hero-simbolo\" data-logo role=\"img\" aria-label=\"Símbolo NORDEN\"><\/div>\n        <span class=\"rotulo\">Salão masculino<\/span>\n        <h1 id=\"titulo-hero\">Seu corte marcado pelo celular. <em>E o cuidado continua em casa.<\/em><\/h1>\n        <p class=\"hero-texto\">\n          Escolha o serviço e o horário em poucos toques. Depois do atendimento,\n          você recebe as dicas e os produtos para manter o resultado.\n        <\/p>\n        <div class=\"hero-acoes\">\n          <a href=\"agendar.html\" class=\"btn btn-primario\">Agendar horário<\/a>\n          <a href=\"servicos.html\" class=\"btn btn-contorno\">Ver serviços<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ====================== BENEFÍCIOS ====================== -->\n    <section class=\"faixa faixa-simples\" aria-label=\"Por que o NORDEN\">\n      <div class=\"container\">\n        <ul>\n          <li><strong>Agende fácil<\/strong><span>Preço e duração à vista antes de confirmar.<\/span><\/li>\n          <li><strong>Seu histórico<\/strong><span>Veja o que foi feito em cada atendimento.<\/span><\/li>\n          <li><strong>Cuidado em casa<\/strong><span>Dicas e produtos usados no seu corte.<\/span><\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- ===================== EXPLORAR (MENU EM CARTÕES) ===================== -->\n    <section class=\"secao secao-clara\" id=\"explorar\" aria-labelledby=\"titulo-explorar\">\n      <div class=\"container\">\n        <div class=\"cabeca-secao revelar\">\n          <div>\n            <span class=\"rotulo\">Explore o NORDEN<\/span>\n            <h2 class=\"titulo-secao\" id=\"titulo-explorar\">Tudo organizado, cada coisa no seu lugar.<\/h2>\n            <p class=\"intro-secao\">Use o menu no topo ou escolha por onde começar.<\/p>\n          <\/div>\n        <\/div>\n        <ul class=\"grade-servicos\">\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">01<\/span>\n            <h3>Serviços<\/h3>\n            <p>Cortes, barba, tratamentos capilares e de pele, com preço e duração à vista.<\/p>\n            <a href=\"servicos.html\" class=\"link-seta\">Ver serviços →<\/a>\n          <\/li>\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">02<\/span>\n            <h3>Profissionais<\/h3>\n            <p>Conheça as especialidades da equipe e agende com quem preferir.<\/p>\n            <a href=\"profissionais.html\" class=\"link-seta\">Conhecer a equipe →<\/a>\n          <\/li>\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">03<\/span>\n            <h3>Loja NORDEN<\/h3>\n            <p>Os produtos usados no seu atendimento, com retirada no salão ou entrega.<\/p>\n            <a href=\"loja.html\" class=\"link-seta\">Ir para a loja →<\/a>\n          <\/li>\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">04<\/span>\n            <h3>Minha conta<\/h3>\n            <p>Agendamentos, ofertas de horário, jornada, manuais de cuidados e pedidos.<\/p>\n            <a href=\"cliente.html\" class=\"link-seta\">Acessar minha conta →<\/a>\n          <\/li>\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">05<\/span>\n            <h3>Área da equipe<\/h3>\n            <p>Agenda, encaixes do NORDEN Flow, registro de atendimentos, estoque e pedidos.<\/p>\n            <a href=\"gestao.html\" class=\"link-seta\">Acessar gestão →<\/a>\n          <\/li>\n          <li class=\"servico revelar\">\n            <span class=\"servico-num\">06<\/span>\n            <h3>Contato e dúvidas<\/h3>\n            <p>Horários, endereço e respostas para as perguntas mais comuns.<\/p>\n            <a href=\"contato.html\" class=\"link-seta\">Ver contato →<\/a>\n          <\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- ================= ANTES / DURANTE / DEPOIS ================= -->\n    <section class=\"secao\" id=\"como-funciona\" aria-labelledby=\"titulo-como-funciona\">\n      <div class=\"container\">\n        <div class=\"cabeca-secao revelar\">\n          <div>\n            <span class=\"rotulo\">Como funciona<\/span>\n            <h2 class=\"titulo-secao\" id=\"titulo-como-funciona\">Antes, durante e depois do seu atendimento.<\/h2>\n            <p class=\"intro-secao\">O NORDEN conecta cada etapa: você sabe o que esperar, o profissional registra o que foi feito e o resultado continua com você.<\/p>\n          <\/div>\n        <\/div>\n\n        <ol class=\"etapas\">\n          <li class=\"etapa revelar\">\n            <div class=\"etapa-fase\"><small>Etapa 01<\/small>Antes<\/div>\n            <ul>\n              <li>Escolha serviço, profissional e horário disponível<\/li>\n              <li>Veja preço e duração antes de confirmar<\/li>\n              <li>Indique produtos de preferência, se quiser<\/li>\n              <li>Informe alergias com privacidade<\/li>\n            <\/ul>\n          <\/li>\n          <li class=\"etapa revelar\">\n            <div class=\"etapa-fase\"><small>Etapa 02<\/small>Durante<\/div>\n            <ul>\n              <li>O profissional consulta os alertas necessários<\/li>\n              <li>Executa o serviço combinado<\/li>\n              <li>Registra os produtos efetivamente utilizados<\/li>\n            <\/ul>\n          <\/li>\n          <li class=\"etapa revelar\">\n            <div class=\"etapa-fase\"><small>Etapa 03<\/small>Depois<\/div>\n            <ul>\n              <li>O atendimento entra na sua linha do tempo<\/li>\n              <li>Você recebe o manual de cuidados<\/li>\n              <li>Pode comprar os produtos usados, com retirada ou entrega<\/li>\n              <li>Agende o retorno quando for a hora<\/li>\n            <\/ul>\n          <\/li>\n        <\/ol>\n      <\/div>\n    <\/section>\n\n    <!-- ===================== DIFERENCIAIS ===================== -->\n    <section class=\"secao secao-grafite\" id=\"diferenciais\" aria-labelledby=\"titulo-diferenciais\">\n      <div class=\"container\">\n        <div class=\"cabeca-secao revelar\">\n          <div>\n            <span class=\"rotulo\">Ecossistema NORDEN<\/span>\n            <h2 class=\"titulo-secao\" id=\"titulo-diferenciais\">Mais que uma agenda online.<\/h2>\n          <\/div>\n        <\/div>\n\n        <ul class=\"diferenciais\">\n          <li class=\"diferencial revelar\">\n            <span class=\"diferencial-icone\" aria-hidden=\"true\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"1\"/><path d=\"M3 9h18M8 2v4M16 2v4M9 15l2 2 4-4\"/><\/svg>\n            <\/span>\n            <h3>NORDEN <span>Flow<\/span><\/h3>\n            <p>Quando alguém cancela, o sistema sugere antecipações compatíveis com a duração do serviço. A mudança só acontece com a sua confirmação.<\/p>\n          <\/li>\n          <li class=\"diferencial revelar\">\n            <span class=\"diferencial-icone\" aria-hidden=\"true\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M12 3v18\"/><circle cx=\"12\" cy=\"6\" r=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><circle cx=\"12\" cy=\"18\" r=\"2\"/><path d=\"M15 6h5M15 12h5M15 18h5\"/><\/svg>\n            <\/span>\n            <h3>NORDEN <span>Journey<\/span><\/h3>\n            <p>Sua linha do tempo com cada procedimento, data, profissional e produtos utilizados. Nunca mais esqueça o nome daquela pomada.<\/p>\n          <\/li>\n          <li class=\"diferencial revelar\">\n            <span class=\"diferencial-icone\" aria-hidden=\"true\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M5 3h11l3 3v15H5z\"/><path d=\"M9 9h6M9 13h6M9 17h4\"/><\/svg>\n            <\/span>\n            <h3>NORDEN <span>Care<\/span><\/h3>\n            <p>Manual de cuidados vinculado a cada atendimento, revisado pelo profissional, para preservar o corte, a barba e a pele.<\/p>\n          <\/li>\n          <li class=\"diferencial revelar\">\n            <span class=\"diferencial-icone\" aria-hidden=\"true\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 7h16l-1.5 13h-13z\"/><path d=\"M9 7V5a3 3 0 0 1 6 0v2\"/><\/svg>\n            <\/span>\n            <h3>NORDEN <span>Store<\/span><\/h3>\n            <p>Os produtos usados no seu atendimento, prontos para levar. Retire no salão ou receba em casa com taxa calculada antes de pagar.<\/p>\n          <\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- ===================== PRIVACIDADE ===================== -->\n    <section class=\"secao secao-grafite\" id=\"privacidade\" aria-labelledby=\"titulo-privacidade\">\n      <div class=\"container privacidade\">\n        <div class=\"revelar\">\n          <span class=\"rotulo\">Privacidade<\/span>\n          <h2 class=\"titulo-secao\" id=\"titulo-privacidade\">Seus dados sensíveis, sob o seu controle.<\/h2>\n          <p class=\"intro-secao\">Alergias e sensibilidades ajudam a garantir um atendimento seguro. Por isso explicamos por que pedimos cada informação e quem pode vê-la.<\/p>\n        <\/div>\n        <ul class=\"privacidade-pontos revelar\">\n          <li><strong>Coleta mínima<\/strong><span>Pedimos apenas o necessário para o seu atendimento.<\/span><\/li>\n          <li><strong>Finalidade clara<\/strong><span>Cada campo explica para que serve antes de você preencher.<\/span><\/li>\n          <li><strong>Acesso restrito<\/strong><span>Somente o profissional do seu atendimento consulta os alertas.<\/span><\/li>\n          <li><strong>Você decide<\/strong><span>Consulte, atualize ou remova suas informações pelo seu perfil.<\/span><\/li>\n        <\/ul>\n      <\/div>\n    <\/section>\n\n    <!-- ======================= CTA FINAL ======================= -->\n    <section class=\"secao secao-clara cta-final\" aria-labelledby=\"titulo-cta\">\n      <div class=\"container revelar\">\n        <span class=\"rotulo\">Seu próximo horário<\/span>\n        <h2 id=\"titulo-cta\" style=\"margin-top:1rem\">Resolva pelo celular. Cuide do resultado depois.<\/h2>\n        <p>Escolha o serviço, veja o preço e a duração e confirme em poucos passos.<\/p>\n        <div class=\"hero-acoes\">\n          <a href=\"agendar.html\" class=\"btn btn-escuro\">Agendar agora<\/a>\n          <a href=\"cadastro.html\" class=\"btn btn-contorno-escuro\">Criar conta<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer id=\"rodape\"><\/footer>\n\n  <script src=\"js/core.js\"><\/script>\n  <script src=\"js/script.js\"><\/script>\n<\/body>\n<\/html>\n", "login.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Entrar — NORDEN<\/title>\n  <meta name=\"description\" content=\"Acesse sua conta NORDEN para agendar, acompanhar sua jornada e seus pedidos.\">\n  <meta name=\"theme-color\" content=\"#0B0B0D\">\n\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/auth.css\">\n<\/head>\n\n<body class=\"pagina-auth\">\n  <a class=\"skip-link\" href=\"#co ef=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/app.css\">\n<\/head>\n\n<body class=\"pagina-clara\">\n  <a class=\"skip-link\" href=\"#conteudo\">Pular para o conteúdo<\/a>\n\n  <!-- Cabeçalho com menus suspensos (gerado por js/core.js) -->\n  <header id=\"topo\"><\/header>\n\n  <main id=\"conteudo\">\n    <section class=\"pagina-cabeca\">\n      <div class=\"container\">\n        <nav class=\"migalhas\" aria-label=\"Você está em\"><a href=\"index.html\">Início<\/a> / O Salão / Profissionais<\/nav>\n        <h1>Profissionais.<\/h1>\n        <p>Especialistas em cuidado masculino. Veja dias de atendimento e serviços realizados.<\/p>\n        <span class=\"aviso-demo\">Perfis de exemplo — a equipe real será publicada com fotos autorizadas.<\/span>\n      <\/div>\n    <\/section>\n\n    <section class=\"conteudo-pagina\">\n      <div class=\"container\">\n        <ul class=\"grade-3\" id=\"lista-profissionais-publica\"><\/ul>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer id=\"rodape\"><\/footer>\n\n  <script src=\"js/core.js\"><\/script>\n  <script src=\"js/publico.js\"><\/script>\n<\/body>\n<\/html>\n", "servicos.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Serviços — NORDEN<\/title>\n  <meta name=\"description\" content=\"Serviços do NORDEN com preço, duração e profissionais.\">\n  <meta name=\"theme-color\" content=\"#0B0B0D\">\n\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\n  <link rel=\"stylesheet\" href=\"css/style.css\">\n  <link rel=\"stylesheet\" href=\"css/app.css\">\n<\/head>\n\n<body class=\"pagina-clara\">\n  <a class=\"skip-link\" href=\"#conteudo\">Pular para o conteúdo<\/a>\n\n  <!-- Cabeçalho com menus suspensos (gerado por js/core.js) -->\n  <header id=\"topo\"><\/header>\n\n  <main id=\"conteudo\">\n    <section class=\"pagina-cabeca\">\n      <div class=\"container\">\n        <nav class=\"migalhas\" aria-label=\"Você está em\"><a href=\"index.html\">Início<\/a> / O Salão / Serviços<\/nav>\n        <h1>Serviços.<\/h1>\n        <p>Preço e duração visíveis antes de agendar. Escolha um serviço para começar.<\/p>\n        <span class=\"aviso-demo\">Catálogo e valores ilustrativos — sujeitos à definição do salão.<\/span>\n      <\/div>\n    <\/section>\n\n    <section class=\"conteudo-pagina\">\n      <div class=\"container\">\n        <ul class=\"grade-servicos\" id=\"lista-servicos-publica\"><\/ul>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer id=\"rodape\"><\/footer>\n\n  <script src=\"js/core.js\"><\/script>\n  <script src=\"js/publico.js\"><\/script>\n<\/body>\n<\/html>\n"}, "arquivos": {"css/agendar.css": "/* =========================================================\n   NORDEN — Tela de agendamento\n   Depende de style.css (tokens) e auth.css (campos, botões, avisos)\n   ========================================================= */\n\n/* ------------------- Barra superior ------------------- */\n.agendar-topo { background: var(--onix); color: var(--soft-stone); border-bottom: 1px solid var(--linha-escura); }\n.agendar-topo .container { display: flex; align-items: center; justify-content: space-between; height: 68px; }\n.agendar-topo .marca { text-decoration: none; }\n.agendar-topo nav { display: flex; gap: 1.25rem; }\n.agendar-topo-link { font-size: .88rem; text-decoration: none; color: var(--texto-suave-escuro); padding: .5rem 0; }\n.agendar-topo-link:hover { color: var(--soft-stone); }\n@media (max-width: 520px) { .agendar-topo .marca-sub { display: none; } }\n\n/* ------------------- Estrutura ------------------- */\n.agendar { padding-block: 2rem 7rem; }\n.agendar-cabeca .aviso-modo-demo { margin: 1.25rem 0 0; max-width: 720px; }\n\n.agendar-grade { display: grid; gap: 2rem; margin-top: 2rem; align-items: start; }\n@media (min-width: 980px) {\n  .agendar { padding-bottom: 4rem; }\n  .agendar-grade { grid-template-columns: minmax(0, 1fr) 340px; gap: 3rem; }\n}\n\n/* ------------------- Indicador de etapas ------------------- */\n.etapas-agendar { display: flex; gap: .4rem; margin-top: 2rem; }\n.etapas-agendar li { flex: 1; }\n.etapas-agendar button {\n  width: 100%; display: flex; align-items: center; gap: .55rem;\n  padding: .85rem 0 0; background: none; border: 0; border-top: 2px solid rgba(11,11,13,.15);\n  font: inherit; font-size: .8rem; font-weight: 600; color: var(--texto-suave-claro); text-align: left;\n}\n.etapas-agendar button:not([disabled]) { cursor: pointer; }\n.etapas-agendar button:not([disabled]):hover em { text-decoration: underline; }\n.etapas-agendar span {\n  display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0;\n  border: 1px solid currentColor; border-radius: 50%; font-size: .72rem;\n}\n.etapas-agendar em { font-style: normal; }\n.etapas-agendar li.ativa button { border-color: var(--onix); color: var(--onix); }\n.etapas-agendar li.ativa span { background: var(--onix); border-color: var(--onix); color: var(--soft-stone); }\n.etapas-agendar li.concluida button { border-color: var(--bronze-escuro); color: var(--onix); }\n.etapas-agendar li.concluida span { background: var(--bronze-escuro); border-color: var(--bronze-escuro); color: var(--soft-stone); }\n@media (max-width: 720px) {\n  .etapas-agendar em { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }\n  .etapas-agendar li.ativa em { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: nowrap; }\n  .etapas-agendar li.ativa { flex: 2.5; }\n}\n\n/* ------------------- Etapas ------------------- */\n.passo[hidden] { display: none; }\n.passo { display: grid; gap: 1.25rem; }\n.passo-intro { color: var(--texto-suave-claro); max-width: 62ch; }\n.passo-intro strong { color: var(--onix); }\n.passo-subtitulo { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--texto-suave-claro); margin-top: .5rem; }\n.estado-vazio {\n  padding: 1.25rem; border: 1px dashed var(--borda-campo); border-radius: var(--raio);\n  color: var(--texto-suave-claro); font-size: .92rem; background: var(--stone-claro);\n}\n.estado-vazio[hidden] { display: none; }\n\n/* Cartões selecionáveis (serviço e profissional) */\n.lista-opcoes { display: grid; gap: .75rem; }\n@media (min-width: 640px) { .lista-opcoes { grid-template-columns: 1fr 1fr; } }\n\n.opcao-cartao {\n  position: relative; display: grid; gap: .45rem; text-align: left; width: 100%;\n  padding: 1.25rem 1.25rem 1.1rem; font: inherit; color: var(--onix);\n  background: var(--stone-claro); border: 1px solid var(--borda-campo); border-radius: var(--raio);\n  cursor: pointer; transition: border-color var(--transicao), background var(--transicao), box-shadow var(--transicao);\n}\n.opcao-cartao:hover { border-color: var(--onix); background: #fff; }\n.opcao-cartao[aria-checked=\"true\"] { border-color: var(--onix); background: #fff; box-shadow: inset 0 0 0 1px var(--onix); }\n.opcao-cartao[aria-checked=\"true\"]::after {\n  content: \"✓\"; position: absolute; top: .9rem; right: .9rem;\n  width: 24px; height: 24px; display: grid; place-items: center;\n  border-radius: 50%; background: var(--onix); color: var(--soft-stone); font-size: .75rem; font-weight: 700;\n}\n.opcao-titulo { font-family: var(--fonte-marca); font-weight: 600; font-size: 1.05rem; padding-right: 2rem; }\n.opcao-desc { font-size: .88rem; color: var(--texto-suave-claro); }\n.opcao-meta {\n  display: flex; justify-content: space-between; gap: 1rem; margin-top: .4rem; padding-top: .7rem;\n  border-top: 1px solid var(--linha-clara); font-size: .88rem;\n}\n.opcao-meta strong { font-family: var(--fonte-marca); }\n.opcao-meta span { color: var(--texto-suave-claro); }\n\n.opcao-profissional { grid-template-columns: auto 1fr; align-items: center; column-gap: 1rem; }\n.avatar {\n  grid-row: span 2; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;\n  background: var(--grafite); color: var(--bronze-claro); font-family: var(--fonte-marca); font-weight: 700; font-size: .9rem;\n}\n.avatar.qualquer { background: transparent; border: 1px dashed var(--steel-taupe); color: var(--onix); font-size: 1.2rem; }\n.opcao-profissional .tags { grid-column: 2; }\n.opcao-profissional .tag { border-color: var(--linha-clara); color: var(--texto-suave-claro); }\n\n/* Produtos */\n.lista-produtos { display: grid; gap: .75rem; }\n.produto-opcao {\n  display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center;\n  padding: 1rem 1.1rem; background: var(--stone-claro); border: 1px solid var(--borda-campo); border-radius: var(--raio); cursor: pointer;\n  transition: border-color var(--transicao), background var(--transicao);\n}\n.produto-opcao:hover { border-color: var(--onix); }\n.produto-opcao:has(input:checked) { border-color: var(--onix); background: #fff; box-shadow: inset 0 0 0 1px var(--onix); }\n.produto-opcao input { width: 20px; height: 20px; accent-color: var(--onix); margin: 0; }\n.produto-opcao strong { display: block; font-family: var(--fonte-marca); font-weight: 600; font-size: .95rem; }\n.produto-opcao small { color: var(--texto-suave-claro); font-size: .84rem; }\n.produto-opcao .preco { font-family: var(--fonte-marca); font-weight: 600; font-size: .92rem; white-space: nowrap; }\n\n/* Datas */\n.lista-datas { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; scroll-snap-type: x mandatory; }\n.data-opcao {\n  flex: 0 0 74px; scroll-snap-align: start; display: grid; gap: .15rem; justify-items: center;\n  padding: .75rem .25rem; font: inherit; color: var(--onix);\n  background: var(--stone-claro); border: 1px solid var(--borda-campo); border-radius: var(--raio); cursor: pointer;\n}\n.data-opcao small { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--texto-suave-claro); }\n.data-opcao strong { font-family: var(--fonte-marca); font-size: 1.35rem; line-height: 1.1; }\n.data-opcao span { font-size: .72rem; color: var(--texto-suave-claro); }\n.data-opcao:hover:not([disabled]) { border-color: var(--onix); }\n.data-opcao[aria-checked=\"true\"] { background: var(--onix); border-color: var(--onix); color: var(--soft-stone); }\n.data-opcao[aria-checked=\"true\"] small, .data-opcao[aria-checked=\"true\"] span { color: var(--texto-suave-escuro); }\n.data-opcao[disabled] { cursor: not-allowed; opacity: .55; background: transparent; border-style: dashed; }\n.data-opcao[disabled] strong { text-decoration: line-through; }\n\n/* Horários */\n.lista-horarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .5rem; }\n.lista-horarios:empty { display: none; }\n.horario-opcao {\n  min-height: 48px; font: inherit; font-weight: 600; font-size: .95rem; color: var(--onix);\n  background: var(--stone-claro); border: 1px solid var(--borda-campo); border-radius: var(--raio); cursor: pointer;\n}\n.horario-opcao:hover { border-color: var(--onix); background: #fff; }\n.horario-opcao[aria-checked=\"true\"] { background: var(--onix); border-color: var(--onix); color: var(--soft-stone); }\n.grupo-periodo { grid-column: 1 / -1; font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--texto-suave-claro); margin-top: .5rem; }\n.grupo-periodo:first-child { margin-top: 0; }\n\n/* Revisão */\n.revisao { margin: 0; border: 1px solid var(--linha-clara); border-radius: var(--raio); background: var(--stone-claro); }\n.revisao div { display: flex; justify-content: space-between; gap: 1.5rem; padding: .95rem 1.15rem; border-bottom: 1px solid var(--linha-clara); }\n.revisao div:last-child { border-bottom: 0; }\n.revisao dt { color: var(--texto-suave-claro); font-size: .9rem; }\n.revisao dd { margin: 0; text-align: right; font-weight: 600; }\n.revisao .total dd { font-family: var(--fonte-marca); font-size: 1.15rem; }\n.revisao .editar { background: none; border: 0; padding: 0; margin-left: .5rem; font: inherit; font-size: .8rem; color: #6E5236; text-decoration: underline; cursor: pointer; }\n\n.politica { padding: 1rem 1.15rem; border-left: 3px solid var(--bronze); background: var(--stone-claro); border-radius: var(--raio); font-size: .9rem; }\n.politica strong { font-family: var(--fonte-marca); }\n.politica p { color: var(--texto-suave-claro); margin-top: .3rem; }\n\n/* Ações */\n.passo-acoes { display: flex; gap: .75rem; margin-top: 2rem; }\n.passo-acoes .btn { flex: 1 1 0; }\n.passo-acoes #btn-voltar[hidden] { display: none; }\n@media (min-width: 640px) { .passo-acoes { justify-content: flex-end; } .passo-acoes .btn { flex: 0 0 auto; min-width: 170px; } }\n\n/* ------------------- Resumo lateral ------------------- */\n.resumo {\n  background: var(--onix); color: var(--soft-stone); border-radius: var(--raio);\n  padding: 1.75rem; position: sticky; top: 1.5rem;\n}\n.resumo-titulo { font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--bronze-claro); }\n.resumo-lista { margin: 1.25rem 0 0; display: grid; gap: .85rem; }\n.resumo-lista div { display: grid; gap: .1rem; }\n.resumo-lista dt { font-size: .75rem; color: var(--texto-suave-escuro); }\n.resumo-lista dd { margin: 0; font-size: .95rem; }\n.resumo-total {\n  display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; padding-top: 1.25rem;\n  border-top: 1px solid var(--linha-escura); font-size: .85rem; color: var(--texto-suave-escuro);\n}\n.resumo-total strong { display: block; font-family: var(--fonte-marca); font-size: 1.3rem; color: var(--soft-stone); }\n.resumo-nota { margin-top: 1rem; font-size: .78rem; color: var(--texto-suave-claro); }\n.resumo .resumo-nota { color: var(--texto-suave-escuro); }\n\n@media (max-width: 979px) { .resumo { display: none; } }\n\n/* Barra fixa de resumo no celular */\n.resumo-movel {\n  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;\n  display: flex; justify-content: space-between; align-items: center; gap: 1rem;\n  padding: .9rem 1.25rem; background: var(--onix); color: var(--soft-stone);\n  font-size: .88rem; border-top: 1px solid var(--linha-escura);\n}\n.resumo-movel > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto-suave-escuro); }\n.resumo-movel strong { font-family: var(--fonte-marca); white-space: nowrap; }\n@media (min-width: 980px) { .resumo-movel { display: none; } }\n.resumo-movel[hidden] { display: none; }\n\n/* ------------------- Confirmação ------------------- */\n.confirmado { max-width: 560px; margin: 2.5rem auto 0; text-align: center; display: grid; gap: 1rem; }\n.confirmado[hidden] { display: none; }\n.confirmado .revisao { text-align: left; margin-top: .5rem; }\n.status-reserva {\n  justify-self: center; font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;\n  padding: .35rem .8rem; border: 1px solid var(--sucesso); color: var(--sucesso); border-radius: 999px;\n}\n.confirmado .acoes-etapa { margin-top: 1rem; }\n", "css/app.css": "/* =========================================================\n   NORDEN — Navegação com menus suspensos e componentes do app\n   Depende dos tokens de style.css\n   ========================================================= */\n\n:root {\n  --erro: #9B2C2C;\n  --sucesso: #2F5D3A;\n  --alerta: #7A5A12;\n  --borda-campo: var(--steel-taupe);\n}\n\n/* ===================== MENUS SUSPENSOS ===================== */\n.nav-menus { display: none; }\n.menu-raiz { display: flex; gap: .25rem; }\n.menu-grupo { position: relative; }\n.menu-gatilho {\n  display: inline-flex; align-items: center; gap: .45rem; min-height: 44px; padding: 0 .9rem;\n  background: none; border: 0; border-radius: var(--raio); cursor: pointer;\n  font: inherit; font-size: .9rem; color: var(--texto-suave-escuro);\n  transition: color var(--transicao), background var(--transicao);\n}\n.menu-gatilho:hover, .menu-gatilho[aria-expanded=\"true\"] { color: var(--soft-stone); background: rgba(231,226,219,.06); }\n.menu-gatilho svg { transition: transform var(--transicao); }\n.menu-gatilho[aria-expanded=\"true\"] svg { transform: rotate(180deg); }\n\n.menu-suspenso {\n  position: absolute; top: calc(100% + .5rem); left: 0; z-index: 60; min-width: 260px;\n  padding: .5rem; background: var(--grafite); border: 1px solid var(--linha-escura); border-radius: 6px;\n  box-shadow: 0 24px 48px -16px rgba(0,0,0,.7);\n}\n.menu-suspenso[hidden] { display: none; }\n.menu-suspenso a {\n  display: grid; gap: .1rem; padding: .7rem .85rem; border-radius: var(--raio);\n  text-decoration: none; color: var(--soft-stone); font-size: .92rem;\n}\n.menu-suspenso a small { color: var(--texto-suave-escuro); font-size: .76rem; }\n.menu-suspenso a:hover, .menu-suspenso a:focus-visible { background: rgba(231,226,219,.07); }\n.menu-suspenso a:hover span { color: var(--bronze-claro); }\n.menu-suspenso li:last-child a[data-sair] { border-top: 1px solid var(--linha-escura); border-radius: 0; margin-top: .35rem; padding-top: .85rem; }\n\n.nav-movel-extra { display: none; }\n\n.btn-carrinho {\n  position: relative; width: 44px; height: 44px; display: grid; place-items: center;\n  color: var(--soft-stone); border-radius: var(--raio); text-decoration: none;\n}\n.btn-carrinho:hover { background: rgba(231,226,219,.08); }\n.contador-carrinho {\n  position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px;\n  display: grid; place-items: center; border-radiu a .btn { width: 100%; }\n\n/* ===================== CORREÇÕES DE CONTRASTE =====================\n   Páginas de fundo claro definem texto escuro no body; áreas escuras\n   dentro delas precisam redefinir a cor do texto. */\n.pagina-cabeca { color: var(--soft-stone); }\n\n/* Rótulos em bronze: tom escurecido sobre fundo claro, tom claro sobre fundo escuro */\n.pagina-clara .rotulo, .pagina-auth .rotulo { color: var(--bronze-escuro); }\n.pagina-clara .pagina-cabeca .rotulo, .pagina-auth .auth-marca .rotulo { color: var(--bronze-claro); }\n\n/* Etapas concluídas: número claro sobre bronze escuro */\n.etapas-agendar li.concluida span, .etapas-form li.concluida span { background: var(--bronze-escuro); border-color: var(--bronze-escuro); }\n.etapas-agendar li.concluida button, .etapas-form li.concluida { border-color: var(--bronze-escuro); }\n\n/* Estrelas: visíveis também quando vazias */\n.estrelas button { color: #7A7068; }\n.estrelas button.ativa { color: var(--bronze-escuro); }\n\n", "css/auth.css": "/* =========================================================\n   NORDEN — Telas de autenticação (login, cadastro, recuperar)\n   Depende dos tokens definidos em style.css\n   ========================================================= */\n\n:root {\n  --erro:        #9B2C2C; /* contraste AA sobre soft stone */\n  --sucesso:     #2F5D3A;\n  --borda-campo: var(--steel-taupe); /* contraste 3:1 para componentes */\n}\n\n.pagina-auth { background: var(--soft-stone); color: var(--onix); }\n\n.auth { min-height: 100vh; display: grid; }\n\n/* ------------------- Painel da marca ------------------- */\n.auth-marca {\n  display: none;\n  background:\n    radial-gradient(ellipse 70% 50% at 90% 10%, rgba(142,107,71,.18), transparent 70%),\n    linear-gradient(180deg, var(--onix), var(--grafite));\n  color: var(--soft-stone);\n  padding: 3rem clamp(2rem, 4vw, 4rem);\n  flex-direction: column; justify-content: space-between; gap: 3rem;\n  position: sticky; top: 0; height: 100vh;\n}\n.auth-marca .marca { text-decoration: none; }\n.auth-marca h2 { font-size: clamp(1.8rem, 2.6vw, 2.5rem); font-weight: 700; margin-top: 1.25rem; max-width: 18ch; }\n.auth-beneficios { margin-top: 2.5rem; display: grid; gap: 1.5rem; }\n.auth-beneficios li { padding-left: 1.5rem; position: relative; }\n.auth-beneficios li::before {\n  content: \"\"; position: absolute; left: 0; top: .5rem;\n  width: 8px; height: 8px; background: var(--bronze); transform: rotate(45deg);\n}\n.auth-beneficios strong { display: block; font-family: var(--fonte-marca); font-weight: 600; }\n.auth-beneficios span { color: var(--texto-suave-escuro); font-size: .92rem; }\n.auth-marca-rodape { font-size: .75rem; color: var(--texto-suave-escuro); }\n\n/* ------------------- Área do formulário ------------------- */\n.auth-conteudo {\n  display: flex; flex-direction: column;\n  padding: 1.25rem 1.25rem 3rem;\n}\n.auth-topo-movel {\n  margin: -1.25rem -1.25rem 1.5rem; padding: 1.1rem 1.25rem;\n  background: var(--onix); color: var(--soft-stone);\n}\n.auth-topo-movel .marca { text-decoration: none; }\n.auth-topo-movel .marca-nome { font-size: 1.2rem; }\n\n.auth-voltar {\n  align-self: flex-start; font-size: .85rem; text-decoration: none; color: var(--texto-suave-claro);\n  padding: .5rem 0; margin-bottom: 1rem;\n}\n.auth-voltar:hover { color: var(--onix); text-decoration: underline; }\n\n.auth-caixa { width: 100%; max-width: 460px; margin-inline: auto; }\n.auth-cadastro .auth-caixa { max-width: 560px; }\n\n.auth .rotulo { color: #6E5236; }\n.auth-marca .rotulo { color: var(--bronze-claro); }\n\n.auth-titulo { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700; margin-top: .9rem; }\n.auth-titulo:focus { outline: none; }\n.auth-intro { margin-top: .75rem; color: var(--texto-suave-claro); }\n\n.aviso-modo-demo {\n  margin-bottom: 2rem; padding: .85rem 1rem; font-size: .85rem;\n  background: var(--stone-claro); border-left: 3px solid var(--bronze); border-radius: var(--raio);\n  color: var(--texto-suave-claro);\n}\n.aviso-modo-demo strong { color: var(--onix); }\n\n.auth-alternativa { margin-top: 1.75rem; text-align: center; font-size: .95rem; color: var(--texto-suave-claro); }\n.auth-alternativa a { color: var(--onix); font-weight: 600; }\n.auth-nota { margin-top: 1rem; text-align: center; font-size: .8rem; color: var(--texto-suave-claro); }\n\n@media (min-width: 960px) {\n  .auth { grid-template-columns: 5fr 7fr; }\n  .auth-marca { display: flex; }\n  .auth-topo-movel { display: none; }\n  .auth-conteudo { padding: 2.5rem clamp(2rem, 5vw, 5rem) 4rem; justify-content: center; }\n  .auth-voltar { position: absolute; top: 2rem; right: clamp(2rem, 4vw, 4rem); margin: 0; }\n  .auth-conteudo { position: relative; }\n}\n\n/* ======================= FORMULÁRIO ======================= */\n.form { margin-top: 2rem; display: grid; gap: 1.35rem; }\n.etapa-form { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 1.35rem; }\n.etapa-form[hidden] { display: none; }\n\n.campo { display: grid; gap: .45rem; }\n.campos-duplos { display: grid; gap: 1.35rem; }\n@media (min-width: 560px) { .campos-duplos { grid-template-columns: 1fr 1fr; } }\n\n.campo label, .grupo legend {\n  font-size: .88rem; font-weight: 600; color: var(--onix);\n}\n.campo-rotulo-linha { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }\n.opcional { font-weight: 400; color: var(--texto-suave-claro); }\n\n.campo input, .campo textarea {\n  width: 100%; min-height: 50px; padding: .8rem 1rem;\n  font: inherit; font-size: 1rem; color: var(--onix);\n  background: var(--stone-claro);\n  border: 1px solid var(--borda-campo); border-radius: var(--raio);\n  transition: border-color var(--transicao), box-shadow var(--transicao), background var(--transicao);\n}\n.campo textarea { resize: vertical; min-height: 84px; }\n.campo input::placeholder, .campo textarea::placeholder { color: #8A8178; }\n.campo input:hover, .campo textarea:hover { border-color: var(--onix); }\n.campo input:focus, .campo textarea:focus {\n  outline: none; background: #fff; border-color: var(--onix);\n  box-shadow: 0 0 0 3px rgba(142,107,71,.35);\n}\n.campo input[aria-invalid=\"true\"], .campo textarea[aria-invalid=\"true\"] {\n  border-color: var(--erro); box-shadow: 0 0 0 1px var(--erro);\n}\n\n.campo-ajuda { font-size: .8rem; color: var(--texto-suave-claro); }\n.campo-erro { font-size: .82rem; color: var(--erro); font-weight: 500; min-height: 0; }\n.campo-erro:empty { display: none; }\n.campo-erro:not(:empty)::before { content: \"⚠ \"; }\n\n/* Senha com botão mostrar/ocultar */\n.campo-senha { position: relative; }\n.campo-senha input { padding-right: 5.5rem; }\n.btn-ver-senha {\n  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);\n  min-height: 38px; padding: 0 .8rem;\n  background: transparent; border: 0; border-radius: var(--raio);\n  font: inherit; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;\n  color: var(--texto-suave-claro); cursor: pointer;\n}\n.btn-ver-senha:hover { color: var(--onix); background: rgba(11,11,13,.06); }\n\n.link-discreto { font-size: .82rem; color: var(--texto-suave-claro); }\n.link-discreto:hover { color: var(--onix); }\n\n/* Regras da senha */\n.regras-senha { display: flex; flex-wrap: wrap; gap: .35rem 1rem; font-size: .8rem; color: var(--texto-suave-claro); }\n.regras-senha li { display: flex; align-items: center; gap: .4rem; }\n.regras-senha li::before { content: \"○\"; font-size: .75rem; }\n.regras-senha li.ok { color: var(--sucesso); }\n.regras-senha li.ok::before { content: \"✓\"; font-weight: 700; }\n\n/* Botões */\n.btn-bloco { width: 100%; }\n.btn[disabled], .btn.carregando { opacity: .7; cursor: progress; transform: none; }\n.btn.carregando::after {\n  content: \"\"; width: 14px; height: 14px; border-radius: 50%;\n  border: 2px solid currentColor; border-right-color: transparent;\n  animation: girar .7s linear infinite;\n}\n@keyframes girar { to { transform: rotate(360deg); } }\n\n.acoes-etapa { display: flex; gap: .75rem; flex-wrap: wrap; }\n.acoes-etapa .btn { flex: 1 1 160px; }\n\n/* Mensagem de status do formulário */\n.form-status:empty { display: none; }\n.form-status {\n  padding: .9rem 1rem; border-radius: var(--raio); font-size: .9rem;\n  background: var(--stone-claro); border-left: 3px solid var(--onix);\n}\n.form-status.erro { border-color: var(--erro); color: var(--erro); }\n.form-status.info { border-color: var(--bronze); color: var(--onix); }\n\n/* ------------------- Indicador de etapas ------------------- */\n.etapas-form { display: flex; gap: .5rem; margin-top: 1.75rem; counter-reset: none; }\n.etapas-form li {\n  flex: 1; display: flex; align-items: center; gap: .6rem;\n  padding-top: .85rem; border-top: 2px solid rgba(11,11,13,.15);\n  font-size: .8rem; font-weight: 600; color: var(--texto-suave-claro);\n}\n.etapas-form li span {\n  display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0;\n  border: 1px solid currentColor; border-radius: 50%; font-size: .72rem;\n}\n.etapas-form li.ativa { border-color: var(--onix); color: var(--onix); }\n.etapas-form li.ativa span { background: var(--onix); color: var(--soft-stone); border-color: var(--onix); }\n.etapas-form li.concluida { border-color: var(--bronze-escuro); color: var(--onix); }\n.etapas-form li.concluida span { background: var(--bronze-escuro); border-color: var(--bronze-escuro); color: var(--soft-stone); }\n\n/* ------------------- Grupos, chips e radios ------------------- */\n.grupo { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: .75rem; }\n.grupo legend { padding: 0; margin-bottom: .75rem; }\n\n.opcoes-chip { display: flex; flex-wrap: wrap; gap: .5rem; }\n.opcao-chip input, .opcao-radio input { position: absolute; opacity: 0; width: 1px; height: 1px; }\n.opcao-chip span {\n  display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: .55rem 1rem;\n  border: 1px solid var(--borda-campo); border-radius: 999px; font-size: .9rem; cursor: pointer;\n  background: var(--stone-claro); transition: background var(--transicao), color var(--transicao), border-color var(--transicao);\n}\n.opcao-chip span:hover { border-color: var(--onix); }\n.opcao-chip input:checked + span { background: var(--onix); color: var(--soft-stone); border-color: var(--onix); }\n.opcao-chip input:checked + span::before { content: \"✓\"; }\n.opcao-chip input:focus-visible + span, .opcao-radio input:focus-visible + span { outline: 2px solid var(--bronze); outline-offset: 2px; }\n\n.opcoes-radio { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; }\n.opcao-radio span {\n  display: flex; align-items: center; gap: .65rem; min-height: 48px; height: 100%; padding: .6rem .9rem;\n  border: 1px solid var(--borda-campo); border-radius: var(--raio); background: var(--stone-claro);\n  font-size: .9rem; cursor: pointer; transition: border-color var(--transicao), background var(--transicao);\n}\n.opcao-radio span::before {\n  content: \"\"; width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;\n  border: 1.5px solid var(--texto-suave-claro); background: #fff;\n}\n.opcao-radio span:hover { border-color: var(--onix); }\n.opcao-radio input:checked + span { border-color: var(--onix); background: #fff; box-shadow: inset 0 0 0 1px var(--onix); }\n.opcao-radio input:checked + span::before { border: 5px solid var(--onix); }\n\n.opcao-check { display: flex; gap: .75rem; align-items: flex-start; font-size: .9rem; cursor: pointer; }\n.opcao-check input { width: 20px; height: 20px; margin: .1rem 0 0; flex-shrink: 0; accent-color: var(--onix); cursor: pointer; }\n.opcao-check a { color: var(--onix); font-weight: 600; }\n\n/* Bloco de dados sensíveis */\n.bloco-sensivel {\n  display: grid; gap: 1.25rem; padding: 1.25rem;\n  border: 1px solid rgba(11,11,13,.18); border-radius: var(--raio); background: rgba(243,240,235,.6);\n}\n.bloco-sensivel-cabeca { display: flex; gap: .9rem; }\n.bloco-sensivel-cabeca svg { flex-shrink: 0; color: #6E5236; margin-top: .1rem; }\n.bloco-sensivel-cabeca strong { font-family: var(--fonte-marca); }\n.bloco-sensivel-cabeca p { font-size: .85rem; color: var(--texto-suave-claro); margin-top: .25rem; }\n#detalhe-alergia { display: grid; gap: 1rem; }\n#detalhe-alergia[hidden], .aviso-nao-sei[hidden] { display: none; }\n\n.grupo-termos { display: grid; gap: .9rem; padding-top: .5rem; border-top: 1px solid var(--linha-clara); }\n\n/* ------------------- Sucesso ------------------- */\n.sucesso { text-align: center; padding-top: 1rem; }\n.sucesso[hidden] { display: none; }\n.sucesso-icone {\n  width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center;\n  border-radius: 50%; background: var(--onix); color: var(--bronze-claro);\n}\n.sucesso .acoes-etapa { margin-top: 2rem; }\n\n@media (prefers-reduced-motion: reduce) {\n  .btn.carregando::after { animation: none; }\n}\n\n/* Acesso rápido de demonstração */\n.acesso-demo { margin-top: 1.75rem; padding: 1.1rem; border: 1px dashed var(--borda-campo); border-radius: var(--raio); display: grid; gap: .85rem; font-size: .88rem; }\n.acesso-demo .btn { font-size: .7rem; }\n", "css/style.css": "/* =========================================================\n   TOKENS — Paleta 1: Grafite Premium\n   Organizados como variáveis para troca futura de paleta.\n   ========================================================= */\n:root {\n  --grafite:       #1F1F23; /* Base sofisticada e moderna */\n  --onix:          #0B0B0D; /* Contraste, força e elegância */\n  --steel-taupe:   #8C8176; /* Equilíbrio, calor contido e sobriedade */\n  --bronze:        #8E6B47; /* Destaque premium e identidade de marca */\n  --soft-stone:    #E7E2DB; /* Leveza, respiro e refinamento */\n\n  /* Derivados para acessibilidade (contraste AA em texto) */\n  --bronze-claro:  #B8916A; /* bronze legível sobre fundos escuros */\n  --bronze-escuro: #6E5236; /* bronze legível sobre fundos claros */\n  --stone-claro:   #F3F0EB; /* superfície clara secundária */\n  --texto-suave-escuro: #B5ACA2; /* texto secundário sobre grafite */\n  --texto-suave-claro:  #5A534C; /* texto secundário sobre soft stone */\n  --linha-escura:  rgba(231, 226, 219, 0.12);\n  --linha-clara:   rgba(11, 11, 13, 0.14);\n\n  --fonte-marca: \"Montserrat\", \"Segoe UI\", system-ui, sans-serif;\n  --fonte-texto: \"Inter\", \"Segoe UI\", system-ui, sans-serif;\n\n  --raio: 4px;\n  --largura-max: 1180px;\n  --espaco-secao: clamp(4.5rem, 10vw, 8rem);\n  --transicao: 220ms ease;\n}\n\n/* ========================= BASE ========================= */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  font-family: var(--fonte-texto);\n  font-size: 1rem;\n  line-height: 1.6;\n  color: var(--soft-stone);\n  background: var(--onix);\n  -webkit-font-smoothing: antialiased;\n}\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; }\nh1, h2, h3 { font-family: var(--fonte-marca); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }\np { margin: 0; }\nul { margin: 0; padding: 0; list-style: none; }\n\n:focus-visible { outline: 2px solid var(--bronze-claro); outline-offset: 3px; }\n\n.container { width: min(100% - 2.5rem, var(--largura-max)); margin-inline: auto; }\n\n.skip-link {\n  position: absolute; left: 1rem; top: -100px; z-index: 100;\n  background: var(--soft-stone); color: var(--onix);\n  padding: .75rem 1rem; border-radius: var(--raio); font-weight: 600;\n}\n.skip-link:focus { top: 1rem; }\n\n.sr-only {\n  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;\n}\n\n/* Rótulo de seção: CAIXA ALTA espaçada, como na paleta */\n.rotulo {\n  display: inline-flex; align-items: center; gap: .75rem;\n  font-family: var(--fonte-marca); font-size: .75rem; font-weight: 600;\n  letter-spacing: .28em; text-transform: uppercase; color: var(--bronze-claro);\n}\n.rotulo::before { content: \"\"; width: 2rem; height: 1px; background: currentColor; }\n.secao-clara .rotulo { color: var(--bronze-escuro); }\n\n.titulo-secao { font-size: clamp(1.9rem, 4vw, 2.9rem); font-weight: 700; margin-top: 1rem; max-width: 22ch; }\n.intro-secao { margin-top: 1rem; max-width: 60ch; color: var(--texto-suave-escuro); font-size: 1.05rem; }\n.secao-clara .intro-secao { color: var(--texto-suave-claro); }\n\n.aviso-demo {\n  display: inline-block; margin-top: 1.25rem;\n  font-size: .8rem; color: var(--texto-suave-escuro);\n  border-left: 2px solid var(--bronze); padding-left: .75rem;\n}\n.secao-clara .aviso-demo { color: var(--texto-suave-claro); }\n\n/* ======================== BOTÕES ======================== */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;\n  min-height: 48px; padding: .8rem 1.6rem;\n  font-family: var(--fonte-marca); font-size: .82rem; font-weight: 600;\n  letter-spacing: .14em; text-transform: uppercase; text-decoration: none;\n  border: 1px solid transparent; border-radius: var(--raio);\n  cursor: pointer; transition: background var(--transicao), color var(--transicao), border-color var(--transicao), transform var(--transicao);\n}\n.btn:hover { transform: translateY(-1px); }\n.btn-primario { background: var(--soft-stone); color: var(--onix); }\n.btn-primario:hover { background: #fff; }\n.btn-contorno { border-color: rgba(231,226,219,.35); color: var(--soft-stone); background: transparent; }\n.btn-contorno:hover { border-color: var(--bronze-claro); color: var(--bronze-claro); }\n.btn-escuro { background: var(--onix); color: var(--soft-stone); }\n.btn-escuro:hover { background: var(--grafite); }\n.btn-contorno-escuro { border-color: var(--onix); color: var(--onix); background: transparent; }\n.btn-contorno-escuro:hover { background: var(--onix); color: var(--soft-stone); }\n\n.link-seta {\n  display: inline-flex; align-items: center; gap: .5rem;\n  font-family: var(--fonte-marca); font-size: .8rem; font-weight: 600;\n  letter-spacing: .14em; text-transform: uppercase; text-decoration: none;\n  color: var(--bronze-claro); border-bottom: 1px solid transparent; padding-bottom: 2px;\n  transition: border-color var(--transicao);\n}\n.link-seta:hover { border-color: currentColor; }\n.secao-clara .link-seta { color: #6E5236; } /* bronze escurecido p/ contraste AA no claro */\n\n/* ======================= CABEÇALHO ====================== */\n.cabecalho {\n  position: sticky; top: 0; z-index: 50;\n  background: rgba(11, 11, 13, .88);\n  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--linha-escura);\n}\n.cabecalho .container { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 1.5rem; }\n\n.marca { text-decoration: none; display: flex; flex-direction: column; line-height: 1; }\n.marca-nome { font-family: var(--fonte-marca); font-weight: 700; font-size: 1.45rem; letter-spacing: .14em; }\n.marca-sub { font-size: .55rem; letter-spacing: .38em; text-transform: uppercase; color: var(--texto-suave-escuro); margin-top: .35rem; }\n\n.nav-principal { display: none; }\n.nav-principal ul { display: flex; gap: 2rem; }\n.nav-principal a {\n  text-decoration: none; font-size: .88rem; color: var(--texto-suave-escuro);\n  padding-block: .5rem; border-bottom: 1px solid transparent; transition: color var(--transicao), border-color var(--transicao);\n}\n.nav-principal a:hover { color: var(--soft-stone); border-color: var(--bronze); }\n\n.acoes-cabecalho { display: flex; align-items: center; gap: .75rem; }\n.acoes-cabecalho .link-entrar { display: none; text-decoration: none; font-size: .88rem; color: var(--soft-stone); padding: .5rem; }\n.acoes-cabecalho .btn { min-height: 42px; padding: .6rem 1.1rem; font-size: .72rem; }\n\n.btn-menu {\n  width: 44px; height: 44px; display: grid; place-items: center;\n  background: transparent; border: 1px solid var(--linha-escura); border-radius: var(--raio);\n  color: var(--soft-stone); cursor: pointer;\n}\n.btn-menu span, .btn-menu span::before, .btn-menu span::after {\n  content: \"\"; display: block; width: 18px; height: 1.5px; background: currentColor; position: relative; transition: transform var(--transicao);\n}\n.btn-menu span::before { position: absolute; top: -6px; }\n.btn-menu span::after { position: absolute; top: 6px; }\n.btn-menu[aria-expanded=\"true\"] span { background: transparent; }\n.btn-menu[aria-expanded=\"true\"] span::before { transform: translateY(6px) rotate(45deg); }\n.btn-menu[aria-expanded=\"true\"] span::after { transform: translateY(-6px) rotate(-45deg); }\n\n.menu-movel {\n  border-top: 1px solid var(--linha-escura); background: var(--onix);\n  padding: 1rem 0 1.5rem;\n}\n.menu-movel[hidden] { display: none; }\n.menu-movel a { display: block; padding: .9rem 0; text-decoration: none; border-bottom: 1px solid var(--linha-escura); font-size: 1rem; }\n\n@media (min-width: 960px) {\n  .nav-principal { display: block; }\n  .acoes-cabecalho .link-entrar { display: inline-block; }\n  .btn-menu, .menu-movel { display: none !important; }\n}\n\n/* ========================= HERO ========================= */\n.hero {\n  position: relative; overflow: hidden;\n  background:\n    radial-gradient(ellipse 60% 50% at 85% 20%, rgba(142,107,71,.16), transparent 70%),\n    linear-gradient(180deg, var(--onix) 0%, var(--grafite) 100%);\n  padding-block: clamp(3.5rem, 9vw, 7rem);\n  border-bottom: 1px solid var(--linha-escura);\n}\n.hero .container { display: grid; gap: 3.5rem; align-items: center; }\n.hero h1 { font-size: clamp(2.4rem, 6.4vw, 4.4rem); font-weight: 700; margin-top: 1.25rem; max-width: 14ch; }\n.hero h1 em { font-style: normal; color: var(--bronze-claro); }\n.hero-texto { margin-top: 1.5rem; font-size: 1.12rem; color: var(--texto-suave-escuro); max-width: 46ch; }\n.hero-acoes { display: flex; flex-wrap: wrap; gap: .9rem; margin-top: 2.25rem; }\n.hero-garantias { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 2.25rem; font-size: .85rem; color: var(--texto-suave-escuro); }\n.hero-garantias li { display: flex; align-items: center; gap: .5rem; }\n.hero-garantias li::before { content: \"\"; width: 6px; height: 6px; background: var(--bronze); transform: rotate(45deg); }\n\n/* Mockup do app (representação ilustrativa, não captura real) */\n.mockup {\n  position: relative; justify-self: center; width: min(100%, 360px);\n  background: var(--grafite); border: 1px solid var(--linha-escura); border-radius: 22px;\n  padding: 1.25rem; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8);\n}\n.mockup-topo { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; color: var(--texto-suave-escuro); }\n.mockup-topo strong { font-family: var(--fonte-marca); letter-spacing: .18em; color: var(--soft-stone); font-size: .8rem; }\n.mockup-cartao {\n  margin-top: 1rem; background: var(--onix); border: 1px solid var(--linha-escura);\n  border-radius: 12px; padding: 1.1rem;\n}\n.mockup-cartao + .mockup-cartao { margin-top: .75rem; }\n.mockup-etiqueta { font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--bronze-claro); font-weight: 600; }\n.mockup-titulo { font-family: var(--fonte-marca); font-weight: 600; font-size: 1.05rem; margin-top: .4rem; }\n.mockup-info { display: flex; justify-content: space-between; margin-top: .75rem; font-size: .8rem; color: var(--texto-suave-escuro); }\n.mockup-linha { display: flex; gap: .75rem; align-items: flex-start; font-size: .82rem; }\n.mockup-linha + .mockup-linha { margin-top: .7rem; }\n.mockup-ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--bronze); margin-top: .45rem; flex-shrink: 0; }\n.mockup-linha small { display: block; color: var(--texto-suave-escuro); font-size: .72rem; }\n.mockup-alerta {\n  display: flex; gap: .75rem; align-items: center; margin-top: .75rem; padding: .85rem 1rem;\n  border: 1px dashed rgba(184,145,106,.5); border-radius: 12px; font-size: .78rem; color: var(--soft-stone);\n}\n.mockup-alerta b { color: var(--bronze-claro); font-weight: 600; }\n.mockup-legenda { margin-top: 1rem; text-align: center; font-size: .68rem; color: var(--texto-suave-escuro); }\n\n@media (min-width: 960px) {\n  .hero .container { grid-template-columns: 1.15fr .85fr; }\n  .mockup { justify-self: end; }\n}\n\n/* ===================== FAIXA DE VALORES ===================== */\n.faixa { background: var(--grafite); border-bottom: 1px solid var(--linha-escura); }\n.faixa ul { display: grid; grid-template-columns: repeat(2, 1fr); }\n.faixa li { padding: 1.5rem 1rem; border-right: 1px solid var(--linha-escura); border-bottom: 1px solid var(--linha-escura); }\n.faixa li:nth-child(2n) { border-right: 0; }\n.faixa strong { display: block; font-family: var(--fonte-marca); font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; }\n.faixa span { font-size: .85rem; color: var(--texto-suave-escuro); }\n@media (min-width: 860px) {\n  .faixa ul { grid-template-columns: repeat(4, 1fr); }\n  .faixa li { border-bottom: 0; padding: 2rem 1.5rem; }\n  .faixa li:nth-child(2n) { border-right: 1px solid var(--linha-escura); }\n  .faixa li:last-child { border-right: 0; }\n}\n\n/* ======================= SEÇÕES ======================= */\n.secao { padding-block: var(--espaco-secao); }\n.secao-clara { background: var(--soft-stone); color: var(--onix); }\n.secao-grafite { background: var(--grafite); }\n.cabeca-secao { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1.5rem; margin-bottom: 3rem; }\n\n/* ---------- Serviços ---------- */\n.grade-servicos { display: grid; gap: 1px; background: var(--linha-clara); border: 1px solid var(--linha-clara); }\n.servico {\n  background: var(--soft-stone); padding: 2rem 1.75rem; display: flex; flex-direction: column; gap: .9rem;\n  transition: background var(--transicao);\n}\n.servico:hover { background: var(--stone-claro); }\n.servico-num { font-family: var(--fonte-marca); font-size: .75rem; color: var(--bronze-escuro); font-weight: 600; letter-spacing: .2em; }\n.servico h3 { font-size: 1.25rem; font-weight: 600; }\n.servico p { color: var(--texto-suave-claro); font-size: .95rem; flex-grow: 1; }\n.servico-meta {\n  display: flex; justify-content: space-between; align-items: baseline;\n  padding-top: 1rem; border-top: 1px solid var(--linha-clara); font-size: .9rem;\n}\n.servico-preco { font-family: var(--fonte-marca); font-weight: 700; font-size: 1.15rem; }\n.servico-duracao { color: var(--texto-suave-claro); display: inline-flex; align-items: center; gap: .35rem; }\n@media (min-width: 680px) { .grade-servicos { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1024px) { .grade-servicos { grid-template-columns: repeat(3, 1fr); } }\n\n/* ---------- Antes / Durante / Depois ---------- */\n.etapas { display: grid; gap: 1.5rem; counter-reset: etapa; }\n.etapa {\n  position: relative; padding: 2.25rem 1.75rem; border: 1px solid var(--linha-escura); border-radius: var(--raio);\n  background: linear-gradient(180deg, rgba(231,226,219,.03), transparent);\n}\n.etapa-fase { font-family: var(--fonte-marca); font-size: 2.2rem; font-weight: 700; color: var(--soft-stone); }\n.etapa-fase small { display: block; font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; color: var(--bronze-claro); margin-bottom: .5rem; }\n.etapa ul { margin-top: 1.25rem; display: grid; gap: .7rem; }\n.etapa li { display: flex; gap: .75rem; color: var(--texto-suave-escuro); font-size: .95rem; }\n.etapa li::before { content: \"\"; flex-shrink: 0; width: 14px; height: 1px; background: var(--bronze); margin-top: .8rem; }\n@media (min-width: 900px) { .etapas { grid-template-columns: repeat(3, 1fr); } }\n\n/* ---------- Diferenciais (Flow / Journey / Care / Store) ---------- */\n.diferenciais { display: grid; gap: 1px; background: var(--linha-escura); border: 1px solid var(--linha-escura); }\n.diferencial { background: var(--onix); padding: 2.25rem 1.75rem; display: grid; gap: 1rem; align-content: start; }\n.diferencial-icone {\n  width: 48px; height: 48px; display: grid; place-items: center;\n  border: 1px solid rgba(142,107,71,.6); border-radius: var(--raio); color: var(--bronze-claro);\n}\n.diferencial h3 { font-size: 1.15rem; letter-spacing: .04em; }\n.diferencial h3 span { color: var(--texto-suave-escuro); font-weight: 500; }\n.diferencial p { color: var(--texto-suave-escuro); font-size: .95rem; }\n@media (min-width: 700px) { .diferenciais { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1100px) { .diferenciais { grid-template-columns: repeat(4, 1fr); } }\n\n/* ---------- Jornada (linha do tempo) ---------- */\n.jornada { display: grid; gap: 3rem; align-items: center; }\n.timeline { position: relative; padding-left: 2rem; }\n.timeline::before { content: \"\"; position: absolute; left: 5px; top: .5rem; bottom: .5rem; width: 1px; background: var(--linha-clara); }\n.timeline-item { position: relative; padding-bottom: 2rem; }\n.timeline-item:last-child { padding-bottom: 0; }\n.timeline-item::before {\n  content: \"\"; position: absolute; left: calc(-2rem + 1px); top: .45rem;\n  width: 9px; height: 9px; background: var(--bronze); transform: rotate(45deg);\n}\n.timeline-data { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--texto-suave-claro); font-weight: 600; }\n.timeline-item h3 { font-size: 1.1rem; margin-top: .3rem; }\n.timeline-item p { color: var(--texto-suave-claro); font-size: .92rem; margin-top: .35rem; }\n.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }\n.chip {\n  font-size: .75rem; padding: .3rem .7rem; border-radius: 999px;\n  border: 1px solid var(--linha-clara); background: var(--stone-claro); color: var(--onix);\n}\n.jornada-lista { display: grid; gap: 1rem; margin-top: 2rem; }\n.jornada-lista li { display: flex; gap: 1rem; align-items: flex-start; }\n.jornada-lista li b { font-family: var(--fonte-marca); font-size: .8rem; color: var(--bronze); letter-spacing: .1em; min-width: 2rem; }\n@media (min-width: 960px) { .jornada { grid-template-columns: 1fr 1fr; gap: 5rem; } }\n\n/* ---------- Profissionais ---------- */\n.grade-profissionais { display: grid; gap: 1.5rem; }\n.profissional { border: 1px solid var(--linha-escura); border-radius: var(--raio); overflow: hidden; background: var(--onix); }\n.profissional-foto {\n  aspect-ratio: 4 / 3; display: grid; place-items: center;\n  background:\n    linear-gradient(135deg, rgba(142,107,71,.22), transparent 60%),\n    repeating-linear-gradient(45deg, var(--grafite) 0 12px, #232328 12px 24px);\n  font-family: var(--fonte-marca); font-size: 2.5rem; font-weight: 700; letter-spacing: .1em; color: var(--steel-taupe);\n}\n.profissional-corpo { padding: 1.5rem; display: grid; gap: .6rem; }\n.profissional h3 { font-size: 1.1rem; }\n.profissional p { color: var(--texto-suave-escuro); font-size: .92rem; }\n.tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .25rem; }\n.tag { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: .3rem .6rem; border: 1px solid var(--linha-escura); border-radius: 2px; color: var(--texto-suave-escuro); }\n@media (min-width: 720px) { .grade-profissionais { grid-template-columns: repeat(3, 1fr); } }\n\n/* ---------- Loja ---------- */\n.grade-produtos { display: grid; gap: 1.25rem; grid-template-columns: repeat(2, 1fr); }\n.produto { display: flex; flex-direction: column; background: var(--stone-claro); border: 1px solid var(--linha-clara); border-radius: var(--raio); overflow: hidden; }\n.produto-imagem {\n  aspect-ratio: 1; display: grid; place-items: center;\n  background: radial-gradient(circle at 50% 40%, #d9d2c8, #cfc6ba);\n}\n.produto-frasco { width: 34%; height: 58%; border-radius: 10px 10px 6px 6px; background: var(--grafite); position: relative; box-shadow: 0 18px 30px -18px rgba(0,0,0,.6); }\n.produto-frasco::before { content: \"\"; position: absolute; top: -1
