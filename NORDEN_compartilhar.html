y: inline-grid !important; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: .7rem; align-items: center; }\n.marca .marca-simbolo { grid-row: 1 / span 2; display: block; width: 30px; height: 36px; }\n.marca .marca-simbolo svg { width: 100%; height: 100%; display: block; }\n.marca .marca-nome { grid-column: 2; }\n.marca .marca-sub { grid-column: 2; }\n.marca:has(.marca-sub) .marca-nome { align-self: end; }\n.marca:has(.marca-sub) .marca-sub { align-self: start; }\n.marca:not(:has(.marca-sub)) .marca-simbolo { grid-row: 1; width: 24px; height: 29px; }\n@media (max-width: 520px) { .cabecalho .marca-sub { display: none; } .cabecalho .marca .marca-simbolo { grid-row: 1; width: 24px; height: 29px; } }\n\n.hero-simbolo { width: clamp(84px, 12vw, 120px); aspect-ratio: 100 / 120; margin: 0 auto 1.75rem; }\n.hero-simbolo svg { width: 100%; height: 100%; display: block; }\n", "js/agendar.js": "/* =========================================================\n   NORDEN — Agendamento (seção 9 da especificação)\n   Usa o catálogo e a agenda de demonstração de core.js.\n   A reserva é gravada apenas no navegador (localStorage).\n   Em produção: disponibilidade no servidor (America/Sao_Paulo)\n   e gravação atômica para impedir sobreposição.\n   ========================================================= */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { SERVICOS, PRODUTOS, CONFIG, moeda, hora, duracaoTexto, isoData, paraData, dataLonga, esc } = N;\n  const $ = sel => document.querySelector(sel);\n  const CHAVE_RASCUNHO = 'norden-agendamento-rascunho';\n\n  // ============================ ESTADO ============================\n  const estado = {\n    passo: 1, servico: null, profissional: null, profissionalAtribuido: null,\n    produtos: new Set(), data: null, horario: null\n  };\n\n  const servicoAtual = () => SERVICOS.find(s => s.id === estado.servico);\n  const profissionaisHabilitados = () => servicoAtual() ? N.PROFISSIONAIS.filter(p => servicoAtual().profissionais.includes(p.id)) : [];\n\n  function horariosDisponiveis(iso) {\n    const s = servicoAtual();\n    if (!s || !estado.profissional) return [];\n    const ids = estado.profissional === 'qualquer' ? s.profissionais : [estado.profissional];\n    const todos = new Set();\n    ids.forEach(id => N.horariosLivres(id, iso, s.duracao).forEach(h => todos.add(h)));\n    return [...todos].sort((a, b) => a - b);\n  }\n\n  const primeiroProfissionalLivre = (iso, minuto) =>\n    servicoAtual().profissionais.find(id => N.horariosLivres(id, iso, servicoAtual().duracao).includes(minuto)) || null;\n\n  const totalProdutos = () => [...estado.produtos].reduce((s, id) => s + PRODUTOS[id].preco, 0);\n\n  // ======================== OPÇÕES (DOM) ========================\n  function criarOpcaoRadio(classe, selecionado, html, aoEscolher) {\n    const b = document.createElement('button');\n    b.type = 'button';\n    b.className = classe;\n    b.setAttribute('role', 'radio');\n    b.setAttribute('aria-checked', String(selecionado));\n    b.innerHTML = html;\n    b.addEventListener('click', aoEscolher);\n    return b;\n  }\n\n  function renderServicos() {\n    const lista = $('#lista-servicos');\n    lista.innerHTML = '';\n    const pref = estado.profissionalPreferido;\n    SERVICOS.filter(s => !pref || s.profissionais.includes(pref)).forEach(s => lista.appendChild(criarOpcaoRadio('opcao-cartao', estado.servico === s.id, `\n      <span class=\"opcao-titulo\">${esc(s.nome)}<\/span>\n      <span class=\"opcao-desc\">${esc(s.desc)}<\/span>\n      <span class=\"opcao-meta\"><strong>${moeda(s.preco)}<\/strong><span>${duracaoTexto(s.duracao)}<\/span><\/span>`,\n      () => escolherServico(s.id))));\n  }\n\n  function renderProfissionais() {\n    const lista = $('#lista-profissionais');\n    lista.innerHTML = '';\n    const habilitados = profissionaisHabilitados();\n    if (habilitados.length > 1) {\n      lista.appendChild(criarOpcaoRadio('opcao-cartao opcao-profissional', estado.profissional === 'qualquer', `\n        <span class=\"avatar qualquer\" aria-hidden=\"true\">✦<\/span>\n        <span class=\"opcao-titulo\">Sem preferência<\/span>\n        <span class=\"opcao-desc\">Mostramos mais horários e atribuímos um profissional disponível.<\/span>`,\n        () => escolherProfissional('qualquer')));\n    }\n    habilitados.forEach(p => lista.appendChild(criarOpcaoRadio('opcao-cartao opcao-profissional', estado.profissional === p.id, `\n      <span class=\"avatar\" aria-hidden=\"true\">${p.sigla}<\/span>\n      <span class=\"opcao-titulo\">${esc(p.nome)}<\/span>\n      <span class=\"tags\">${p.tags.map(t => `<span class=\"tag\">${esc(t)}<\/span>`).join('')}<\/span>`,\n      () => escolherProfissional(p.id))));\n  }\n\n  function renderProdutos() {\n    const lista = $('#lista-produtos');\n    const ids = servicoAtual() ? servicoAtual().produtos : [];\n    lista.innerHTML = '';\n    $('#produtos-vazio').hidden = ids.length > 0;\n    ids.forEach(id => {\n      const p = PRODUTOS[id];\n      const label = document.createElement('label');\n      label.className = 'produto-opcao';\n      label.innerHTML = `\n        <input type=\"checkbox\" value=\"${id}\" ${estado.produtos.has(id) ? 'checked' : ''}>\n        <span><strong>${esc(p.nome)}<\/strong><small>${esc(p.desc)}<\/small><\/span>\n        <span class=\"preco\">${moeda(p.preco)}<\/span>`;\n      label.querySelector('input').addEventListener('change', e => {\n        e.target.checked ? estado.produtos.add(id) : estado.produtos.delete(id);\n        atualizarResumo(); atualizarBotoes();\n      });\n      lista.appendChild(label);\n    });\n  }\n\n  function renderDatas() {\n    const lista = $('#lista-datas');\n    lista.innerHTML = '';\n    const hoje = new Date();\n    for (let i = 0; i < CONFIG.diasExibidos; i++) {\n      const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);\n      const iso = isoData(d);\n      const vagas = horariosDisponiveis(iso).length;\n      const fechado = !N.salaoAberto(iso);\n      const legenda = fechado ? 'Fechado' : vagas === 0 ? 'Sem vagas' : i === 0 ? 'Hoje' : vagas + ' vagas';\n      const semana = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');\n      const b = criarOpcaoRadio('data-opcao', estado.data === iso,\n        `<small>${semana}<\/small><strong>${d.getDate()}<\/strong><span>${legenda}<\/span>`, () => escolherData(iso));\n      b.setAttribute('aria-label', dataLonga(iso) + ' — ' + legenda);\n      if (fechado || vagas === 0) b.disabled = true;\n      lista.appendChild(b);\n    }\n  }\n\n  function renderHorarios() {\n    const lista = $('#lista-horarios');\n    const vazio = $('#horarios-vazio');\n    lista.innerHTML = '';\n    if (!estado.data) { vazio.hidden = false; vazio.textContent = 'Escolha uma data para ver os horários disponíveis.'; return; }\n    const horarios = horariosDisponiveis(estado.data);\n    if (!horarios.length) { vazio.hidden = false; vazio.textContent = 'Não há horários livres nesta data. Escolha outro dia ou outro profissional.'; return; }\n    vazio.hidden = true;\n    [['Manhã', 0, 720], ['Tarde', 720, 1080], ['Noite', 1080, 1440]].forEach(([nome, de, ate]) => {\n      const doPeriodo = horarios.filter(h => h >= de && h < ate);\n      if (!doPeriodo.length) return;\n      const t = document.createElement('p');\n      t.className = 'grupo-periodo';\n      t.textContent = nome;\n      lista.appendChild(t);\n      doPeriodo.forEach(h => {\n        const b = criarOpcaoRadio('horario-opcao', estado.horario === h, hora(h), () => escolherHorario(h));\n        b.setAttribute('aria-label', hora(h) + ' até ' + hora(h + servicoAtual().duracao));\n        lista.appendChild(b);\n      });\n    });\n  }\n\n  function linhasRevisao(comEdicao) {\n    const s = servicoAtual();\n    const prof = N.profissional(estado.profissionalAtribuido || estado.profissional);\n    const produtos = [...estado.produtos].map(id => PRODUTOS[id].nome);\n    const editar = p => comEdicao ? ` <button type=\"button\" class=\"editar\" data-editar=\"${p}\">Alterar<\/button>` : '';\n    return `\n      <div><dt>Serviço<\/dt><dd>${esc(s.nome)}${editar(1)}<\/dd><\/div>\n      <div><dt>Profissional<\/dt><dd>${prof ? esc(prof.nome) : '—'}${estado.profissional === 'qualquer' ? ' <small>(atribuído)<\/small>' : ''}${editar(2)}<\/dd><\/div>\n      <div><dt>Data<\/dt><dd>${dataLonga(estado.data)}${editar(4)}<\/dd><\/div>\n      <div><dt>Horário<\/dt><dd>${hora(estado.horario)} – ${hora(estado.horario + s.duracao)}<\/dd><\/div>\n      <div><dt>Duração<\/dt><dd>${duracaoTexto(s.duracao)}<\/dd><\/div>\n      <div><dt>Produtos de preferência<\/dt><dd>${produtos.length ? esc(produtos.join(', ')) : 'Nenhum'}${editar(3)}<\/dd><\/div>\n      <div class=\"total\"><dt>Valor do serviço<\/dt><dd>${moeda(s.preco)}<\/dd><\/div>`;\n  }\n\n  function renderRevisao() {\n    $('#revisao').innerHTML = linhasRevisao(true);\n    $('#revisao').querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => irPara(Number(b.dataset.editar))));\n    const status = $('#status-confirmacao');\n    if (N.sessao() !== 'cliente') {\n      status.className = 'form-status info';\n      status.innerHTML = 'Para confirmar, entre na sua conta. Suas escolhas serão mantidas.';\n    } else {\n      status.textContent = '';\n    }\n  }\n\n  // ========================== ESCOLHAS ==========================\n  function escolherServico(id) {\n    if (estado.servico !== id) {\n      estado.servico = id;\n      const s = servicoAtual();\n      if (estado.profissional && estado.profissional !== 'qualquer' && !s.profissionais.includes(estado.profissional)) estado.profissional = null;\n      if (estado.profissional === 'qualquer' && s.profissionais.length < 2) estado.profissional = null;\n      if (s.profissionais.length === 1) estado.profissional = s.profissionais[0];\n      estado.produtos = new Set([...estado.produtos].filter(p => s.produtos.includes(p)));\n      estado.horario = null;\n      estado.profissionalAtribuido = null;\n    }\n    $('#erro-passo-1').textContent = '';\n    renderServicos(); atualizarResumo(); atualizarBotoes();\n  }\n\n  function escolherProfissional(id) {\n    if (estado.profissional !== id) {\n      estado.profissional = id;\n      estado.horario = null;\n      estado.profissionalAtribuido = id === 'qualquer' ? null : id;\n    }\n    $('#erro-passo-2').textContent = '';\n    renderProfissionais(); atualizarResumo(); atualizarBotoes();\n  }\n\n  function escolherData(iso) {\n    if (estado.data !== iso) { estado.data = iso; estado.horario = null; }\n    if (estado.profissional === 'qualquer') estado.profissionalAtribuido = null;\n    renderDatas(); renderHorarios(); atualizarResumo(); atualizarBotoes();\n  }\n\n  function escolherHorario(m) {\n    estado.horario = m;\n    estado.profissionalAtribuido = estado.profissional === 'qualquer' ? primeiroProfissionalLivre(estado.data, m) : estado.profissional;\n    $('#erro-passo-4').textContent = '';\n    renderHorarios(); atualizarResumo(); atualizarBotoes();\n  }\n\n  // =========================== RESUMO ===========================\n  function atualizarResumo() {\n    const s = servicoAtual();\n    const profId = estado.profissionalAtribuido || estado.profissional;\n    const prof = profId === 'qualquer' ? { nome: 'Sem preferência' } : N.profissional(profId);\n    const produtos = [...estado.produtos].map(id => PRODUTOS[id].nome);\n    const v = {\n      servico: s ? s.nome : 'Nenhum serviço',\n      profissional: prof ? prof.nome : '—',\n      data: estado.data ? dataLonga(estado.data) : '—',\n      horario: estado.horario !== null && s ? hora(estado.horario) + ' – ' + hora(estado.horario + s.duracao) : '—',\n      produtos: produtos.length ? produtos.join(', ') + ' (' + moeda(totalProdutos()) + ', não cobrado agora)' : 'Nenhum',\n      duracao: s ? duracaoTexto(s.duracao) : '—',\n      preco: s ? moeda(s.preco) : '—'\n    };\n    document.querySelectorAll('[data-resumo]').forEach(el => { el.textContent = v[el.dataset.resumo]; });\n  }\n\n  // ========================= NAVEGAÇÃO =========================\n  const TITULOS = { 1: 'Escolha o serviço', 2: 'Escolha o profissional', 3: 'Produtos de preferência', 4: 'Escolha data e horário', 5: 'Revise e confirme' };\n\n  function passoMaximo() {\n    if (!estado.servico) return 1;\n    if (!estado.profissional) return 2;\n    if (estado.horario === null) return 4;\n    return 5;\n  }\n\n  function irPara(passo, focar = true) {\n    passo = Math.max(1, Math.min(passo, passoMaximo()));\n    estado.passo = passo;\n    document.querySelectorAll('.passo').forEach(sec => { sec.hidden = Number(sec.dataset.passo) !== passo; });\n    $('#titulo-etapa').textContent = TITULOS[passo];\n    if (passo === 1) renderServicos();\n    if (passo === 2) renderProfissionais();\n    if (passo === 3) renderProdutos();\n    if (passo === 4) {\n      $('#intro-horario').textContent = `Horários para ${servicoAtual().nome} (${duracaoTexto(servicoAtual().duracao)}), calculados pela agenda ${estado.profissional === 'qualquer' ? 'de todos os profissionais habilitados' : 'do profissional escolhido'}.`;\n      renderDatas(); renderHorarios();\n    }\n    if (passo === 5) renderRevisao();\n    atualizarBotoes();\n    if (focar) {\n      $('#titulo-etapa').focus({ preventScroll: true });\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }\n  }\n\n  function atualizarBotoes() {\n    const max = passoMaximo();\n    document.querySelectorAll('#etapas-agendar li').forEach(li => {\n      const n = Number(li.dataset.passo);\n      li.classList.toggle('ativa', n === estado.passo);\n      li.classList.toggle('concluida', n < estado.passo);\n      li.querySelector('button').disabled = n > max || n === estado.passo;\n      if (n === estado.passo) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');\n    });\n    $('#btn-voltar').hidden = estado.passo === 1;\n    $('#btn-avancar').textContent =\n      estado.passo === 5 ? (N.sessao() === 'cliente' ? 'Confirmar agendamento' : 'Entrar para confirmar') :\n      estado.passo === 3 && estado.produtos.size === 0 ? 'Pular esta etapa' : 'Continuar';\n  }\n\n  function validarPasso() {\n    if (estado.passo === 1 && !estado.servico) { $('#erro-passo-1').textContent = 'Escolha um serviço para continuar.'; return false; }\n    if (estado.passo === 2 && !estado.profissional) { $('#erro-passo-2').textContent = 'Escolha um profissional ou \"Sem preferência\".'; return false; }\n    if (estado.passo === 4 && estado.horario === null) { $('#erro-passo-4').textContent = estado.data ? 'Escolha um horário.' : 'Escolha uma data e um horário.'; return false; }\n    return true;\n  }\n\n  $('#btn-avancar').addEventListener('click', () => {\n    if (estado.passo === 5) return confirmar();\n    if (validarPasso()) irPara(estado.passo + 1);\n  });\n  $('#btn-voltar').addEventListener('click', () => irPara(estado.passo - 1));\n  document.querySelectorAll('#etapas-agendar button').forEach(b =>\n    b.addEventListener('click', () => irPara(Number(b.closest('li').dataset.passo))));\n\n  const aceite = $('#aceite-politica');\n  aceite.addEventListener('change', () => { aceite.removeAttribute('aria-invalid'); $('#aceite-politica-erro').textContent = ''; });\n\n  // ========================= CONFIRMAÇÃO =========================\n  function salvarRascunho() {\n    // Apenas escolhas não sensíveis, para retomar após o login\n    try { sessionStorage.setItem(CHAVE_RASCUNHO, JSON.stringify({\n      servico: estado.servico, profissional: estado.profissional, produtos: [...estado.produtos],\n      data: estado.data, horario: estado.horario, obs: $('#observacao').value\n    })); } catch { /* sem armazenamento: as escolhas não serão retomadas */ }\n  }\n\n  function confirmar() {\n    if (N.sessao() !== 'cliente') {\n      salvarRascunho();\n      N.ir('login.html?perfil=cliente&voltar=agendar.html');\n      return;\n    }\n    if (!aceite.checked) {\n      aceite.setAttribute('aria-invalid', 'true');\n      $('#aceite-politica-erro').textContent = 'Confirme que leu a política de cancelamento.';\n      aceite.focus();\n      return;\n    }\n\n    const botao = $('#btn-avancar');\n    const status = $('#status-confirmacao');\n    status.textContent = '';\n    botao.disabled = true;\n    botao.classList.add('carregando');\n    botao.textContent = 'Confirmando';\n\n    setTimeout(() => {\n      botao.disabled = false;\n      botao.classList.remove('carregando');\n\n      // Revalida antes de gravar (no servidor isso seria uma transação)\n      const s = servicoAtual();\n      const profId = estado.profissional === 'qualquer' ? primeiroProfissionalLivre(estado.data, estado.horario) : estado.profissional;\n      if (!profId || !N.horariosLivres(profId, estado.data, s.duracao).includes(estado.horario)) {\n        status.className = 'form-status erro';\n        status.textContent = 'Este horário acabou de ficar indisponível. Escolha outro horário.';\n        estado.horario = null;\n        atualizarBotoes();\n        return;\n      }\n\n      const db = N.db();\n      const reserva = N.novaReserva({\n        clienteId: N.CLIENTE_DEMO.id, clienteNome: db.perfil.nome,\n        servicoId: s.id, profId, data: estado.data, inicio: estado.horario,\n        produtosPref: [...estado.produtos], obs: $('#observacao').value.trim()\n      });\n      db.reservas.push(reserva);\n      N.notificar('cliente', `Reserva ${reserva.codigo} confirmada: ${s.nome}, ${N.dataCurta(estado.data)} às ${hora(estado.horario)}.`, 'cliente.html#agendamentos');\n      N.notificar('gestor', `Nova reserva: ${s.nome} com ${N.profissional(profId).nome}, ${N.dataCurta(estado.data)} às ${hora(estado.horario)}.`, 'gestao.html#agenda');\n      N.salvar();\n      try { sessionStorage.removeItem(CHAVE_RASCUNHO); } catch { /* sem armazenamento */ }\n\n      estado.profissionalAtribuido = profId;\n      $('#confirmado-texto').innerHTML = `Código da reserva: <strong>${reserva.codigo}<\/strong>. Você pode cancelar ou remarcar até ${CONFIG.cancelamentoHoras} horas antes.`;\n      $('#confirmado-detalhes').innerHTML = linhasRevisao(false);\n      $('#area-agendamento').hidden = true;\n      $('#etapas-agendar').hidden = true;\n      $('#resumo-movel').hidden = true;\n      $('#titulo-etapa').textContent = 'Agendamento concluído';\n      $('#confirmado').hidden = false;\n      $('#titulo-confirmado').focus();\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }, 700);\n  }\n\n  // ======================== INICIALIZAÇÃO ========================\n  const params = N.params();\n  let rascunho = null;\n  try { rascunho = JSON.parse(sessionStorage.getItem(CHAVE_RASCUNHO)); } catch { rascunho = null; }\n\n  if (rascunho && rascunho.servico) {\n    // Volta do login: revalida as escolhas\n    escolherServico(rascunho.servico);\n    if (rascunho.profissional) escolherProfissional(rascunho.profissional);\n    rascunho.produtos.forEach(p => { if (servicoAtual().produtos.includes(p)) estado.produtos.add(p); });\n    if (rascunho.data) estado.data = rascunho.data;\n    $('#observacao').value = rascunho.obs || '';\n    if (rascunho.data && rascunho.horario !== null && horariosDisponiveis(rascunho.data).includes(rascunho.horario)) {\n      escolherHorario(rascunho.horario);\n      irPara(5, false);\n    } else {\n      irPara(4, false);\n      if (rascunho.horario !== null) $('#erro-passo-4').textContent = 'O horário escolhido não está mais disponível. Escolha outro.';\n    }\n    try { sessionStorage.removeItem(CHAVE_RASCUNHO); } catch { /* sem armazenamento */ }\n  } else {\n    const servicoUrl = params.get('servico');\n    const profUrl = params.get('profissional');\n    if (servicoUrl && SERVICOS.some(s => s.id === servicoUrl)) {\n      escolherServico(servicoUrl);\n      if (profUrl && servicoAtual().profissionais.includes(profUrl)) { escolherProfissional(profUrl); irPara(3, false); }\n      else irPara(2, false);\n    } else {\n      // Agendar com um profissional: mostra apenas serviços que ele realiza\n      if (profUrl && N.profissional(profUrl)) {\n        estado.profissionalPreferido = profUrl;\n        $('.passo[data-passo=\"1\"] .passo-intro').textContent = `Serviços realizados por ${N.profissional(profUrl).nome}. Preço e duração exibidos antes de qualquer confirmação.`;\n      }\n      irPara(1, false);\n    }\n  }\n\n  // Se veio da página de profissionais, pré-seleciona o profissional ao escolher o serviço\n  if (estado.profissionalPreferido) {\n    document.getElementById('lista-servicos').addEventListener('click', () => {\n      const s = servicoAtual();\n      if (s && s.profissionais.includes(estado.profissionalPreferido) && !estado.profissional) escolherProfissional(estado.profissionalPreferido);\n    });\n  }\n\n  atualizarResumo();\n});\n", "js/auth.js": "/* =========================================================\n   NORDEN — Login, cadastro e recuperação de senha\n   MODO DEMONSTRAÇÃO: valida apenas no navegador.\n   Nenhum dado é enviado, salvo ou guardado em localStorage.\n   A autenticação real deve ser feita no servidor.\n   ========================================================= */\n\n// ---------------- Utilitários de validação ----------------\nconst EMAIL_REGEX = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/;\n\nfunction mostrarErro(campo, mensagem) {\n  const erro = document.getElementById(campo.id + '-erro');\n  campo.setAttribute('aria-invalid', 'true');\n  if (erro) erro.textContent = mensagem;\n}\n\nfunction limparErro(campo) {\n  const erro = document.getElementById(campo.id + '-erro');\n  campo.removeAttribute('aria-invalid');\n  if (erro) erro.textContent = '';\n}\n\n// Aplica uma regra a um campo; retorna true se válido\nfunction validar(campo, regra) {\n  const mensagem = regra(campo.value.trim());\n  if (mensagem) { mostrarErro(campo, mensagem); return false; }\n  limparErro(campo);\n  return true;\n}\n\nconst regras = {\n  email: v => !v ? 'Informe seu e-mail.' : !EMAIL_REGEX.test(v) ? 'Digite um e-mail válido, como nome@exemplo.com.' : '',\n  senhaLogin: v => !v ? 'Informe sua senha.' : '',\n  nome: v => !v ? 'Informe seu nome completo.' : v.split(/\\s+/).length < 2 ? 'Informe nome e sobrenome.' : '',\n  telefone: v => {\n    const digitos = v.replace(/\\D/g, '');\n    if (!digitos) return 'Informe seu celular.';\n    return digitos.length < 10 || digitos.length > 11 ? 'Digite o número com DDD, como (48) 99999-9999.' : '';\n  },\n  nascimento: v => {\n    if (!v) return '';\n    const data = new Date(v + 'T00:00:00');\n    return data > new Date() ? 'A data de nascimento não pode estar no futuro.' : '';\n  },\n  senhaNova: v => {\n    if (!v) return 'Crie uma senha.';\n    return checarSenha(v).every(Boolean) ? '' : 'A senha não atende a todos os requisitos abaixo.';\n  }\n};\n\nfunction checarSenha(v) {\n  return [v.length >= 8, /[A-Za-zÀ-ÿ]/.test(v), /\\d/.test(v)];\n}\n\n// Erros somem enquanto a pessoa corrige; aparecem ao sair do campo\nfunction ligarValidacao(campo, regra) {\n  if (!campo) return;\n  campo.addEventListener('blur', () => { if (campo.value.trim()) validar(campo, regra); });\n  campo.addEventListener('input', () => { if (campo.getAttribute('aria-invalid')) validar(campo, regra); });\n}\n\nfunction focarPrimeiroErro(container) {\n  const invalido = container.querySelector('[aria-invalid=\"true\"]');\n  if (invalido) invalido.focus();\n}\n\nfunction definirStatus(form, mensagem, tipo) {\n  const status = form.querySelector('.form-status');\n  if (!status) return;\n  status.className = 'form-status' + (tipo ? ' ' + tipo : '');\n  status.innerHTML = mensagem;\n}\n\n// Simula a espera de uma requisição para exibir o estado de carregamento\nfunction simularEnvio(botao, aoConcluir) {\n  const texto = botao.textContent;\n  botao.disabled = true;\n  botao.classList.add('carregando');\n  botao.textContent = 'Aguarde';\n  setTimeout(() => {\n    botao.disabled = false;\n    botao.classList.remove('carregando');\n    botao.textContent = texto;\n    aoConcluir();\n  }, 800);\n}\n\n// ---------------- Mostrar / ocultar senha ----------------\ndocument.querySelectorAll('.btn-ver-senha').forEach(botao => {\n  botao.addEventListener('click', () => {\n    const campo = document.getElementById(botao.getAttribute('aria-controls'));\n    const visivel = campo.type === 'text';\n    campo.type = visivel ? 'password' : 'text';\n    botao.textContent = visivel ? 'Mostrar' : 'Ocultar';\n    botao.setAttribute('aria-pressed', String(!visivel));\n  });\n});\n\n// ---------------- Aviso de telas futuras ----------------\nconst toast = document.getElementById('toast');\nlet timerToast;\ndocument.querySelectorAll('[data-em-breve]').forEach(el =>\n  el.addEventListener('click', e => {\n    e.preventDefault();\n    if (!toast) return;\n    toast.innerHTML = '<strong>' + el.dataset.emBreve + '<\/strong> — tela em construção nas próximas etapas do projeto.';\n    toast.classList.add('visivel');\n    clearTimeout(timerToast);\n    timerToast = setTimeout(() => toast.classList.remove('visivel'), 3200);\n  })\n);\n\n/* =========================================================\n   LOGIN + RECUPERAR SENHA (login.html)\n   ========================================================= */\nconst formLogin = document.getElementById('form-login');\n\nif (formLogin) {\n  const painelLogin = document.getElementById('painel-login');\n  const painelRecuperar = document.getElementById('painel-recuperar');\n  const formRecuperar = document.getElementById('form-recuperar');\n\n  const loginEmail = document.getElementById('login-email');\n  const loginSenha = document.getElementById('login-senha');\n  const recuperarEmail = document.getElementById('recuperar-email');\n\n  ligarValidacao(loginEmail, regras.email);\n  ligarValidacao(loginSenha, regras.senhaLogin);\n  ligarValidacao(recuperarEmail, regras.email);\n\n  function abrirPainel(nome, focar) {\n    const recuperar = nome === 'recuperar';\n    painelLogin.hidden = recuperar;\n    painelRecuperar.hidden = !recuperar;\n    document.title = (recuperar ? 'Recuperar senha' : 'Entrar') + ' — NORDEN';\n    if (recuperar && loginEmail.value && !recuperarEmail.value) recuperarEmail.value = loginEmail.value;\n    if (focar) (recuperar ? document.getElementById('titulo-recuperar') : loginEmail).focus();\n  }\n\n  document.querySelectorAll('[data-abrir-painel]').forEach(link =>\n    link.addEventListener('click', e => {\n      e.preventDefault();\n      const nome = link.dataset.abrirPainel;\n      history.replaceState(null, '', '#' + nome);\n      abrirPainel(nome, true);\n    })\n  );\n\n  if (location.hash === '#recuperar') abrirPainel('recuperar', false);\n\n  formLogin.addEventListener('submit', e => {\n    e.preventDefault();\n    definirStatus(formLogin, '');\n    const ok = [validar(loginEmail, regras.email), validar(loginSenha, regras.senhaLogin)].every(Boolean);\n    if (!ok) { focarPrimeiroErro(formLogin); return; }\n\n    simularEnvio(formLogin.querySelector('[type=\"submit\"]'), () => {\n      // Sem servidor de autenticação: entra com o perfil fictício de cliente\n      definirStatus(formLogin,\n        '<strong>Dados válidos.<\/strong> Modo demonstração: entrando com a conta fictícia de cliente. Nada foi enviado.',\n        'info');\n      loginSenha.value = '';\n      setTimeout(() => entrarDemo('cliente'), 900);\n    });\n  });\n\n  // Acesso rápido por perfil de demonstração\n  const params = N.params();\n  function entrarDemo(perfil) {\n    N.entrar(perfil);\n    const voltar = params.get('voltar');\n    const seguro = voltar && /^[a-z]+\\.html([?#][^:]*)?$/i.test(voltar); // apenas páginas locais\n    N.ir(seguro ? voltar : (perfil === 'gestor' ? 'gestao.html' : 'cliente.html'));\n  }\n  document.querySelectorAll('[data-entrar-demo]').forEach(b =>\n    b.addEventListener('click', () => entrarDemo(b.dataset.entrarDemo)));\n\n  // Chegou aqui por uma página protegida: explica o motivo\n  if (params.get('perfil')) {\n    definirStatus(formLogin, params.get('perfil') === 'gestor'\n      ? 'Esta área é exclusiva da equipe. Entre com o perfil de gestão.'\n      : 'Entre na sua conta para continuar.', 'info');\n  }\n\n  formRecuperar.addEventListener('submit', e => {\n    e.preventDefault();\n    definirStatus(formRecuperar, '');\n    if (!validar(recuperarEmail, regras.email)) { recuperarEmail.focus(); return; }\n\n    simularEnvio(formRecuperar.querySelector('[type=\"submit\"]'), () => {\n      // Mensagem neutra: não revela se o e-mail possui conta\n      definirStatus(formRecuperar,\n        'Se houver uma conta com este e-mail, você receberá as instruções em instantes. <br><small>Demonstração: nenhum e-mail foi enviado.<\/small>',\n        'info');\n    });\n  });\n}\n\n/* =========================================================\n   CADASTRO EM DUAS ETAPAS (cadastro.html)\n   ========================================================= */\nconst formCadastro = document.getElementById('form-cadastro');\n\nif (formCadastro) {\n  const etapas = formCadastro.querySelectorAll('.etapa-form');\n  const indicadores = document.querySelectorAll('.etapas-form li');\n  const titulo = document.getElementById('titulo-cadastro');\n\n  const nome = document.getElementById('cad-nome');\n  const email = document.getElementById('cad-email');\n  const telefone = document.getElementById('cad-telefone');\n  const nascimento = document.getElementById('cad-nascimento');\n  const senha = document.getElementById('cad-senha');\n  const confirmar = document.getElementById('cad-confirmar');\n\n  const detalheAlergia = document.getElementById('detalhe-alergia');\n  const alergiaDetalhe = document.getElementById('cad-alergia-detalhe');\n  const consentimentoSaude = document.getElementById('cad-consentimento-saude');\n  const avisoNaoSei = document.getElementById('aviso-nao-sei');\n  const termos = document.getElementById('cad-termos');\n\n  const regraConfirmar = v => !v ? 'Repita a senha.' : v !== senha.value ? 'As senhas não coincidem.' : '';\n\n  ligarValidacao(nome, regras.nome);\n  ligarValidacao(email, regras.email);\n  ligarValidacao(telefone, regras.telefone);\n  ligarValidacao(nascimento, regras.nascimento);\n  ligarValidacao(senha, regras.senhaNova);\n  ligarValidacao(confirmar, regraConfirmar);\n\n  // Não permite data futura no seletor\n  nascimento.max = new Date().toISOString().split('T')[0];\n\n  // Máscara de celular: (00) 00000-0000\n  telefone.addEventListener('input', () => {\n    const d = telefone.value.replace(/\\D/g, '').slice(0, 11);\n    let r = d;\n    if (d.length > 2) r = '(' + d.slice(0, 2) + ') ' + d.slice(2);\n    if (d.length > 6) r = '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);\n    telefone.value = r;\n  });\n\n  // Checklist da senha ao vivo\n  const itensRegra = document.querySelectorAll('#cad-senha-regras li');\n  senha.addEventListener('input', () => {\n    checarSenha(senha.value).forEach((ok, i) => itensRegra[i].classList.toggle('ok', ok));\n    if (confirmar.value) validar(confirmar, regraConfirmar);\n  });\n\n  // Navegação entre etapas\n  function irParaEtapa(numero) {\n    etapas.forEach(et => { et.hidden = et.dataset.etapa !== String(numero); });\n    indicadores.forEach((li, i) => {\n      const n = i + 1;\n      li.classList.toggle('ativa', n === numero);\n      li.classList.toggle('concluida', n < numero);\n      if (n === numero) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');\n    });\n    titulo.focus();\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  function validarEtapa1() {\n    const ok = [\n      validar(nome, regras.nome),\n      validar(email, regras.email),\n      validar(telefone, regras.telefone),\n      validar(nascimento, regras.nascimento),\n      validar(senha, regras.senhaNova),\n      validar(confirmar, regraConfirmar)\n    ].every(Boolean);\n    if (!ok) focarPrimeiroErro(etapas[0]);\n    return ok;\n  }\n\n  formCadastro.querySelectorAll('[data-ir-etapa]').forEach(botao =>\n    botao.addEventListener('click', () => {\n      const destino = Number(botao.dataset.irEtapa);\n      if (destino === 2 && !validarEtapa1()) return;\n      irParaEtapa(destino);\n    })\n  );\n\n  // Alergias: campos condicionais\n  const radiosAlergia = formCadastro.querySelectorAll('input[name=\"alergia\"]');\n  const erroAlergia = document.getElementById('cad-alergia-erro');\n\n  radiosAlergia.forEach(radio =>\n    radio.addEventListener('change', () => {\n      const valor = radio.value;\n      erroAlergia.textContent = '';\n      detalheAlergia.hidden = valor !== 'sim';\n      avisoNaoSei.hidden = valor !== 'nao-sei';\n      if (valor !== 'sim') {\n        // Não manter dado sensível que a pessoa decidiu não informar\n        alergiaDetalhe.value = '';\n        consentimentoSaude.checked = false;\n        limparErro(alergiaDetalhe);\n        limparErro(consentimentoSaude);\n      }\n    })\n  );\n\n  ligarValidacao(alergiaDetalhe, v => v.length < 3 ? 'Descreva brevemente a substância ou o produto.' : '');\n  consentimentoSaude.addEventListener('change', () => limparErro(consentimentoSaude));\n  termos.addEventListener('change', () => limparErro(termos));\n\n  function validarEtapa2() {\n    let ok = true;\n    const alergia = formCadastro.querySelector('input[name=\"alergia\"]:checked');\n\n    if (!alergia) {\n      erroAlergia.textContent = 'Escolha uma opção. Você pode responder \"Prefiro informar ao profissional\".';\n      ok = false;\n    } else if (alergia.value === 'sim') {\n      if (!validar(alergiaDetalhe, v => v.length < 3 ? 'Descreva brevemente a substância ou o produto.' : '')) ok = false;\n      if (!consentimentoSaude.checked) {\n        mostrarErro(consentimentoSaude, 'Para registrar a alergia, precisamos da sua autorização.');\n        ok = false;\n      }\n    }\n\n    if (!termos.checked) {\n      mostrarErro(termos, 'Aceite os termos e a política de privacidade para criar a conta.');\n      ok = false;\n    }\n\n    if (!ok) {\n      if (!alergia) radiosAlergia[0].focus(); else focarPrimeiroErro(etapas[1]);\n    }\n    return ok;\n  }\n\n  formCadastro.addEventListener('submit', e => {\n    e.preventDefault();\n    definirStatus(formCadastro, '');\n\n    // Garante que a etapa 1 continua válida antes de concluir\n    if (!validarEtapa1()) { irParaEtapa(1); return; }\n    if (!validarEtapa2()) return;\n\n    simularEnvio(formCadastro.querySelector('[type=\"submit\"]'), () => {\n      const primeiroNome = nome.value.trim().split(/\\s+/)[0];\n      document.getElementById('sucesso-nome').textContent = primeiroNome;\n      formCadastro.reset(); // descarta todos os dados digitados\n      document.getElementById('area-cadastro').hidden = true;\n      const sucesso = document.getElementById('cadastro-sucesso');\n      sucesso.hidden = false;\n      document.getElementById('titulo-sucesso').focus();\n    });\n  });\n}\n", "js/cliente.js": "/* =========================================================\n   NORDEN — Área do cliente (persona Lucas)\n   Início, agendamentos, ofertas do NORDEN Flow, jornada,\n   manual de cuidados, pedidos, notificações e perfil.\n   ========================================================= */\ndocument.addEventListener('DOMContentLoaded', () => {\n  if (!N.exigir('cliente')) return;\n\n  const { PRODUTOS, CONFIG, STATUS_PEDIDO, moeda, hora, duracaoTexto, dataLonga, dataCurta, paraData, hojeIso, esc } = N;\n  const db = N.db();\n  const area = document.getElementById('secao');\n  const ID = N.CLIENTE_DEMO.id;\n\n  // ========================= CONSULTAS =========================\n  const minhas = () => db.reservas.filter(r => r.clienteId === ID);\n  const ehFutura = r => r.data > hojeIso() || (r.data === hojeIso() && r.inicio + r.duracao > N.agoraMin());\n  const proximas = () => minhas().filter(r => N.ATIVAS.includes(r.status) && ehFutura(r)).sort(ordem);\n  const anteriores = () => minhas().filter(r => !(N.ATIVAS.includes(r.status) && ehFutura(r))).sort(ordem).reverse();\n  const concluidas = () => minhas().filter(r => r.status === 'CONCLUIDO').sort(ordem).reverse();\n  const ofertasPendentes = () => db.ofertas.filter(o => o.clienteId === ID && o.status === 'PENDENTE');\n  const meusPedidos = () => db.pedidos.filter(p => p.clienteId === ID);\n  const minhasNotificacoes = () => db.notificacoes.filter(n => n.para === 'cliente');\n  function ordem(a, b) { return a.data.localeCompare(b.data) || a.inicio - b.inicio; }\n\n  const minutosAte = r => (paraData(r.data) - paraData(hojeIso())) / 6e4 + r.inicio - N.agoraMin();\n  const podeAlterar = r => minutosAte(r) >= CONFIG.cancelamentoHoras * 60;\n\n  // Expira ofertas cuja janela já passou\n  db.ofertas.forEach(o => {\n    if (o.status === 'PENDENTE' && (o.novaData < hojeIso() || (o.novaData === hojeIso() && o.novoInicio <= N.agoraMin()))) o.status = 'EXPIRADA';\n  });\n\n  // ======================== COMPONENTES ========================\n  function itemReserva(r, acoes = true) {\n    const d = paraData(r.data);\n    const alteravel = N.ATIVAS.includes(r.status) && r.status !== 'EM_ATENDIMENTO' && ehFutura(r);\n    return `\n      <li class=\"item-linha\">\n        <div class=\"item-data\"><small>${d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}<\/small><strong>${d.getDate()}<\/strong><\/div>\n        <div>\n          <h3>${esc(r.servicoNome)} ${N.selo(r.status)}<\/h3>\n          <p>${hora(r.inicio)} – ${hora(r.inicio + r.duracao)} · ${esc(N.profissional(r.profId).nome)} · ${moeda(r.preco)} · ${r.codigo}<\/p>\n        <\/div>\n        <div class=\"item-acoes\">\n          ${acoes && alteravel ? (podeAlterar(r)\n            ? `<button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-remarcar=\"${r.id}\">Remarcar<\/button>\n               <button type=\"button\" class=\"btn btn-perigo btn-pequeno\" data-cancelar=\"${r.id}\">Cancelar<\/button>`\n            : `<small class=\"texto-suave\">Alterações só até ${CONFIG.cancelamentoHoras}h antes<\/small>`) : ''}\n          ${r.status === 'CONCLUIDO' ? `<a href=\"#cuidados/${r.id}\" class=\"btn btn-escuro btn-pequeno\">Ver cuidados<\/a>` : ''}\n        <\/div>\n      <\/li>`;\n  }\n\n  function ligarAcoesReserva() {\n    area.querySelectorAll('[data-cancelar]').forEach(b => b.addEventListener('click', () => cancelar(b.dataset.cancelar)));\n    area.querySelectorAll('[data-remarcar]').forEach(b => b.addEventListener('click', () => remarcar(b.dataset.remarcar)));\n  }\n\n  // ========================== AÇÕES ==========================\n  function cancelar(id) {\n    const r = db.reservas.find(x => x.id === id);\n    N.confirmar('Cancelar agendamento', `Cancelar <strong>${esc(r.servicoNome)}<\/strong> em ${dataLonga(r.data)} às ${hora(r.inicio)}? O horário será liberado para outros clientes.`, 'Cancelar agendamento', () => {\n      if (!podeAlterar(r)) { N.toast('O prazo para cancelamento já passou.'); return; }\n      r.status = 'CANCELADO';\n      r.historico.push({ em: new Date().toISOString(), texto: 'Cancelado pelo cliente' });\n      // Ofertas que dependiam desta reserva deixam de valer\n      db.ofertas.filter(o => o.reservaId === id && o.status === 'PENDENTE').forEach(o => { o.status = 'EXPIRADA'; });\n      N.notificar('gestor', `Cancelamento: ${r.servicoNome} com ${N.profissional(r.profId).nome}, ${dataCurta(r.data)} às ${hora(r.inicio)}. Veja sugestões de encaixe no NORDEN Flow.`, 'gestao.html#flow');\n      N.salvar();\n      N.toast('Agendamento cancelado.');\n      roteador.navegar();\n    });\n  }\n\n  function remarcar(id) {\n    const r = db.reservas.find(x => x.id === id);\n    const dias = [];\n    for (let i = 0; i < CONFIG.diasExibidos; i++) {\n      const iso = N.somarDias(hojeIso(), i);\n      const livres = N.horariosLivres(r.profId, iso, r.duracao, r.id);\n      if (livres.length) dias.push({ iso, livres });\n    }\n    if (!dias.length) { N.toast('Não há horários livres com este profissional nos próximos dias.'); return; }\n\n    N.modal({\n      titulo: 'Remarcar agendamento',\n      corpo: `\n        <p class=\"texto-suave\">${esc(r.servicoNome)} com ${esc(N.profissional(r.profId).nome)} · ${duracaoTexto(r.duracao)}. Preço mantido: ${moeda(r.preco)}.<\/p>\n        <div class=\"campo\"><label for=\"rm-data\">Nova data<\/label>\n          <select id=\"rm-data\">${dias.map(d => `<option value=\"${d.iso}\">${dataLonga(d.iso)} (${d.livres.length} horários)<\/option>`).join('')}<\/select><\/div>\n        <div class=\"campo\"><label for=\"rm-hora\">Novo horário<\/label><select id=\"rm-hora\"><\/select><\/div>`,\n      aoAbrir: dlg => {\n        const sData = dlg.querySelector('#rm-data');\n        const sHora = dlg.querySelector('#rm-hora');\n        const preencher = () => {\n          sHora.innerHTML = dias.find(d => d.iso === sData.value).livres.map(h => `<option value=\"${h}\">${hora(h)} – ${hora(h + r.duracao)}<\/option>`).join('');\n        };\n        sData.addEventListener('change', preencher);\n        preencher();\n      },\n      acoes: [\n        { texto: 'Voltar', classe: 'btn-contorno-escuro' },\n        { texto: 'Confirmar remarcação', aoClicar: (fechar, dlg) => {\n          const novaData = dlg.querySelector('#rm-data').value;\n          const novoInicio = Number(dlg.querySelector('#rm-hora').value);\n          if (!N.livre(r.profId, novaData, novoInicio, r.duracao, r.id)) { N.toast('Horário indisponível. Escolha outro.'); return; }\n          const antes = `${dataCurta(r.data)} ${hora(r.inicio)}`;\n          r.data = novaData; r.inicio = novoInicio;\n          r.historico.push({ em: new Date().toISOString(), texto: `Remarcado de ${antes} para ${dataCurta(novaData)} ${hora(novoInicio)}` });\n          N.notificar('gestor', `Remarcação: ${r.servicoNome} (${r.codigo}) agora em ${dataCurta(novaData)} às ${hora(novoInicio)}.`, 'gestao.html#agenda');\n          N.salvar();\n          fechar();\n          N.toast('Agendamento remarcado.');\n          roteador.navegar();\n        } }\n      ]\n    });\n  }\n\n  function responderOferta(id, aceitar) {\n    const o = db.ofertas.find(x => x.id === id);\n    const r = db.reservas.find(x => x.id === o.reservaId);\n    if (!aceitar) {\n      o.status = 'RECUSADA';\n      N.notificar('gestor', `Oferta de antecipação recusada (${r.codigo}).`, 'gestao.html#flow');\n      N.salvar();\n      N.toast('Oferta recusada. Sua reserva original foi mantida.');\n      return roteador.navegar();\n    }\n    // Revalida: a janela precisa continuar livre (concorrência)\n    if (!N.livre(o.profId, o.novaData, o.novoInicio, r.duracao, r.id) || !N.ATIVAS.includes(r.status)) {\n      o.status = 'EXPIRADA';\n      N.salvar();\n      N.toast('Este horário não está mais disponível. Sua reserva original foi mantida.');\n      return roteador.navegar();\n    }\n    const antes = `${dataCurta(r.data)} ${hora(r.inicio)}`;\n    r.data = o.novaData; r.inicio = o.novoInicio; r.profId = o.profId;\n    r.historico.push({ em: new Date().toISOString(), texto: `Antecipado pelo NORDEN Flow de ${antes} para ${dataCurta(o.novaData)} ${hora(o.novoInicio)}` });\n    o.status = 'ACEITA';\n    // Outras ofertas para a mesma janela deixam de valer\n    db.ofertas.filter(x => x.janelaId === o.janelaId && x.id !== o.id && x.status === 'PENDENTE').forEach(x => { x.status = 'EXPIRADA'; });\n    N.notificar('gestor', `Oferta aceita: ${r.servicoNome} (${r.codigo}) antecipado para ${dataCurta(o.novaData)} às ${hora(o.novoInicio)}.`, 'gestao.html#agenda');\n    N.salvar();\n    N.toast('Horário antecipado com sucesso.');\n    roteador.navegar();\n  }\n\n  // ========================== SEÇÕES ==========================\n  const secoes = [\n    { id: 'inicio', titulo: 'Início', render: inicio },\n    { id: 'agendamentos', titulo: 'Meus agendamentos', render: agendamentos },\n    { id: 'ofertas', titulo: 'Ofertas de horário', render: ofertas, contador: () => ofertasPendentes().length },\n    { id: 'jornada', titulo: 'Minha jornada', render: jornada },\n    { id: 'cuidados', titulo: 'Manual de cuidados', render: cuidados, oculta: true, pai: 'jornada' },\n    { id: 'pedidos', titulo: 'Meus pedidos', render: pedidos },\n    { id: 'notificacoes', titulo: 'Notificações', render: notificacoes, contador: () => N.naoLidas('cliente') },\n    { id: 'perfil', titulo: 'Perfil e privacidade', render: perfil }\n  ];\n\n  function cabeca(titulo, sub) {\n    return `<header><h1 class=\"app-titulo\">${titulo}<\/h1>${sub ? `<p class=\"app-subtitulo\">${sub}<\/p>` : ''}<\/header>`;\n  }\n\n  function inicio() {\n    const prox = proximas()[0];\n    const ultima = concluidas()[0];\n    const ofs = ofertasPendentes();\n    const pedidoAberto = meusPedidos().find(p => !['CONCLUIDO', 'CANCELADO'].includes(p.status));\n    area.innerHTML = `\n      ${cabeca(`Olá, ${esc(db.perfil.nome.split(' ')[0])}.`, 'Tudo da sua conta NORDEN em um só lugar.')}\n      ${ofs.length ? `<div class=\"aviso-caixa\"><strong>NORDEN Flow:<\/strong> você tem ${ofs.length} oferta${ofs.length > 1 ? 's' : ''} para antecipar seu horário. <a href=\"#ofertas\" class=\"link-acao\">Ver ofertas<\/a><\/div>` : ''}\n      <div class=\"grade-2\">\n        <div class=\"cartao\">\n          <div class=\"cartao-cabeca\"><h2>Próximo atendimento<\/h2><a href=\"#agendamentos\">Todos<\/a><\/div>\n          ${prox ? `<ul class=\"lista-itens\">${itemReserva(prox)}<\/ul>` : `<div class=\"estado-vazio\"><p>Você não tem horários marcados.<\/p><a href=\"agendar.html\" class=\"btn btn-escuro\">Agendar<\/a><\/div>`}\n        <\/div>\n        <div class=\"cartao\">\n          <div class=\"cartao-cabeca\"><h2>Último atendimento<\/h2><a href=\"#jornada\">Jornada<\/a><\/div>\n          ${ultima ? `\n            <p><strong>${esc(ultima.servicoNome)}<\/strong> · ${dataLonga(ultima.data)}<\/p>\n            <div class=\"chips\">${ultima.produtosUsados.map(p => `<span class=\"chip\">${esc(PRODUTOS[p.id].nome)}<\/span>`).join('') || '<span class=\"texto-suave\">Sem produtos registrados<\/span>'}<\/div>\n            <div class=\"acoes-linha\" style=\"margin-top:1rem\">\n              <a href=\"#cuidados/${ultima.id}\" class=\"btn btn-escuro btn-pequeno\">Manual de cuidados<\/a>\n              <a href=\"agendar.html?servico=${ultima.servicoId}\" class=\"btn btn-contorno-escuro btn-pequeno\">Agendar de novo<\/a>\n            <\/div>` : '<p class=\"texto-suave\">Seus atendimentos concluídos aparecerão aqui.<\/p>'}\n        <\/div>\n      <\/div>\n      <div class=\"grade-3\">\n        <a class=\"cartao\" href=\"agendar.html\" style=\"text-decoration:none\"><h2>Agendar<\/h2><p class=\"texto-suave\">Escolha serviço, profissional e horário.<\/p><\/a>\n        <a class=\"cartao\" href=\"loja.html\" style=\"text-decoration:none\"><h2>Loja<\/h2><p class=\"texto-suave\">${pedidoAberto ? `Pedido ${pedidoAberto.codigo}: ${STATUS_PEDIDO[pedidoAberto.status]}` : 'Produtos usados nos seus atendimentos.'}<\/p><\/a>\n        <a class=\"cartao\" href=\"#perfil\" style=\"text-decoration:none\"><h2>Perfil<\/h2><p class=\"texto-suave\">Preferências e alertas de segurança.<\/p><\/a>\n      <\/div>`;\n    ligarAcoesReserva();\n  }\n\n  function agendamentos() {\n    const prox = proximas();\n    const ant = anteriores();\n    area.innerHTML = `\n      ${cabeca('Meus agendamentos', `Cancelamento e remarcação sem custo até ${CONFIG.cancelamentoHoras} horas antes.`)}\n      <div class=\"acoes-linha\"><a href=\"agendar.html\" class=\"btn btn-escuro btn-pequeno\">Novo agendamento<\/a><\/div>\n      <h2 style=\"font-size:1.1rem\">Próximos<\/h2>\n      ${prox.length ? `<ul class=\"lista-itens\">${prox.map(r => itemReserva(r)).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhum agendamento futuro.<\/div>'}\n      <h2 style=\"font-size:1.1rem\">Anteriores<\/h2>\n      ${ant.length ? `<ul class=\"lista-itens\">${ant.map(r => itemReserva(r, false)).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhum agendamento anterior.<\/div>'}`;\n    ligarAcoesReserva();\n  }\n\n  function ofertas() {\n    const ofs = ofertasPendentes();\n    const hist = db.ofertas.filter(o => o.clienteId === ID && o.status !== 'PENDENTE');\n    const linha = o => {\n      const r = db.reservas.find(x => x.id === o.reservaId);\n      return `\n        <li class=\"item-linha\">\n          <div class=\"item-data\"><small>${paraData(o.novaData).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}<\/small><strong>${paraData(o.novaData).getDate()}<\/strong><\/div>\n          <div>\n            <h3>${esc(r.servicoNome)} ${o.status !== 'PENDENTE' ? N.selo(o.status, { ACEITA: 'Aceita', RECUSADA: 'Recusada', EXPIRADA: 'Expirada' }) : ''}<\/h3>\n            <p>De <strong>${dataCurta(o.dataOriginal)} ${hora(o.inicioOriginal)}<\/strong>\n               para <strong>${dataCurta(o.novaData)} ${hora(o.novoInicio)}<\/strong> · ${esc(N.profissional(o.profId).nome)}${o.profId !== r.profId && o.status === 'PENDENTE' ? ' (outro profissional)' : ''}<\/p>\n            ${o.status === 'PENDENTE' ? '<p><small>Motivo: um horário mais cedo foi liberado por cancelamento. Válida até o início do novo horário; sem resposta, sua reserva original continua valendo.<\/small><\/p>' : ''}\n          <\/div>\n          <div class=\"item-acoes\">${o.status === 'PENDENTE' ? `\n            <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-recusar=\"${o.id}\">Manter original<\/button>\n            <button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-aceitar=\"${o.id}\">Aceitar<\/button>` : ''}\n          <\/div>\n        <\/li>`;\n    };\n    area.innerHTML = `\n      ${cabeca('Ofertas de horário', 'Quando um horário mais cedo fica livre, o NORDEN Flow pode te oferecer uma antecipação. Nada muda sem o seu aceite.')}\n      ${ofs.length ? `<ul class=\"lista-itens\">${ofs.map(linha).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhuma oferta pendente no momento.<\/div>'}\n      ${hist.length ? `<h2 style=\"font-size:1.1rem\">Histórico<\/h2><ul class=\"lista-itens\">${hist.map(linha).join('')}<\/ul>` : ''}`;\n    area.querySelectorAll('[data-aceitar]').forEach(b => b.addEventListener('click', () => responderOferta(b.dataset.aceitar, true)));\n    area.querySelectorAll('[data-recusar]').forEach(b => b.addEventListener('click', () => responderOferta(b.dataset.recusar, false)));\n  }\n\n  function jornada() {\n    const lista = concluidas();\n    area.innerHTML = `\n      ${cabeca('Minha jornada', 'Cada atendimento, com os produtos efetivamente usados e o seu manual de cuidados.')}\n      ${lista.length ? `<ol class=\"jornada-lista\">${lista.map(r => `\n        <li class=\"jornada-item cartao\">\n          <div class=\"cartao-cabeca\"><h2>${esc(r.servicoNome)}<\/h2><span class=\"texto-suave\">${dataLonga(r.data)}<\/span><\/div>\n          <p class=\"texto-suave\">${esc(N.profissional(r.profId).nome)} · ${duracaoTexto(r.duracao)} · ${moeda(r.preco)}<\/p>\n          <div class=\"chips\">${r.produtosUsados.length ? r.produtosUsados.map(p => `\n            <span class=\"chip\">${esc(PRODUTOS[p.id].nome)} <button type=\"button\" class=\"link-acao\" style=\"background:none;border:0;cursor:pointer;padding:0 0 0 .35rem\" data-comprar=\"${p.id}\" aria-label=\"Comprar ${esc(PRODUTOS[p.id].nome)}\">Comprar<\/button><\/span>`).join('') : '<span class=\"texto-suave\">Nenhum produto registrado.<\/span>'}<\/div>\n          <div class=\"acoes-linha\" style=\"margin-top:1rem;align-items:center;justify-content:space-between\">\n            <a href=\"#cuidados/${r.id}\" class=\"btn btn-escuro btn-pequeno\">Manual de cuidados<\/a>\n            <div>\n              <span class=\"texto-suave\" id=\"rotulo-aval-${r.id}\">${r.avaliacao ? 'Sua avaliação' : 'Avalie o atendimento'}<\/span>\n              <span class=\"estrelas\" role=\"group\" aria-labelledby=\"rotulo-aval-${r.id}\">${[1, 2, 3, 4, 5].map(n =>\n                `<button type=\"button\" data-avaliar=\"${r.id}\" data-nota=\"${n}\" class=\"${r.avaliacao && r.avaliacao.nota >= n ? 'ativa' : ''}\" aria-label=\"${n} de 5\" aria-pressed=\"${!!(r.avaliacao && r.avaliacao.nota === n)}\">★<\/button>`).join('')}<\/span>\n            <\/div>\n          <\/div>\n        <\/li>`).join('')}<\/ol>`\n        : '<div class=\"estado-vazio\"><p>Sua jornada começa no primeiro atendimento.<\/p><a href=\"agendar.html\" class=\"btn btn-escuro\">Agendar<\/a><\/div>'}`;\n    area.querySelectorAll('[data-comprar]').forEach(b => b.addEventListener('click', () => N.adicionarAoCarrinho(b.dataset.comprar)));\n    area.querySelectorAll('[data-avaliar]').forEach(b => b.addEventListener('click', () => {\n      const r = db.reservas.find(x => x.id === b.dataset.avaliar);\n      r.avaliacao = { nota: Number(b.dataset.nota), comentario: '' };\n      N.salvar();\n      N.toast('Obrigado pela avaliação!');\n      jornada();\n    }));\n  }\n\n  function cuidados(id) {\n    const r = db.reservas.find(x => x.id === id && x.clienteId === ID);\n    if (!r || !r.cuidados) {\n      area.innerHTML = `${cabeca('Manual de cuidados')}<div class=\"estado-vazio\">Manual não encontrado. <a href=\"#jornada\">Voltar à jornada<\/a><\/div>`;\n      return;\n    }\n    area.innerHTML = `\n      <a href=\"#jornada\" class=\"link-acao\">← Voltar à jornada<\/a>\n      ${cabeca(esc(r.cuidados.titulo), `${esc(r.servicoNome)} · ${dataLonga(r.data)} · ${esc(N.profissional(r.profId).nome)}`)}\n      <article class=\"manual\">\n        <h2 style=\"font-size:1rem\">Orientações revisadas pelo profissional<\/h2>\n        <ol>${r.cuidados.itens.map(i => `<li>${esc(i)}<\/li>`).join('')}<\/ol>\n      <\/article>\n      ${r.produtosUsados.length ? `\n        <div class=\"cartao\">\n          <h2>Produtos usados neste atendimento<\/h2>\n          <ul class=\"lista-itens\" style=\"margin-top:1rem\">${r.produtosUsados.map(p => `\n            <li class=\"item-linha\" style=\"grid-template-columns:1fr auto\">\n              <div><h3>${esc(PRODUTOS[p.id].nome)}<\/h3><p>${esc(PRODUTOS[p.id].desc)}<\/p><\/div>\n              <div class=\"item-acoes\"><strong>${moeda(PRODUTOS[p.id].preco)}<\/strong>\n                <button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-comprar=\"${p.id}\" ${(db.estoque[p.id] || 0) === 0 ? 'disabled' : ''}>${(db.estoque[p.id] || 0) === 0 ? 'Indisponível' : 'Adicionar'}<\/button><\/div>\n            <\/li>`).join('')}<\/ul>\n        <\/div>` : ''}\n      <p class=\"texto-suave\">Estas orientações não substituem avaliação médica. Em caso de reação, interrompa o uso e procure um profissional de saúde.<\/p>`;\n    area.querySelectorAll('[data-comprar]').forEach(b => b.addEventListener('click', () => N.adicionarAoCarrinho(b.dataset.comprar)));\n  }\n\n  function pedidos() {\n    const lista = meusPedidos();\n    area.innerHTML = `\n      ${cabeca('Meus pedidos', 'Compras da loja NORDEN.')}\n      ${lista.length ? `<ul class=\"lista-itens\">${lista.map(p => `\n        <li class=\"item-linha\" style=\"grid-template-columns:1fr auto\">\n          <div>\n            <h3>${p.codigo} ${N.selo(p.status, STATUS_PEDIDO)}<\/h3>\n            <p>${p.itens.map(i => `${i.qtd}× ${esc(PRODUTOS[i.id].nome)}`).join(', ')}<\/p>\n            <p>${p.modalidade === 'entrega' ? `Entrega (${p.km} km) · taxa ${moeda(p.taxa)}` : 'Retirada no salão'} · ${new Date(p.criadoEm).toLocaleDateString('pt-BR')}<\/p>\n          <\/div>\n          <div class=\"item-acoes\">\n            <strong>${moeda(p.total)}<\/strong>\n            ${p.status === 'RECEBIDO' ? `<button type=\"button\" class=\"btn btn-perigo btn-pequeno\" data-cancelar-pedido=\"${p.id}\">Cancelar<\/button>` : ''}\n          <\/div>\n        <\/li>`).join('')}<\/ul>`\n        : '<div class=\"estado-vazio\"><p>Você ainda não fez pedidos.<\/p><a href=\"loja.html\" class=\"btn btn-escuro\">Ir para a loja<\/a><\/div>'}`;\n    area.querySelectorAll('[data-cancelar-pedido]').forEach(b => b.addEventListener('click', () => {\n      const p = db.pedidos.find(x => x.id === b.dataset.cancelarPedido);\n      N.confirmar('Cancelar pedido', `Cancelar o pedido <strong>${p.codigo}<\/strong>?`, 'Cancelar pedido', () => {\n        if (p.status !== 'RECEBIDO') { N.toast('O pedido já está em separação e não pode mais ser cancelado.'); return; }\n        p.status = 'CANCELADO';\n        p.itens.forEach(i => { db.estoque[i.id] += i.qtd; });\n        p.historico.push({ em: new Date().toISOString(), texto: 'Cancelado pelo cliente' });\n        N.notificar('gestor', `Pedido ${p.codigo} cancelado pelo cliente.`, 'gestao.html#pedidos');\n        N.salvar();\n        N.toast('Pedido cancelado.');\n        pedidos();\n      });\n    }));\n  }\n\n  function notificacoes() {\n    const lista = minhasNotificacoes();\n    area.innerHTML = `\n      ${cabeca('Notificações')}\n      ${lista.some(n => !n.lida) ? '<div class=\"acoes-linha\"><button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" id=\"marcar-lidas\">Marcar todas como lidas<\/button><\/div>' : ''}\n      ${lista.length ? `<ul class=\"lista-itens\">${lista.map(n => `\n        <li class=\"item-linha\" style=\"grid-template-columns:1fr auto${n.lida ? ';opacity:.7' : ''}\">\n          <div><h3 style=\"font-size:.95rem\">${n.lida ? '' : '<span class=\"selo selo-pendente\">Nova<\/span> '}${esc(n.texto)}<\/h3>\n          <p>${new Date(n.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}<\/p><\/div>\n          <div class=\"item-acoes\">${n.link ? `<a href=\"${n.link}\" class=\"btn btn-contorno-escuro btn-pequeno\" data-ler=\"${n.id}\">Abrir<\/a>` : ''}<\/div>\n        <\/li>`).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhuma notificação.<\/div>'}`;\n    const marcar = document.getElementById('marcar-lidas');\n    if (marcar) marcar.addEventListener('click', () => { lista.forEach(n => { n.lida = true; }); N.salvar(); roteador.navegar(); });\n    area.querySelectorAll('[data-ler]').forEach(a => a.addEventListener('click', () => {\n      db.notificacoes.find(n => n.id === a.dataset.ler).lida = true;\n      N.salvar();\n    }));\n  }\n\n  function perfil() {\n    const p = db.perfil;\n    const opcoes = [['sim', 'Sim'], ['nao', 'Não'], ['nao-sei', 'Não sei'], ['informar-profissional', 'Prefiro informar ao profissional'], ['nao-informado', 'Ainda não informado']];\n    area.innerHTML = `\n      ${cabeca('Perfil e privacidade', 'Seus dados de demonstração ficam apenas neste navegador.')}\n      <form class=\"cartao form-grade duas\" id=\"form-perfil\" novalidate>\n        <h2 class=\"inteiro\">Dados pessoais<\/h2>\n        <div class=\"campo\"><label for=\"pf-nome\">Nome<\/label><input id=\"pf-nome\" value=\"${esc(p.nome)}\" autocomplete=\"name\"><p class=\"campo-erro\" id=\"pf-nome-erro\"><\/p><\/div>\n        <div class=\"campo\"><label for=\"pf-tel\">Celular<\/label><input id=\"pf-tel\" value=\"${esc(p.telefone)}\" inputmode=\"numeric\" autocomplete=\"tel-national\"><\/div>\n        <div class=\"campo inteiro\"><label for=\"pf-email\">E-mail<\/label><input id=\"pf-email\" value=\"${esc(p.email)}\" disabled><p class=\"texto-suave\">A alteração de e-mail exige verificação e não está disponível na demonstração.<\/p><\/div>\n        <fieldset class=\"inteiro\" style=\"border:0;padding:0;margin:0\"><legend style=\"font-weight:600;font-size:.88rem;margin-bottom:.6rem\">Serviços de interesse<\/legend>\n          <div class=\"chips\">${N.SERVICOS.filter(s => s.id !== 'pezinho').map(s => `\n            <label class=\"chip\" style=\"cursor:pointer\"><input type=\"checkbox\" name=\"pf-pref\" value=\"${s.id}\" ${p.preferencias.includes(s.id) ? 'checked' : ''}> ${esc(s.nome)}<\/label>`).join('')}<\/div>\n        <\/fieldset>\n        <div class=\"inteiro\"><button type=\"submit\" class=\"btn btn-escuro\">Salvar dados<\/button><\/div>\n      <\/form>\n\n      <form class=\"cartao form-grade\" id=\"form-alergia\" novalidate>\n        <h2>Alergias e sensibilidades<\/h2>\n        <p class=\"texto-suave\">Visível apenas para o profissional do seu atendimento. Não informar não significa ausência de alergia: avise o profissional se tiver dúvida.<\/p>\n        <div class=\"campo\"><label for=\"pf-alergia\">Você tem alergia ou sensibilidade a produtos?<\/label>\n          <select id=\"pf-alergia\">${opcoes.map(([v, t]) => `<option value=\"${v}\" ${p.alergia === v ? 'selected' : ''}>${t}<\/option>`).join('')}<\/select><\/div>\n        <div class=\"campo\" id=\"pf-detalhe-campo\" ${p.alergia === 'sim' ? '' : 'hidden'}><label for=\"pf-detalhe\">Quais substâncias ou produtos?<\/label>\n          <textarea id=\"pf-detalhe\" maxlength=\"300\">${esc(p.alergiaDetalhe)}<\/textarea><p class=\"campo-erro\" id=\"pf-detalhe-erro\"><\/p><\/div>\n        <div class=\"acoes-linha\">\n          <button type=\"submit\" class=\"btn btn-escuro\">Salvar alerta<\/button>\n          <button type=\"button\" class=\"btn btn-perigo\" id=\"pf-remover\">Remover informação<\/button>\n        <\/div>\n      <\/form>\n\n      <div class=\"cartao\">\n        <h2>Dados de demonstração<\/h2>\n        <p class=\"texto-suave\" style=\"margin:.5rem 0 1rem\">Apaga agendamentos, pedidos e alterações desta demonstração e restaura os dados iniciais.<\/p>\n        <div class=\"acoes-linha\">\n          <button type=\"button\" class=\"btn btn-contorno-escuro\" id=\"pf-redefinir\">Redefinir demonstração<\/button>\n          <button type=\"button\" class=\"btn btn-contorno-escuro\" id=\"pf-sair\">Sair<\/button>\n        <\/div>\n      <\/div>`;\n\n    const sel = document.getElementById('pf-alergia');\n    sel.addEventListener('change', () => { document.getElementById('pf-detalhe-campo').hidden = sel.value !== 'sim'; });\n\n    document.getElementById('form-perfil').addEventListener('submit', e => {\n      e.preventDefault();\n      const nome = document.getElementById('pf-nome').value.trim();\n      if (nome.length < 2) { document.getElementById('pf-nome-erro').textContent = 'Informe seu nome.'; return; }\n      p.nome = nome;\n      p.telefone = document.getElementById('pf-tel').value.trim();\n      p.preferencias = [...area.querySelectorAll('input[name=\"pf-pref\"]:checked')].map(i => i.value);\n      N.salvar();\n      N.toast('Dados salvos.');\n    });\n\n    document.getElementById('form-alergia').addEventListener('submit', e => {\n      e.preventDefault();\n      const detalhe = document.getElementById('pf-detalhe').value.trim();\n      if (sel.value === 'sim' && detalhe.length < 3) { document.getElementById('pf-detalhe-erro').textContent = 'Descreva brevemente a substância ou o produto.'; return; }\n      p.alergia = sel.value;\n      p.alergiaDetalhe = sel.value === 'sim' ? detalhe : '';\n      N.salvar();\n      N.toast('Alerta atualizado.');\n    });\n\n    document.getElementById('pf-remover').addEventListener('click', () =>\n      N.confirmar('Remover informação', 'Remover sua informação sobre alergias e sensibilidades?', 'Remover', () => {\n        p.alergia = 'nao-informado'; p.alergiaDetalhe = '';\n        N.salvar(); N.toast('Informação removida.'); perfil();\n      }));\n    document.getElementById('pf-redefinir').addEventListener('click', () =>\n      N.confirmar('Redefinir demonstração', 'Todos os dados desta demonstração voltarão ao estado inicial.', 'Redefinir', () => { N.redefinir(); location.reload(); }));\n    document.getElementById('pf-sair').addEventListener('click', N.sair);\n  }\n\n  // ========================= ROTEADOR =========================\n  const roteador = N.roteador({\n    secoes, padrao: 'inicio',\n    aoMudar: (secao, param) => {\n      document.title = secao.titulo + ' — NORDEN';\n      secao.render(param);\n      N.salvar();\n    }\n  });\n  roteador.navegar();\n});\n", "js/core.js": "/* =========================================================\n   NORDEN — Núcleo compartilhado (todas as páginas)\n   - Catálogo e regras de demonstração\n   - \"Banco\" de demonstração no localStorage (somente neste navegador)\n   - Sessão de demonstração (cliente / gestor), sem senha real\n   - Cabeçalho com menus suspensos e rodapé\n   Em produção, tudo isto é substituído por backend + autenticação real.\n   ========================================================= */\n\nconst N = (() => {\n\n  // ========================= CATÁLOGO (ilustrativo) =========================\n  const SERVICOS = [\n    { id: 'corte', nome: 'Corte masculino', desc: 'Tesoura e máquina, alinhado ao seu formato de rosto e rotina. Inclui finalização.', preco: 70, duracao: 45, profissionais: ['p1', 'p2'], produtos: ['pomada', 'shampoo'] },\n    { id: 'barba', nome: 'Barba completa', desc: 'Modelagem, toalha quente, navalha e hidratação com óleo ou balm.', preco: 50, duracao: 30, profissionais: ['p1', 'p2'], produtos: ['oleo', 'balm'] },\n    { id: 'corte-barba', nome: 'Corte + Barba', desc: 'O combo completo em um único horário, sem conflitos na agenda.', preco: 110, duracao: 75, profissionais: ['p1', 'p2'], produtos: ['pomada', 'oleo', 'balm'] },\n    { id: 'capilar', nome: 'Tratamento capilar', desc: 'Limpeza profunda e hidratação do couro cabeludo.', preco: 90, duracao: 40, profissionais: ['p3'], produtos: ['shampoo', 'tonico'] },\n    { id: 'pele', nome: 'Limpeza de pele', desc: 'Higienização, esfoliação e hidratação facial. Alergias informadas são consideradas.', preco: 120, duracao: 60, profissionais: ['p3'], produtos: ['hidratante'] },\n    { id: 'pezinho', nome: 'Pezinho e acabamento', desc: 'Manutenção rápida do contorno entre cortes.', preco: 30, duracao: 15, profissionais: ['p1', 'p2', 'p3'], produtos: [] }\n  ];\n\n  // dias: 0 = domingo ... 6 = sábado\n  const PROFISSIONAIS = [\n    { id: 'p1', nome: 'Profissional 01', sigla: 'P1', bio: 'Barbeiro com foco em barba clássica e navalha.', tags: ['Barba', 'Navalha'], dias: [2, 3, 4, 5, 6] },\n    { id: 'p2', nome: 'Profissional 02', sigla: 'P2', bio: 'Cabeleireiro masculino, especialista em cortes modernos e degradê.', tags: ['Degradê', 'Tesoura'], dias: [2, 3, 4, 5, 6] },\n    { id: 'p3', nome: 'Profissional 03', sigla: 'P3', bio: 'Terapeuta capilar e de pele, com atendimento a peles sensíveis.', tags: ['Capilar', 'Pele'], dias: [3, 4, 5, 6] }\n  ];\n\n  const PRODUTOS = {\n    pomada:     { nome: 'Pomada modeladora matte', categoria: 'Cabelo', desc: 'Fixação média, efeito seco. Aplique pouca quantidade no cabelo seco.', preco: 59.9, forma: 'pote' },\n    shampoo:    { nome: 'Shampoo antirresíduo', categoria: 'Cabelo', desc: 'Limpeza profunda do couro cabeludo. Uso 2 a 3 vezes por semana.', preco: 44.9, forma: 'frasco' },\n    tonico:     { nome: 'Tônico capilar', categoria: 'Cabelo', desc: 'Uso diário após o banho, no couro cabeludo.', preco: 54.9, forma: 'frasco' },\n    oleo:       { nome: 'Óleo para barba', categoria: 'Barba', desc: 'Hidrata e alinha os fios. 3 a 4 gotas após o banho.', preco: 49.9, forma: 'frasco' },\n    balm:       { nome: 'Balm pós-barba', categoria: 'Barba', desc: 'Acalma a pele após a navalha.', preco: 39.9, forma: 'pote' },\n    hidratante: { nome: 'Hidratante facial', categoria: 'Pele', desc: 'Toque seco, sem brilho. Uso pela manhã.', preco: 64.9, forma: 'frasco' }\n  };\n\n  const MANUAIS_PADRAO = {\n    'corte':       { titulo: 'Cuidados após o corte', itens: ['Lave com shampoo adequado 2 a 3 vezes por semana.', 'Finalize com pouca pomada, no cabelo seco.', 'Agende a manutenção em 3 a 4 semanas.'] },\n    'barba':       { titulo: 'Cuidados com a barba', itens: ['Evite coçar a região nas primeiras 24 horas.', 'Aplique óleo para barba após o banho.', 'Use balm se houver ardência após a navalha.'] },\n    'corte-barba': { titulo: 'Cuidados com corte e barba', itens: ['Cabelo: finalize com pomada no cabelo seco.', 'Barba: óleo diário após o banho.', 'Evite produtos com álcool na pele nas primeiras 24 horas.', 'Manutenção sugerida em 3 semanas.'] },\n    'capilar':     { titulo: 'Cuidados após tratamento capilar', itens: ['Não lave o cabelo nas próximas 12 horas.', 'Use o tônico diariamente no couro cabeludo.', 'Evite água muito quente.'] },\n    'pele':        { titulo: 'Cuidados após limpeza de pele', itens: ['Evite sol direto por 48 horas e use protetor solar.', 'Não use esfoliantes por 5 dias.', 'Hidrate a pele pela manhã e à noite.'] },\n    'pezinho':     { titulo: 'Cuidados com o acabamento', itens: ['Evite produtos com álcool na nuca nas primeiras horas.', 'Próximo acabamento sugerido em 10 a 15 dias.'] }\n  };\n\n  // Parâmetros configuráveis (valores ilustrativos)\n  const CONFIG = {\n    abertura: 9 * 60,\n    fechamento: { padrao: 19 * 60, sabado: 17 * 60 },\n    almoco: [12 * 60, 13 * 60],\n    passo: 15,\n    intervalo: 0,\n    antecedencia: 30,\n    diasExibidos: 14,\n    cancelamentoHoras: 2,\n    entrega: { base: 5, porKm: 1.5, raioMaxKm: 15 },\n    estoqueBaixo: 5\n  };\n\n  const ATIVAS = ['PENDENTE', 'CONFIRMADO', 'EM_ATENDIMENTO'];\n\n  const STATUS_RESERVA = {\n    PENDENTE: 'Pendente', CONFIRMADO: 'Confirmado', EM_ATENDIMENTO: 'Em atendimento',\n    CONCLUIDO: 'Concluído', CANCELADO: 'Cancelado', NAO_COMPARECEU: 'Não compareceu'\n  };\n  const STATUS_PEDIDO = {\n    RECEBIDO: 'Recebido', EM_SEPARACAO: 'Em separação', PRONTO_RETIRADA: 'Pronto para retirada',\n    SAIU_ENTREGA: 'Saiu para entrega', CONCLUIDO: 'Concluído', CANCELADO: 'Cancelado'\n  };\n\n  const CLIENTE_DEMO = { id: 'c-demo', nome: 'Lucas M.', email: 'lucas.demo@exemplo.com', telefone: '(00) 00000-0000' };\n  const GESTOR_DEMO = { id: 'g-demo', nome: 'Rafael A.' };\n\n  // ============================ UTILITÁRIOS ============================\n  const moeda = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n  const hora = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');\n  const duracaoTexto = m => m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');\n  const isoData = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n  const paraData = iso => new Date(iso + 'T00:00:00');\n  const hojeIso = () => isoData(new Date());\n  const somarDias = (iso, n) => { const d = paraData(iso); d.setDate(d.getDate() + n); return isoData(d); };\n  const dataLonga = iso => paraData(iso).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });\n  const dataCurta = iso => paraData(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');\n  const agoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };\n  const uid = prefixo => prefixo + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\n  const codigo = () => 'NRD-' + Math.random().toString(36).slice(2, 7).toUpperCase();\n  const esc = t => String(t ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n\n  const servico = id => SERVICOS.find(s => s.id === id);\n  const profissional = id => PROFISSIONAIS.find(p => p.id === id);\n  const fechamentoDo = iso => paraData(iso).getDay() === 6 ? CONFIG.fechamento.sabado : CONFIG.fechamento.padrao;\n  const salaoAberto = iso => PROFISSIONAIS.some(p => p.dias.includes(paraData(iso).getDay()));\n\n  function geradorSemente(texto) {\n    let h = 2166136261;\n    for (const c of texto) h = Math.imul(h ^ c.charCodeAt(0), 16777619);\n    return () => {\n      h += 0x6D2B79F5;\n      let t = h;\n      t = Math.imul(t ^ (t >>> 15), t | 1);\n      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n\n  // ======================= BANCO DE DEMONSTRAÇÃO =======================\n  const CHAVE_DB = 'norden-demo-v1';\n  const CHAVE_SESSAO = 'norden-sessao';\n  let db = null;\n\n  function novaReserva(dados) {\n    const s = servico(dados.servicoId);\n    return {\n      id: uid('r'), codigo: codigo(), status: 'CONFIRMADO', produtosPref: [], obs: '',\n      produtosUsados: [], cuidados: null, avaliacao: null,\n      // preço, duração e nome congelados no momento da confirmação\n      servicoNome: s.nome, duracao: s.duracao, preco: s.preco,\n      historico: [{ em: new Date().toISOString(), texto: 'Reserva confirmada' }],\n      ...dados\n    };\n  }\n\n  function semear() {\n    const hoje = hojeIso();\n    const rnd = geradorSemente('norden-' + hoje);\n    const nomes = ['Cliente A', 'Cliente B', 'Cliente C', 'Cliente D', 'Cliente E', 'Cliente F', 'Cliente G', 'Cliente H'];\n    const estoque = { pomada: 14, shampoo: 9, tonico: 4, oleo: 12, balm: 3, hidratante: 7 };\n    const base = { reservas: [], pedidos: [], carrinho: [], ofertas: [], notificacoes: [], estoque, manuais: JSON.parse(JSON.stringify(MANUAIS_PADRAO)), perfil: { ...CLIENTE_DEMO, preferencias: ['corte', 'barba'], alergia: 'nao-informado', alergiaDetalhe: '' }, criadoEm: new Date().toISOString() };\n    db = base;\n\n    // Reservas fictícias de outros clientes (próximos 14 dias)\n    for (let i = 0; i < CONFIG.diasExibidos; i++) {\n      const iso = somarDias(hoje, i);\n      PROFISSIONAIS.forEach(p => {\n        if (!p.dias.includes(paraData(iso).getDay())) return;\n        const habilitados = SERVICOS.filter(s => s.profissionais.includes(p.id));\n        const qtd = 3 + Math.floor(rnd() * 4);\n        for (let k = 0; k < qtd; k++) {\n          const s = habilitados[Math.floor(rnd() * habilitados.length)];\n          const fim = fechamentoDo(iso);\n          const inicio = CONFIG.abertura + Math.floor(rnd() * ((fim - CONFIG.abertura - s.duracao) / 30)) * 30;\n          if (!livre(p.id, iso, inicio, s.duracao)) continue;\n          base.reservas.push(novaReserva({ clienteId: 'outro', clienteNome: nomes[Math.floor(rnd() * nomes.length)] + ' (fictício)', servicoId: s.id, profId: p.id, data: iso, inicio }));\n        }\n      });\n    }\n\n    // Histórico do cliente demo: dois atendimentos concluídos\n    const passado = [\n      { dias: -45, servicoId: 'capilar', profId: 'p3', inicio: 10 * 60, usados: ['shampoo', 'tonico'], nota: 5 },\n      { dias: -18, servicoId: 'corte-barba', profId: 'p2', inicio: 17 * 60, usados: ['pomada', 'oleo'], nota: null }\n    ];\n    passado.forEach(h => {\n      const r = novaReserva({ clienteId: CLIENTE_DEMO.id, clienteNome: CLIENTE_DEMO.nome, servicoId: h.servicoId, profId: h.profId, data: somarDias(hoje, h.dias), inicio: h.inicio });\n      r.status = 'CONCLUIDO';\n      r.produtosUsados = h.usados.map(id => ({ id, qtd: 1 }));\n      r.cuidados = JSON.parse(JSON.stringify(MANUAIS_PADRAO[h.servicoId]));\n      r.avaliacao = h.nota ? { nota: h.nota, comentario: '' } : null;\n      r.historico.push({ em: new Date().toISOString(), texto: 'Atendimento concluído' });\n      base.reservas.push(r);\n    });\n\n    // Próxima reserva do cliente demo (candidata a antecipação pelo NORDEN Flow)\n    let alvo = somarDias(hoje, 4);\n    while (!profissional('p2').dias.includes(paraData(alvo).getDay())) alvo = somarDias(alvo, 1);\n    let inicioDemo = 18 * 60 + 30;\n    if (paraData(alvo).getDay() === 6) inicioDemo = 15 * 60;\n    base.reservas = base.reservas.filter(r => !(r.profId === 'p2' && r.data === alvo && r.inicio < inicioDemo + 45 && inicioDemo < r.inicio + r.duracao));\n    base.reservas.push(novaReserva({ clienteId: CLIENTE_DEMO.id, clienteNome: CLIENTE_DEMO.nome, servicoId: 'corte', profId: 'p2', data: alvo, inicio: inicioDemo, produtosPref: ['pomada'] }));\n\n    base.notificacoes.push({ id: uid('n'), para: 'cliente', texto: 'Bem-vindo ao NORDEN! Seu manual de cuidados do último atendimento está disponível.', link: 'cliente.html#jornada', lida: false, em: new Date().toISOString() });\n    salvar();\n  }\n\n  function carregar() {\n    if (db) return db;\n    try { db = JSON.parse(localStorage.getItem(CHAVE_DB)); } catch { db = null; }\n    if (!db) semear();\n    return db;\n  }\n\n  function salvar() {\n    try { localStorage.setItem(CHAVE_DB, JSON.stringify(db)); } catch { /* armazenamento indisponível: segue em memória */ }\n  }\n\n  function redefinir() {\n    try { localStorage.removeItem(CHAVE_DB); } catch { /* sem armazenamento */ }\n    db = null;\n    carregar();\n  }\n\n  // ============================== SESSÃO ==============================\n  // Sessão guardada no navegador; se o armazenamento estiver bloqueado, vale só nesta aba\n  let sessaoMemoria = null;\n  const sessao = () => { try { return localStorage.getItem(CHAVE_SESSAO) || sessaoMemoria; } catch { return sessaoMemoria; } }; // 'cliente' | 'gestor' | null\n  function entrar(perfil) { sessaoMemoria = perfil; try { localStorage.setItem(CHAVE_SESSAO, perfil); } catch { /* sem armazenamento */ } }\n  function sair() { sessaoMemoria = null; try { localStorage.removeItem(CHAVE_SESSAO); } catch { /* sem armazenamento */ } ir('index.html'); }\n\n  // ======================= NAVEGAÇÃO ENTRE PÁGINAS =======================\n  // No site normal usa o endereço do navegador. No arquivo único (NORDEN_compartilhar.html)\n  // cada página roda dentro de um quadro e a navegação é feita pelo arquivo principal.\n  const params = () => new URLSearchParams(window.__NORDEN_QUERY ?? location.search);\n  const paginaAtual = () => window.__NORDEN_PAGINA || location.pathname.split('/').pop() || 'index.html';\n  function ir(url, substituir) {\n    if (window.__NORDEN_NAV) return window.__NORDEN_NAV(url);\n    if (substituir) location.replace(url); else location.href = url;\n  }\n\n  // Protege páginas: em produção, a autorização é verificada no servidor\n  function exigir(perfil) {\n    if (sessao() === perfil) return true;\n    const destino = encodeURIComponent(paginaAtual() + (window.__NORDEN_QUERY ?? location.search) + location.hash);\n    ir('login.html?perfil=' + perfil + '&voltar=' + destino, true);\n    return false;\n  }\n\n  // ============================== AGENDA ==============================\n  function reservasAtivas(profId, iso, ignorarId) {\n    return carregar().reservas.filter(r => r.profId === profId && r.data === iso && ATIVAS.includes(r.status) && r.id !== ignorarId);\n  }\n\n  // Intervalos semiabertos [início, fim)\n  function livre(profId, iso, inicio, duracao, ignorarId) {\n    const fim = inicio + duracao + CONFIG.intervalo;\n    const [aIni, aFim] = CONFIG.almoco;\n    if (inicio < aFim && aIni < fim) return false;\n    if (inicio < CONFIG.abertura || inicio + duracao > fechamentoDo(iso)) return false;\n    return !reservasAtivas(profId, iso, ignorarId).some(r => inicio < r.inicio + r.duracao + CONFIG.intervalo && r.inicio < fim);\n  }\n\n  function horariosLivres(profId, iso, duracao, ignorarId) {\n    const prof = profissional(profId);\n    if (!prof || !prof.dias.includes(paraData(iso).getDay())) return [];\n    const hoje = hojeIso();\n    if (iso < hoje) return [];\n    const minimo = iso === hoje ? agoraMin() + CONFIG.antecedencia : 0;\n    const lista = [];\n    for (let ini = CONFIG.abertura; ini + duracao <= fechamentoDo(iso); ini += CONFIG.passo) {\n      if (ini >= minimo && livre(profId, iso, ini, duracao, ignorarId)) lista.push(ini);\n    }\n    return lista;\n  }\n\n  // NORDEN Flow (seção 10.2): reservas futuras que caberiam em uma janela liberada.\n  // Critérios explícitos: mesmo profissional > aproveitamento da janela > maior antecipação.\n  function sugestoesFlow(janela, limite = 8) {\n    const tamanho = janela.fim - janela.inicio;\n    const d = carregar();\n    return d.reservas\n      .filter(r => r.status === 'CONFIRMADO')                                                   // exclui canceladas, concluídas, faltas\n      .filter(r => r.data > janela.data || (r.data === janela.data && r.inicio > janela.inicio)) // só antecipação\n      .filter(r => r.duracao + CONFIG.intervalo <= tamanho)                                     // cabe na janela\n      .filter(r => servico(r.servicoId).profissionais.includes(janela.profId))                  // profissional habilitado\n      .filter(r => livre(janela.profId, janela.data, janela.inicio, r.duracao, r.id))           // sem conflitos\n      .filter(r => !d.ofe
