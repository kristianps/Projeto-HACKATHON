rtas.some(o => o.reservaId === r.id && o.janelaId === janela.id && o.status === 'RECUSADA')) // recusou esta janela\n      .filter(r => !d.ofertas.some(o => o.reservaId === r.id && o.status === 'PENDENTE' && o.janelaId !== janela.id))\n      .map(r => {\n        const ganhoDias = Math.round((paraData(r.data) - paraData(janela.data)) / 864e5);\n        const aproveitamento = Math.round(r.duracao / tamanho * 100);\n        const mesmoProf = r.profId === janela.profId;\n        const motivos = [mesmoProf ? 'mesmo profissional' : 'profissional habilitado (troca exige aceite)',\n          `ocupa ${aproveitamento}% da janela`, ganhoDias ? `antecipa ${ganhoDias} dia(s)` : 'antecipa no mesmo dia'];\n        return { reserva: r, ganhoDias, aproveitamento, mesmoProf, motivo: motivos.join(' · ') };\n      })\n      .sort((a, b) => (b.mesmoProf - a.mesmoProf) || (b.aproveitamento - a.aproveitamento) || (b.ganhoDias - a.ganhoDias) || (a.reserva.inicio - b.reserva.inicio))\n      .slice(0, limite);\n  }\n\n  // =========================== NOTIFICAÇÕES ===========================\n  function notificar(para, texto, link) {\n    carregar().notificacoes.unshift({ id: uid('n'), para, texto, link: link || '', lida: false, em: new Date().toISOString() });\n  }\n  const naoLidas = para => carregar().notificacoes.filter(n => n.para === para && !n.lida).length;\n\n  // ============================= CARRINHO =============================\n  function adicionarAoCarrinho(produtoId, qtd = 1) {\n    const d = carregar();\n    const item = d.carrinho.find(i => i.id === produtoId);\n    const atual = item ? item.qtd : 0;\n    const disponivel = d.estoque[produtoId] || 0;\n    if (atual + qtd > disponivel) {\n      toast('Quantidade indisponível em estoque.');\n      return false;\n    }\n    if (item) item.qtd += qtd; else d.carrinho.push({ id: produtoId, qtd });\n    salvar();\n    atualizarContadorCarrinho();\n    toast('<strong>' + esc(PRODUTOS[produtoId].nome) + '<\/strong> adicionado ao carrinho. <a href=\"carrinho.html\">Ver carrinho<\/a>');\n    return true;\n  }\n  const itensCarrinho = () => carregar().carrinho.reduce((s, i) => s + i.qtd, 0);\n\n  function taxaEntrega(km) {\n    const { base, porKm, raioMaxKm } = CONFIG.entrega;\n    if (!(km > 0) || km > raioMaxKm) return null;\n    return Math.round((base + porKm * km) * 100) / 100;\n  }\n\n  // ============================== TOAST ==============================\n  let timerToast;\n  function toast(html) {\n    let el = document.getElementById('toast');\n    if (!el) {\n      el = document.createElement('div');\n      el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');\n      document.body.appendChild(el);\n    }\n    el.innerHTML = html;\n    el.classList.add('visivel');\n    clearTimeout(timerToast);\n    timerToast = setTimeout(() => el.classList.remove('visivel'), 3600);\n  }\n\n  // ===================== CABEÇALHO COM MENUS SUSPENSOS =====================\n  function menus() {\n    const perfil = sessao();\n    const notif = perfil ? naoLidas(perfil) : 0;\n    const grupos = [\n      { id: 'salao', titulo: 'O Salão', itens: [\n        ['servicos.html', 'Serviços', 'Preços, durações e detalhes'],\n        ['profissionais.html', 'Profissionais', 'Especialidades da equipe'],\n        ['index.html#como-funciona', 'Como funciona', 'Antes, durante e depois'],\n        ['contato.html', 'Contato e dúvidas', 'Horários, endereço e FAQ']\n      ] },\n      { id: 'loja', titulo: 'Loja', itens: [\n        ['loja.html', 'Todos os produtos', 'Retirada no salão ou entrega'],\n        ['loja.html?cat=Cabelo', 'Cabelo', ''],\n        ['loja.html?cat=Barba', 'Barba', ''],\n        ['loja.html?cat=Pele', 'Pele', ''],\n        ['carrinho.html', 'Carrinho', 'Revise e finalize seu pedido']\n      ] }\n    ];\n    if (perfil === 'cliente') grupos.push({ id: 'conta', titulo: 'Minha conta', itens: [\n      ['cliente.html#inicio', 'Início', 'Resumo da sua conta'],\n      ['cliente.html#agendamentos', 'Meus agendamentos', 'Próximos e anteriores'],\n      ['cliente.html#ofertas', 'Ofertas de horário', 'Antecipações do NORDEN Flow'],\n      ['cliente.html#jornada', 'Minha jornada', 'Histórico e cuidados'],\n      ['cliente.html#pedidos', 'Meus pedidos', 'Compras da loja'],\n      ['cliente.html#notificacoes', 'Notificações' + (notif ? ' (' + notif + ')' : ''), ''],\n      ['cliente.html#perfil', 'Perfil e privacidade', 'Dados, preferências e alertas'],\n      ['#sair', 'Sair', '']\n    ] });\n    if (perfil === 'gestor') grupos.push({ id: 'gestao', titulo: 'Gestão', itens: [\n      ['gestao.html#painel', 'Painel', 'Indicadores do dia'],\n      ['gestao.html#agenda', 'Agenda', 'Atendimentos por profissional'],\n      ['gestao.html#flow', 'NORDEN Flow', 'Encaixes após cancelamentos'],\n      ['gestao.html#estoque', 'Produtos e estoque', 'Disponibilidade e ajustes'],\n      ['gestao.html#pedidos', 'Pedidos da loja', 'Separação e entrega'],\n      ['gestao.html#manuais', 'Manuais de cuidados', 'Biblioteca por serviço'],\n      ['gestao.html#notificacoes', 'Notificações' + (notif ? ' (' + notif + ')' : ''), ''],\n      ['#sair', 'Sair', '']\n    ] });\n    return grupos;\n  }\n\n  function cabecalho() {\n    const alvo = document.getElementById('topo');\n    if (!alvo) return;\n    const perfil = sessao();\n    const nomePerfil = perfil === 'cliente' ? carregar().perfil.nome : perfil === 'gestor' ? GESTOR_DEMO.nome : '';\n    const grupos = menus();\n\n    const htmlGrupo = g => `\n      <li class=\"menu-grupo\">\n        <button type=\"button\" class=\"menu-gatilho\" aria-expanded=\"false\" aria-controls=\"menu-${g.id}\">\n          ${g.titulo}<svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M1 3l4 4 4-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>\n        <\/button>\n        <ul class=\"menu-suspenso\" id=\"menu-${g.id}\" hidden>\n          ${g.itens.map(([href, txt, sub]) => `<li><a href=\"${href}\"${href === '#sair' ? ' data-sair' : ''}><span>${txt}<\/span>${sub ? `<small>${sub}<\/small>` : ''}<\/a><\/li>`).join('')}\n        <\/ul>\n      <\/li>`;\n\n    alvo.className = 'cabecalho';\n    alvo.innerHTML = `\n      <div class=\"container\">\n        <a href=\"index.html\" class=\"marca\" aria-label=\"NORDEN — página inicial\">\n          <span class=\"marca-nome\">NORDEN<\/span>\n          <span class=\"marca-sub\">Salão masculino premium<\/span>\n        <\/a>\n        <nav class=\"nav-menus\" id=\"nav-menus\" aria-label=\"Navegação principal\">\n          <ul class=\"menu-raiz\">${grupos.map(htmlGrupo).join('')}<\/ul>\n          <div class=\"nav-movel-extra\">\n            <a href=\"agendar.html\" class=\"btn btn-primario btn-bloco\" style=\"margin-bottom:1rem\">Agendar horário<\/a>\n            ${perfil ? `<p class=\"sessao-info\">Conectado como <strong>${esc(nomePerfil)}<\/strong> · demonstração<\/p>` : '<a href=\"login.html\" class=\"btn btn-contorno btn-bloco\">Entrar<\/a>'}\n          <\/div>\n        <\/nav>\n        <div class=\"acoes-cabecalho\">\n          ${perfil ? `<span class=\"sessao-chip\" title=\"Sessão de demonstração\">${perfil === 'gestor' ? 'Gestão' : 'Cliente'} · ${esc(nomePerfil)}<\/span>` : '<a href=\"login.html\" class=\"link-entrar\">Entrar<\/a>'}\n          <a href=\"carrinho.html\" class=\"btn-carrinho\" aria-label=\"Carrinho\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M4 7h16l-1.5 13h-13z\"/><path d=\"M9 7V5a3 3 0 0 1 6 0v2\"/><\/svg>\n            <span class=\"contador-carrinho\" data-contador-carrinho hidden>0<\/span>\n          <\/a>\n          <a href=\"agendar.html\" class=\"btn btn-primario\">Agendar<\/a>\n          <button class=\"btn-menu\" type=\"button\" aria-expanded=\"false\" aria-controls=\"nav-menus\" aria-label=\"Abrir menu\"><span><\/span><\/button>\n        <\/div>\n      <\/div>`;\n\n    // Abrir/fechar menus suspensos\n    const gatilhos = alvo.querySelectorAll('.menu-gatilho');\n    const fecharTodos = exceto => gatilhos.forEach(g => {\n      if (g === exceto) return;\n      g.setAttribute('aria-expanded', 'false');\n      document.getElementById(g.getAttribute('aria-controls')).hidden = true;\n    });\n    gatilhos.forEach(g => g.addEventListener('click', e => {\n      e.stopPropagation();\n      const aberto = g.getAttribute('aria-expanded') === 'true';\n      fecharTodos(g);\n      g.setAttribute('aria-expanded', String(!aberto));\n      document.getElementById(g.getAttribute('aria-controls')).hidden = aberto;\n    }));\n    document.addEventListener('click', e => { if (!alvo.contains(e.target)) fecharTodos(); });\n    document.addEventListener('keydown', e => {\n      if (e.key !== 'Escape') return;\n      const aberto = alvo.querySelector('.menu-gatilho[aria-expanded=\"true\"]');\n      fecharTodos();\n      if (aberto) aberto.focus();\n    });\n    alvo.querySelectorAll('.menu-suspenso a').forEach(a => a.addEventListener('click', () => {\n      fecharTodos();\n      alvo.querySelector('.nav-menus').classList.remove('aberto');\n      alvo.querySelector('.btn-menu').setAttribute('aria-expanded', 'false');\n    }));\n\n    // Menu móvel\n    const btnMenu = alvo.querySelector('.btn-menu');\n    btnMenu.addEventListener('click', () => {\n      const aberto = btnMenu.getAttribute('aria-expanded') === 'true';\n      btnMenu.setAttribute('aria-expanded', String(!aberto));\n      btnMenu.setAttribute('aria-label', aberto ? 'Abrir menu' : 'Fechar menu');\n      alvo.querySelector('.nav-menus').classList.toggle('aberto', !aberto);\n    });\n\n    alvo.querySelectorAll('[data-sair]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); sair(); }));\n    atualizarContadorCarrinho();\n  }\n\n  function atualizarContadorCarrinho() {\n    const n = itensCarrinho();\n    document.querySelectorAll('[data-contador-carrinho]').forEach(el => { el.textContent = n; el.hidden = n === 0; });\n  }\n\n  function rodape() {\n    const alvo = document.getElementById('rodape');\n    if (!alvo) return;\n    alvo.className = 'rodape';\n    alvo.innerHTML = `\n      <div class=\"container\">\n        <div class=\"rodape-grade\">\n          <div class=\"rodape-sobre\">\n            <a href=\"index.html\" class=\"marca\" aria-label=\"NORDEN — página inicial\">\n              <span class=\"marca-nome\">NORDEN<\/span>\n              <span class=\"marca-sub\">Salão masculino premium<\/span>\n            <\/a>\n            <p>Salão inteligente masculino: agendamento, histórico, cuidados e loja em um só lugar.<\/p>\n          <\/div>\n          <div><h4>O Salão<\/h4><ul>\n            <li><a href=\"servicos.html\">Serviços<\/a><\/li><li><a href=\"profissionais.html\">Profissionais<\/a><\/li>\n            <li><a href=\"index.html#como-funciona\">Como funciona<\/a><\/li><li><a href=\"contato.html\">Contato e dúvidas<\/a><\/li><\/ul><\/div>\n          <div><h4>Loja<\/h4><ul>\n            <li><a href=\"loja.html\">Produtos<\/a><\/li><li><a href=\"carrinho.html\">Carrinho<\/a><\/li>\n            <li><a href=\"agendar.html\">Agendar<\/a><\/li><li><a href=\"login.html\">Entrar<\/a><\/li><\/ul><\/div>\n          <div><h4>Demonstração<\/h4><ul>\n            <li><a href=\"index.html#privacidade\">Privacidade<\/a><\/li>\n            <li><a href=\"#\" data-redefinir>Redefinir dados de demonstração<\/a><\/li><\/ul><\/div>\n        <\/div>\n        <div class=\"rodape-base\">\n          <span>© ${new Date().getFullYear()} NORDEN — projeto acadêmico em desenvolvimento.<\/span>\n          <span>Wordmark provisório · dados fictícios salvos apenas neste navegador.<\/span>\n        <\/div>\n      <\/div>`;\n    alvo.querySelector('[data-redefinir]').addEventListener('click', e => {\n      e.preventDefault();\n      confirmarAcao('Redefinir demonstração', 'Apagar agendamentos, pedidos e alterações feitas nesta demonstração e voltar aos dados iniciais?', 'Redefinir', () => {\n        redefinir();\n        location.reload();\n      });\n    });\n  }\n\n  // ===================== MODAL ACESSÍVEL (sem confirm() nativo) =====================\n  // acoes: [{ texto, classe, aoClicar(fechar, dlg) }]\n  function modal({ titulo, corpo, acoes = [], aoAbrir }) {\n    const dlg = document.createElement('dialog');\n    dlg.className = 'modal';\n    dlg.setAttribute('aria-labelledby', 'modal-titulo');\n    dlg.innerHTML = `\n      <div class=\"modal-cabeca\">\n        <h2 id=\"modal-titulo\">${titulo}<\/h2>\n        <button type=\"button\" class=\"modal-fechar\" aria-label=\"Fechar\">×<\/button>\n      <\/div>\n      <div class=\"modal-corpo\">${corpo}<\/div>\n      <div class=\"modal-acoes\"><\/div>`;\n    const fechar = () => { dlg.close(); dlg.remove(); };\n    dlg.querySelector('.modal-fechar').addEventListener('click', fechar);\n    dlg.addEventListener('cancel', e => { e.preventDefault(); fechar(); });\n    const areaAcoes = dlg.querySelector('.modal-acoes');\n    acoes.forEach(a => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.className = 'btn ' + (a.classe || 'btn-escuro');\n      b.textContent = a.texto;\n      b.addEventListener('click', () => a.aoClicar ? a.aoClicar(fechar, dlg) : fechar());\n      areaAcoes.appendChild(b);\n    });\n    document.body.appendChild(dlg);\n    dlg.showModal();\n    if (aoAbrir) aoAbrir(dlg, fechar);\n    return { dlg, fechar };\n  }\n\n  function confirmarAcao(titulo, texto, rotuloConfirmar, aoConfirmar) {\n    modal({\n      titulo, corpo: `<p>${texto}<\/p>`,\n      acoes: [\n        { texto: 'Voltar', classe: 'btn-contorno-escuro' },\n        { texto: rotuloConfirmar, classe: 'btn-perigo', aoClicar: fechar => { fechar(); aoConfirmar(); } }\n      ]\n    });\n  }\n\n  // ============================== LOGO ==============================\n  // Símbolo NORDEN (vetor redesenhado a partir de img/logo-norden.jpg)\n  const SIMBOLO_SVG = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 120\" aria-hidden=\"true\" focusable=\"false\"><defs><linearGradient id=\"nb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#E2C29C\"/><stop offset=\".45\" stop-color=\"#B9895C\"/><stop offset=\"1\" stop-color=\"#8E6B47\"/><\/linearGradient><\/defs><polygon fill=\"url(#nb)\" points=\"50,2 63,34 55,30 50,42 45,30 37,34\"/><g fill=\"none\" stroke=\"url(#nb)\" stroke-width=\"4.4\" stroke-linejoin=\"miter\"><path d=\"M34 48 L8 100 L29 83\"/><path d=\"M66 48 L92 100 L71 83\"/><path d=\"M22 22 L63.5 92\"/><path d=\"M78 22 L36.5 92\"/><circle cx=\"32\" cy=\"100.5\" r=\"7.2\" stroke-width=\"3.8\"/><circle cx=\"68\" cy=\"100.5\" r=\"7.2\" stroke-width=\"3.8\"/><path d=\"M26 105.5 Q23.5 113 15.5 114\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M74 105.5 Q76.5 113 84.5 114\" stroke-width=\"3\" stroke-linecap=\"round\"/><\/g><circle cx=\"50\" cy=\"68.6\" r=\"1.7\" fill=\"#0B0B0D\"/><\/svg>';\n\n  // Cada cópia recebe um id de gradiente próprio (um gradiente dentro de elemento oculto não pinta as demais)\n  let contadorLogo = 0;\n  const simbolo = () => { const id = 'nb' + (++contadorLogo); return SIMBOLO_SVG.replace('id=\"nb\"', `id=\"${id}\"`).replaceAll('url(#nb)', `url(#${id})`); };\n\n  function aplicarLogo() {\n    // Ao lado do nome em todas as marcas (cabeçalho, rodapé, login, cadastro)\n    document.querySelectorAll('.marca').forEach(m => {\n      if (m.querySelector('.marca-simbolo')) return;\n      m.insertAdjacentHTML('afterbegin', '<span class=\"marca-simbolo\">' + simbolo() + '<\/span>');\n    });\n    // Versões grandes marcadas com data-logo\n    document.querySelectorAll('[data-logo]').forEach(el => { if (!el.innerHTML.trim()) el.innerHTML = simbolo(); });\n    // Ícone da aba\n    if (!document.querySelector('link[rel=\"icon\"]')) {\n      const icone = document.createElement('link');\n      icone.rel = 'icon';\n      icone.type = 'image/svg+xml';\n      icone.href = 'data:image/svg+xml,' + encodeURIComponent(SIMBOLO_SVG);\n      document.head.appendChild(icone);\n    }\n  }\n\n  // Selo de status acessível (texto + cor, nunca só cor)\n  const selo = (status, mapa) => `<span class=\"selo selo-${status.toLowerCase()}\">${(mapa || STATUS_RESERVA)[status] || status}<\/span>`;\n\n  document.addEventListener('DOMContentLoaded', () => { carregar(); cabecalho(); rodape(); aplicarLogo(); });\n\n  return {\n    SERVICOS, PROFISSIONAIS, PRODUTOS, MANUAIS_PADRAO, CONFIG, STATUS_RESERVA, STATUS_PEDIDO, CLIENTE_DEMO, GESTOR_DEMO, ATIVAS,\n    moeda, hora, duracaoTexto, isoData, paraData, hojeIso, somarDias, dataLonga, dataCurta, agoraMin, uid, codigo, esc,\n    servico, profissional, fechamentoDo, salaoAberto,\n    db: carregar, salvar, redefinir, novaReserva,\n    sessao, entrar, sair, exigir, ir, params, paginaAtual,\n    reservasAtivas, livre, horariosLivres, sugestoesFlow,\n    notificar, naoLidas, adicionarAoCarrinho, itensCarrinho, taxaEntrega, atualizarContadorCarrinho,\n    toast, selo, cabecalho, modal, confirmar: confirmarAcao\n  };\n})();\n", "js/gestao.js": "/* =========================================================\n   NORDEN — Gestão do salão (persona Rafael)\n   Painel, agenda, atendimento, NORDEN Flow, estoque,\n   pedidos, manuais de cuidados e notificações.\n   ========================================================= */\ndocument.addEventListener('DOMContentLoaded', () => {\n  if (!N.exigir('gestor')) return;\n\n  const { PRODUTOS, PROFISSIONAIS, CONFIG, STATUS_PEDIDO, STATUS_RESERVA, moeda, hora, duracaoTexto, dataLonga, dataCurta, hojeIso, somarDias, esc } = N;\n  const db = N.db();\n  const area = document.getElementById('secao');\n  const agora = () => new Date().toISOString();\n\n  const estadoAgenda = { data: hojeIso(), prof: 'todos' };\n\n  // ========================= CONSULTAS =========================\n  const reservasDoDia = (iso, profId) => db.reservas\n    .filter(r => r.data === iso && (!profId || r.profId === profId))\n    .sort((a, b) => a.inicio - b.inicio);\n\n  const ehDemo = r => r.clienteId === N.CLIENTE_DEMO.id;\n  const pedidosAbertos = () => db.pedidos.filter(p => !['CONCLUIDO', 'CANCELADO'].includes(p.status));\n  const estoqueBaixo = () => Object.keys(PRODUTOS).filter(id => (db.estoque[id] || 0) <= CONFIG.estoqueBaixo);\n\n  // Janelas liberadas por cancelamento que ainda estão livres e no futuro\n  function janelas() {\n    const hoje = hojeIso();\n    return db.reservas\n      .filter(r => r.status === 'CANCELADO' && (r.data > hoje || (r.data === hoje && r.inicio > N.agoraMin())))\n      .filter(r => N.livre(r.profId, r.data, r.inicio, r.duracao))\n      // A janela corresponde ao horário cancelado (seção 10.1)\n      .map(r => ({ id: r.id, profId: r.profId, data: r.data, inicio: r.inicio, fim: r.inicio + r.duracao, origem: r }))\n      .sort((a, b) => a.data.localeCompare(b.data) || a.inicio - b.inicio);\n  }\n\n  function ocupacao(iso) {\n    let total = 0, ocupado = 0;\n    PROFISSIONAIS.forEach(p => {\n      if (!p.dias.includes(N.paraData(iso).getDay())) return;\n      total += N.fechamentoDo(iso) - CONFIG.abertura - (CONFIG.almoco[1] - CONFIG.almoco[0]);\n      ocupado += N.reservasAtivas(p.id, iso).reduce((s, r) => s + r.duracao, 0)\n        + db.reservas.filter(r => r.profId === p.id && r.data === iso && r.status === 'CONCLUIDO').reduce((s, r) => s + r.duracao, 0);\n    });\n    return total ? Math.round(ocupado / total * 100) : null;\n  }\n\n  // ========================= COMPONENTES =========================\n  const cabeca = (titulo, sub, extra = '') =>\n    `<header class=\"cartao-cabeca\" style=\"margin:0\"><div><h1 class=\"app-titulo\">${titulo}<\/h1>${sub ? `<p class=\"app-subtitulo\">${sub}<\/p>` : ''}<\/div>${extra}<\/header>`;\n\n  function linhaReserva(r) {\n    return `\n      <li class=\"item-linha\">\n        <div class=\"item-data\"><small>${dataCurta(r.data)}<\/small><strong style=\"font-size:1rem\">${hora(r.inicio)}<\/strong><\/div>\n        <div>\n          <h3>${esc(r.servicoNome)} ${N.selo(r.status)}<\/h3>\n          <p>${esc(r.clienteNome)} · ${esc(N.profissional(r.profId).nome)} · ${duracaoTexto(r.duracao)}<\/p>\n        <\/div>\n        <div class=\"item-acoes\"><button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-abrir=\"${r.id}\">Detalhes<\/button><\/div>\n      <\/li>`;\n  }\n\n  function ligarAbrir() {\n    area.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => detalheReserva(b.dataset.abrir)));\n  }\n\n  // ===================== DETALHE E AÇÕES DA RESERVA =====================\n  function detalheReserva(id) {\n    const r = db.reservas.find(x => x.id === id);\n    const prefs = r.produtosPref.map(p => PRODUTOS[p].nome);\n    // Alerta de alergia: visível apenas no atendimento atribuído (aqui, somente para o cliente demo)\n    const perfil = db.perfil;\n    const alerta = ehDemo(r) ? ({\n      'sim': `<div class=\"aviso-caixa erro\"><strong>Alerta de sensibilidade:<\/strong> ${esc(perfil.alergiaDetalhe)}<\/div>`,\n      'nao': '<p class=\"texto-suave\">Cliente informou não ter alergias conhecidas.<\/p>',\n      'nao-sei': '<div class=\"aviso-caixa\"><strong>Atenção:<\/strong> cliente não sabe se tem alergias. Confirme antes de aplicar produtos.<\/div>',\n      'informar-profissional': '<div class=\"aviso-caixa\"><strong>Atenção:<\/strong> cliente prefere informar alergias pessoalmente. Pergunte antes do atendimento.<\/div>',\n      'nao-informado': '<div class=\"aviso-caixa\"><strong>Sem informação de alergias.<\/strong> Ausência de informação não significa ausência de alergia.<\/div>'\n    })[perfil.alergia] : '<p class=\"texto-suave\">Cliente fictício: sem dados de saúde na demonstração.<\/p>';\n\n    const acoes = [{ texto: 'Fechar', classe: 'btn-contorno-escuro' }];\n    if (r.status === 'CONFIRMADO') {\n      acoes.push({ texto: 'Cancelar reserva', classe: 'btn-perigo', aoClicar: f => { f(); cancelarReserva(r); } });\n      acoes.push({ texto: 'Não compareceu', classe: 'btn-contorno-escuro', aoClicar: f => { f(); mudarStatus(r, 'NAO_COMPARECEU', 'Marcado como não compareceu'); } });\n      acoes.push({ texto: 'Iniciar atendimento', aoClicar: f => { f(); mudarStatus(r, 'EM_ATENDIMENTO', 'Atendimento iniciado'); detalheReserva(r.id); } });\n    }\n    if (r.status === 'EM_ATENDIMENTO') acoes.push({ texto: 'Concluir atendimento', aoClicar: f => { f(); concluir(r); } });\n\n    N.modal({\n      titulo: esc(r.servicoNome),\n      corpo: `\n        <dl class=\"revisao\">\n          <div><dt>Status<\/dt><dd>${N.selo(r.status)}<\/dd><\/div>\n          <div><dt>Cliente<\/dt><dd>${esc(r.clienteNome)}<\/dd><\/div>\n          <div><dt>Profissional<\/dt><dd>${esc(N.profissional(r.profId).nome)}<\/dd><\/div>\n          <div><dt>Data<\/dt><dd>${dataLonga(r.data)}<\/dd><\/div>\n          <div><dt>Horário<\/dt><dd>${hora(r.inicio)} – ${hora(r.inicio + r.duracao)}<\/dd><\/div>\n          <div><dt>Valor<\/dt><dd>${moeda(r.preco)}<\/dd><\/div>\n          <div><dt>Código<\/dt><dd>${r.codigo}<\/dd><\/div>\n        <\/dl>\n        ${alerta}\n        ${prefs.length ? `<p><strong>Produtos de preferência:<\/strong> ${esc(prefs.join(', '))} <small class=\"texto-suave\">(verifique se são adequados)<\/small><\/p>` : ''}\n        ${r.obs ? `<p><strong>Observação do cliente:<\/strong> ${esc(r.obs)}<\/p>` : ''}\n        ${r.produtosUsados.length ? `<p><strong>Produtos usados:<\/strong> ${r.produtosUsados.map(p => `${p.qtd}× ${esc(PRODUTOS[p.id].nome)}`).join(', ')}<\/p>` : ''}\n        <details><summary style=\"cursor:pointer;font-weight:600\">Histórico<\/summary>\n          <ul style=\"margin-top:.5rem;display:grid;gap:.3rem\">${r.historico.map(h => `<li class=\"texto-suave\">${new Date(h.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} — ${esc(h.texto)}<\/li>`).join('')}<\/ul>\n        <\/details>\n        ${r.status === 'CONFIRMADO' && r.data > hojeIso() ? '<p class=\"texto-suave\">Demonstração: o início antecipado é permitido para testar o fluxo. Em produção, apenas no dia do atendimento.<\/p>' : ''}`,\n      acoes\n    });\n  }\n\n  function mudarStatus(r, status, texto) {\n    r.status = status;\n    r.historico.push({ em: agora(), texto });\n    N.salvar();\n    N.toast(texto + '.');\n    roteador.navegar();\n  }\n\n  function cancelarReserva(r) {\n    N.confirmar('Cancelar reserva', `Cancelar ${esc(r.servicoNome)} de ${esc(r.clienteNome)} em ${dataCurta(r.data)} às ${hora(r.inicio)}? O NORDEN Flow vai sugerir clientes para ocupar a janela.`, 'Cancelar reserva', () => {\n      r.status = 'CANCELADO';\n      r.historico.push({ em: agora(), texto: 'Cancelado pela gestão' });\n      db.ofertas.filter(o => o.reservaId === r.id && o.status === 'PENDENTE').forEach(o => { o.status = 'EXPIRADA'; });\n      if (ehDemo(r)) N.notificar('cliente', `Sua reserva ${r.codigo} (${r.servicoNome}, ${dataCurta(r.data)}) foi cancelada pelo salão.`, 'cliente.html#agendamentos');\n      N.salvar();\n      N.toast('Reserva cancelada. <a href=\"gestao.html#flow\">Ver sugestões de encaixe<\/a>');\n      roteador.navegar();\n    });\n  }\n\n  // Conclusão: produtos efetivamente usados + manual revisado\n  function concluir(r) {\n    const s = N.servico(r.servicoId);\n    const ordenados = [...s.produtos, ...Object.keys(PRODUTOS).filter(id => !s.produtos.includes(id))];\n    const manual = db.manuais[r.servicoId];\n    N.modal({\n      titulo: 'Concluir atendimento',\n      corpo: `\n        <p class=\"texto-suave\">${esc(r.servicoNome)} · ${esc(r.clienteNome)}<\/p>\n        <fieldset style=\"border:0;padding:0;margin:0;display:grid;gap:.5rem\">\n          <legend style=\"font-weight:600;margin-bottom:.5rem\">Produtos efetivamente usados<\/legend>\n          ${ordenados.map(id => `\n            <div class=\"item-linha\" style=\"grid-template-columns:auto 1fr auto;padding:.6rem .8rem\">\n              <input type=\"checkbox\" id=\"usado-${id}\" value=\"${id}\" ${r.produtosPref.includes(id) ? 'checked' : ''} style=\"width:20px;height:20px;accent-color:var(--onix)\">\n              <label for=\"usado-${id}\">${esc(PRODUTOS[id].nome)}${s.produtos.includes(id) ? '' : ' <small class=\"texto-suave\">(fora do padrão do serviço)<\/small>'}<br><small class=\"texto-suave\">Estoque: ${db.estoque[id]}<\/small><\/label>\n              <input type=\"number\" min=\"1\" max=\"${Math.max(1, db.estoque[id])}\" value=\"1\" id=\"qtd-${id}\" aria-label=\"Quantidade de ${esc(PRODUTOS[id].nome)}\" style=\"width:64px;min-height:38px;padding:.3rem;border:1px solid var(--borda-campo);border-radius:4px\">\n            <\/div>`).join('')}\n        <\/fieldset>\n        <div class=\"campo\">\n          <label for=\"manual-titulo\">Título do manual de cuidados<\/label>\n          <input id=\"manual-titulo\" value=\"${esc(manual.titulo)}\">\n        <\/div>\n        <div class=\"campo\">\n          <label for=\"manual-itens\">Orientações (uma por linha) — revise antes de publicar<\/label>\n          <textarea id=\"manual-itens\" rows=\"5\">${esc(manual.itens.join('\\n'))}<\/textarea>\n        <\/div>\n        <p class=\"campo-erro\" id=\"concluir-erro\" role=\"alert\"><\/p>`,\n      acoes: [\n        { texto: 'Voltar', classe: 'btn-contorno-escuro' },\n        { texto: 'Concluir e publicar', aoClicar: (fechar, dlg) => {\n          const usados = ordenados.filter(id => dlg.querySelector('#usado-' + id).checked)\n            .map(id => ({ id, qtd: Math.max(1, parseInt(dlg.querySelector('#qtd-' + id).value, 10) || 1) }));\n          const semEstoque = usados.filter(u => u.qtd > (db.estoque[u.id] || 0));\n          const itens = dlg.querySelector('#manual-itens').value.split('\\n').map(l => l.trim()).filter(Boolean);\n          const erro = dlg.querySelector('#concluir-erro');\n          if (semEstoque.length) { erro.textContent = 'Estoque insuficiente: ' + semEstoque.map(u => PRODUTOS[u.id].nome).join(', ') + '. Ajuste o estoque ou a quantidade.'; return; }\n          if (!itens.length) { erro.textContent = 'Inclua ao menos uma orientação de cuidado.'; return; }\n\n          usados.forEach(u => { db.estoque[u.id] -= u.qtd; });\n          r.produtosUsados = usados;\n          r.cuidados = { titulo: dlg.querySelector('#manual-titulo').value.trim() || manual.titulo, itens };\n          r.status = 'CONCLUIDO';\n          r.historico.push({ em: agora(), texto: `Atendimento concluído (${usados.length} produto(s) registrados)` });\n          if (ehDemo(r)) N.notificar('cliente', `Seu atendimento de ${r.servicoNome} foi concluído. O manual de cuidados já está na sua jornada.`, 'cliente.html#cuidados/' + r.id);\n          N.salvar();\n          fechar();\n          N.toast('Atendimento concluído e publicado na jornada do cliente.');\n          roteador.navegar();\n        } }\n      ]\n    });\n  }\n\n  // ============================ SEÇÕES ============================\n  function painel() {\n    const hoje = hojeIso();\n    const doDia = reservasDoDia(hoje).filter(r => r.status !== 'CANCELADO');\n    const canc7 = db.reservas.filter(r => r.status === 'CANCELADO' && r.data >= hoje && r.data <= somarDias(hoje, 7)).length;\n    const avals = db.reservas.filter(r => r.avaliacao).map(r => r.avaliacao.nota);\n    const media = avals.length ? (avals.reduce((a, b) => a + b, 0) / avals.length).toFixed(1) : '—';\n    const occ = ocupacao(hoje);\n    const js = janelas();\n    const baixo = estoqueBaixo();\n\n    area.innerHTML = `\n      ${cabeca('Painel', `${dataLonga(hoje)} · ${N.GESTOR_DEMO.nome}`)}\n      <div class=\"grade-4\">\n        <div class=\"indicador\"><span>Atendimentos hoje<\/span><strong>${doDia.length}<\/strong><small>${doDia.filter(r => r.status === 'CONCLUIDO').length} concluídos<\/small><\/div>\n        <div class=\"indicador\"><span>Ocupação hoje<\/span><strong>${occ === null ? '—' : occ + '%'}<\/strong><small>${occ === null ? 'Salão fechado' : 'da capacidade da equipe'}<\/small><\/div>\n        <div class=\"indicador\"><span>Cancelamentos (7 dias)<\/span><strong>${canc7}<\/strong><small>${js.length} janela(s) para encaixe<\/small><\/div>\n        <div class=\"indicador\"><span>Pedidos abertos<\/span><strong>${pedidosAbertos().length}<\/strong><small>Avaliação média: ${media}<\/small><\/div>\n      <\/div>\n      ${js.length ? `<div class=\"aviso-caixa\"><strong>NORDEN Flow:<\/strong> ${js.length} horário(s) liberado(s) por cancelamento com clientes que podem antecipar. <a href=\"#flow\" class=\"link-acao\">Ver sugestões<\/a><\/div>` : ''}\n      ${baixo.length ? `<div class=\"aviso-caixa erro\"><strong>Estoque baixo:<\/strong> ${baixo.map(id => `${esc(PRODUTOS[id].nome)} (${db.estoque[id]})`).join(', ')}. <a href=\"#estoque\" class=\"link-acao\">Ajustar<\/a><\/div>` : ''}\n      <div class=\"cartao\">\n        <div class=\"cartao-cabeca\"><h2>Atendimentos de hoje<\/h2><a href=\"#agenda\">Abrir agenda<\/a><\/div>\n        ${doDia.length ? `<ul class=\"lista-itens\">${doDia.map(linhaReserva).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhum atendimento hoje.<\/div>'}\n      <\/div>`;\n    ligarAbrir();\n  }\n\n  function agenda() {\n    const iso = estadoAgenda.data;\n    const profs = PROFISSIONAIS.filter(p => estadoAgenda.prof === 'todos' || p.id === estadoAgenda.prof);\n    area.innerHTML = `\n      ${cabeca('Agenda', dataLonga(iso) + (N.salaoAberto(iso) ? '' : ' · salão fechado'))}\n      <div class=\"barra-filtros\">\n        <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" id=\"dia-anterior\" aria-label=\"Dia anterior\">←<\/button>\n        <div class=\"campo\"><label for=\"ag-data\">Data<\/label><input type=\"date\" id=\"ag-data\" value=\"${iso}\"><\/div>\n        <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" id=\"dia-seguinte\" aria-label=\"Dia seguinte\">→<\/button>\n        <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" id=\"dia-hoje\">Hoje<\/button>\n        <div class=\"campo\"><label for=\"ag-prof\">Profissional<\/label>\n          <select id=\"ag-prof\"><option value=\"todos\">Todos<\/option>${PROFISSIONAIS.map(p => `<option value=\"${p.id}\" ${estadoAgenda.prof === p.id ? 'selected' : ''}>${esc(p.nome)}<\/option>`).join('')}<\/select><\/div>\n      <\/div>\n      <p class=\"texto-suave\">Clique em um atendimento para ver detalhes, iniciar, concluir ou cancelar. Barra bronze = cliente demo (Lucas M.).<\/p>\n      <div class=\"agenda-dia\" style=\"--colunas:${profs.length}\">\n        ${profs.map(p => {\n          const trabalha = p.dias.includes(N.paraData(iso).getDay());\n          const lista = reservasDoDia(iso, p.id);\n          const ativos = lista.filter(r => r.status !== 'CANCELADO');\n          let almocoInserido = false;\n          const blocos = [];\n          lista.forEach(r => {\n            if (!almocoInserido && r.inicio >= CONFIG.almoco[0]) { blocos.push(`<div class=\"bloco-almoco\">${hora(CONFIG.almoco[0])} – ${hora(CONFIG.almoco[1])} · Almoço<\/div>`); almocoInserido = true; }\n            blocos.push(`\n              <button type=\"button\" class=\"bloco-agenda ${r.status.toLowerCase()}${ehDemo(r) ? ' demo' : ''}\" data-abrir=\"${r.id}\">\n                <strong>${hora(r.inicio)} – ${hora(r.inicio + r.duracao)}<\/strong>\n                <span>${esc(r.servicoNome)}<\/span>\n                <small>${esc(r.clienteNome)} · ${STATUS_RESERVA[r.status]}<\/small>\n              <\/button>`);\n          });\n          if (trabalha && !almocoInserido) blocos.push(`<div class=\"bloco-almoco\">${hora(CONFIG.almoco[0])} – ${hora(CONFIG.almoco[1])} · Almoço<\/div>`);\n          return `\n            <section class=\"agenda-coluna\" aria-label=\"Agenda de ${esc(p.nome)}\">\n              <h3><span>${esc(p.nome)}<\/span><small class=\"texto-suave\">${trabalha ? ativos.length + ' atend.' : 'Folga'}<\/small><\/h3>\n              ${trabalha ? (blocos.join('') || '<p class=\"texto-suave\">Agenda livre.<\/p>') : '<p class=\"texto-suave\">Não atende neste dia.<\/p>'}\n            <\/section>`;\n        }).join('')}\n      <\/div>`;\n\n    const ir = n => { estadoAgenda.data = somarDias(estadoAgenda.data, n); agenda(); };\n    document.getElementById('dia-anterior').addEventListener('click', () => ir(-1));\n    document.getElementById('dia-seguinte').addEventListener('click', () => ir(1));\n    document.getElementById('dia-hoje').addEventListener('click', () => { estadoAgenda.data = hojeIso(); agenda(); });\n    document.getElementById('ag-data').addEventListener('change', e => { if (e.target.value) { estadoAgenda.data = e.target.value; agenda(); } });\n    document.getElementById('ag-prof').addEventListener('change', e => { estadoAgenda.prof = e.target.value; agenda(); });\n    ligarAbrir();\n  }\n\n  function flow() {\n    const js = janelas();\n    const enviadas = db.ofertas.slice().reverse();\n    area.innerHTML = `\n      ${cabeca('NORDEN Flow', 'Quando um horário é cancelado, o sistema sugere reservas futuras compatíveis com a duração e o profissional. Nada muda sem a confirmação do cliente.')}\n      <div class=\"aviso-caixa\">Para testar: abra a <a href=\"#agenda\" class=\"link-acao\">Agenda<\/a>, cancele um atendimento anterior ao horário do cliente demo (Lucas M.) e volte aqui.<\/div>\n      ${js.length ? js.map(j => {\n        const sugestoes = N.sugestoesFlow(j, Infinity);\n        const itemSugestao = sg => {\n          const r = sg.reserva;\n          const pendente = db.ofertas.some(o => o.reservaId === r.id && o.status === 'PENDENTE');\n          return `\n            <li class=\"item-linha\">\n              <div class=\"item-data\"><small>${dataCurta(r.data)}<\/small><strong style=\"font-size:1rem\">${hora(r.inicio)}<\/strong><\/div>\n              <div>\n                <h3>${esc(r.clienteNome)}${ehDemo(r) ? ' <span class=\"selo selo-pendente\">Cliente demo<\/span>' : ''}<\/h3>\n                <p>${esc(r.servicoNome)} · ${duracaoTexto(r.duracao)} · atual: ${dataCurta(r.data)} ${hora(r.inicio)} com ${esc(N.profissional(r.profId).nome)} → proposto: ${dataCurta(j.data)} ${hora(j.inicio)}<\/p>\n                <p><small>Motivo: ${sg.motivo}<\/small><\/p>\n              <\/div>\n              <div class=\"item-acoes\"><button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-ofertar=\"${r.id}\" data-janela=\"${j.id}\" ${pendente ? 'disabled' : ''}>${pendente ? 'Oferta enviada' : 'Enviar oferta'}<\/button><\/div>\n            <\/li>`;\n        };\n        return `\n          <article class=\"cartao\">\n            <div class=\"cartao-cabeca\">\n              <h2>Janela livre · ${dataCurta(j.data)} · ${hora(j.inicio)} – ${hora(j.fim)}<\/h2>\n              <span class=\"texto-suave\">${esc(N.profissional(j.profId).nome)} · ${duracaoTexto(j.fim - j.inicio)} livres<\/span>\n            <\/div>\n            <p class=\"texto-suave\" style=\"margin-bottom:1rem\">Liberada pelo cancelamento de ${esc(j.origem.servicoNome)} (${esc(j.origem.clienteNome)}). ${sugestoes.length} reserva(s) elegível(is).<\/p>\n            ${sugestoes.length ? `<ul class=\"lista-itens\">${sugestoes.slice(0, 5).map(itemSugestao).join('')}<\/ul>\n              ${sugestoes.length > 5 ? `<details style=\"margin-top:.75rem\"><summary style=\"cursor:pointer;font-weight:600\">Ver mais ${sugestoes.length - 5} sugestões<\/summary>\n                <ul class=\"lista-itens\" style=\"margin-top:.75rem\">${sugestoes.slice(5).map(itemSugestao).join('')}<\/ul><\/details>` : ''}`\n              : '<div class=\"estado-vazio\">Nenhuma reserva compatível para antecipar.<\/div>'}\n          <\/article>`;\n      }).join('') : '<div class=\"estado-vazio\">Nenhuma janela liberada por cancelamento no momento.<\/div>'}\n\n      <div class=\"cartao\">\n        <h2>Ofertas enviadas<\/h2>\n        ${enviadas.length ? `<ul class=\"lista-itens\" style=\"margin-top:1rem\">${enviadas.map(o => {\n          const r = db.reservas.find(x => x.id === o.reservaId);\n          return `\n            <li class=\"item-linha\" style=\"grid-template-columns:1fr auto\">\n              <div><h3>${esc(r.clienteNome)} · ${esc(r.servicoNome)} ${N.selo(o.status, { PENDENTE: 'Aguardando cliente', ACEITA: 'Aceita', RECUSADA: 'Recusada', EXPIRADA: 'Expirada' })}<\/h3>\n              <p>De ${dataCurta(o.dataOriginal)} ${hora(o.inicioOriginal)} para ${dataCurta(o.novaData)} ${hora(o.novoInicio)} · ${esc(N.profissional(o.profId).nome)}<\/p><\/div>\n              <div class=\"item-acoes\">${o.status === 'PENDENTE' && !ehDemo(r) ? `\n                <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-simular=\"${o.id}\" data-resp=\"nao\">Simular recusa<\/button>\n                <button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-simular=\"${o.id}\" data-resp=\"sim\">Simular aceite<\/button>`\n                : o.status === 'PENDENTE' ? '<small class=\"texto-suave\">Responda como cliente em Minha conta → Ofertas<\/small>' : ''}<\/div>\n            <\/li>`;\n        }).join('')}<\/ul>` : '<p class=\"texto-suave\" style=\"margin-top:.5rem\">Nenhuma oferta enviada.<\/p>'}\n      <\/div>`;\n\n    area.querySelectorAll('[data-ofertar]').forEach(b => b.addEventListener('click', () => {\n      const r = db.reservas.find(x => x.id === b.dataset.ofertar);\n      const j = janelas().find(x => x.id === b.dataset.janela);\n      if (!j || !N.livre(j.profId, j.data, j.inicio, r.duracao, r.id)) { N.toast('A janela não está mais disponível.'); return flow(); }\n      db.ofertas.push({\n        id: N.uid('o'), janelaId: j.id, reservaId: r.id, clienteId: r.clienteId, profId: j.profId,\n        novaData: j.data, novoInicio: j.inicio, dataOriginal: r.data, inicioOriginal: r.inicio, status: 'PENDENTE', criadoEm: agora()\n      });\n      if (ehDemo(r)) N.notificar('cliente', `NORDEN Flow: um horário mais cedo ficou livre (${dataCurta(j.data)} às ${hora(j.inicio)}). Quer antecipar?`, 'cliente.html#ofertas');\n      N.salvar();\n      N.toast('Oferta enviada. A reserva só muda se o cliente aceitar.');\n      flow();\n    }));\n\n    // Clientes fictícios não têm conta: a gestão simula a resposta para demonstrar o fluxo\n    area.querySelectorAll('[data-simular]').forEach(b => b.addEventListener('click', () => {\n      const o = db.ofertas.find(x => x.id === b.dataset.simular);\n      const r = db.reservas.find(x => x.id === o.reservaId);\n      if (b.dataset.resp === 'nao') { o.status = 'RECUSADA'; }\n      else if (!N.livre(o.profId, o.novaData, o.novoInicio, r.duracao, r.id)) { o.status = 'EXPIRADA'; N.toast('A janela não está mais livre.'); }\n      else {\n        r.data = o.novaData; r.inicio = o.novoInicio; r.profId = o.profId;\n        r.historico.push({ em: agora(), texto: `Antecipado pelo NORDEN Flow para ${dataCurta(o.novaData)} ${hora(o.novoInicio)}` });\n        o.status = 'ACEITA';\n        db.ofertas.filter(x => x.janelaId === o.janelaId && x.id !== o.id && x.status === 'PENDENTE').forEach(x => { x.status = 'EXPIRADA'; });\n      }\n      N.salvar();\n      flow();\n    }));\n  }\n\n  function estoque() {\n    area.innerHTML = `\n      ${cabeca('Produtos e estoque', `Alerta de estoque baixo a partir de ${CONFIG.estoqueBaixo} unidades.`)}\n      <div class=\"tabela-wrap\">\n        <table class=\"tabela tabela-cartoes\">\n          <caption class=\"sr-only\">Estoque de produtos<\/caption>\n          <thead><tr><th scope=\"col\">Produto<\/th><th scope=\"col\">Categoria<\/th><th scope=\"col\">Preço<\/th><th scope=\"col\">Estoque<\/th><th scope=\"col\">Ajustar<\/th><\/tr><\/thead>\n          <tbody>${Object.keys(PRODUTOS).map(id => {\n            const q = db.estoque[id] || 0;\n            return `\n              <tr>\n                <td data-rotulo=\"Produto\"><strong>${esc(PRODUTOS[id].nome)}<\/strong><\/td>\n                <td data-rotulo=\"Categoria\">${PRODUTOS[id].categoria}<\/td>\n                <td data-rotulo=\"Preço\">${moeda(PRODUTOS[id].preco)}<\/td>\n                <td data-rotulo=\"Estoque\">${q} ${q === 0 ? '<span class=\"selo selo-cancelado\">Esgotado<\/span>' : q <= CONFIG.estoqueBaixo ? '<span class=\"selo selo-em_separacao\">Baixo<\/span>' : ''}<\/td>\n                <td data-rotulo=\"Ajustar\">\n                  <div class=\"qtd-controle\" role=\"group\" aria-label=\"Ajustar estoque de ${esc(PRODUTOS[id].nome)}\">\n                    <button type=\"button\" data-ajuste=\"${id}\" data-delta=\"-1\" aria-label=\"Remover uma unidade\">−<\/button>\n                    <span>${q}<\/span>\n                    <button type=\"button\" data-ajuste=\"${id}\" data-delta=\"1\" aria-label=\"Adicionar uma unidade\">+<\/button>\n                  <\/div>\n                  <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-ajuste=\"${id}\" data-delta=\"10\">+10<\/button>\n                <\/td>\n              <\/tr>`;\n          }).join('')}<\/tbody>\n        <\/table>\n      <\/div>\n      <p class=\"texto-suave\">O estoque é reduzido ao concluir atendimentos (produtos usados) e ao receber pedidos da loja; cancelamentos de pedidos devolvem as unidades.<\/p>`;\n    area.querySelectorAll('[data-ajuste]').forEach(b => b.addEventListener('click', () => {\n      const id = b.dataset.ajuste;\n      db.estoque[id] = Math.max(0, (db.estoque[id] || 0) + Number(b.dataset.delta));\n      N.salvar();\n      estoque();\n    }));\n  }\n\n  function pedidos() {\n    const proximo = p => ({\n      RECEBIDO: [['EM_SEPARACAO', 'Iniciar separação']],\n      EM_SEPARACAO: [[p.modalidade === 'entrega' ? 'SAIU_ENTREGA' : 'PRONTO_RETIRADA', p.modalidade === 'entrega' ? 'Saiu para entrega' : 'Pronto para retirada']],\n      PRONTO_RETIRADA: [['CONCLUIDO', 'Marcar como retirado']],\n      SAIU_ENTREGA: [['CONCLUIDO', 'Marcar como entregue']]\n    })[p.status] || [];\n    area.innerHTML = `\n      ${cabeca('Pedidos da loja', 'Atualize o status para o cliente acompanhar.')}\n      ${db.pedidos.length ? `<ul class=\"lista-itens\">${db.pedidos.map(p => `\n        <li class=\"item-linha\" style=\"grid-template-columns:1fr auto\">\n          <div>\n            <h3>${p.codigo} ${N.selo(p.status, STATUS_PEDIDO)}<\/h3>\n            <p>${esc(p.clienteNome)} · ${p.itens.map(i => `${i.qtd}× ${esc(PRODUTOS[i.id].nome)}`).join(', ')}<\/p>\n            <p>${p.modalidade === 'entrega' ? `Entrega: ${esc(p.endereco)} (${p.km} km)` : 'Retirada no salão'} · Total ${moeda(p.total)}<\/p>\n          <\/div>\n          <div class=\"item-acoes\">\n            ${proximo(p).map(([st, txt]) => `<button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-pedido=\"${p.id}\" data-status=\"${st}\">${txt}<\/button>`).join('')}\n            ${['RECEBIDO', 'EM_SEPARACAO'].includes(p.status) ? `<button type=\"button\" class=\"btn btn-perigo btn-pequeno\" data-cancelar-pedido=\"${p.id}\">Cancelar<\/button>` : ''}\n          <\/div>\n        <\/li>`).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhum pedido ainda. Os pedidos feitos na loja aparecem aqui.<\/div>'}`;\n\n    area.querySelectorAll('[data-pedido]').forEach(b => b.addEventListener('click', () => {\n      const p = db.pedidos.find(x => x.id === b.dataset.pedido);\n      p.status = b.dataset.status;\n      p.historico.push({ em: agora(), texto: STATUS_PEDIDO[p.status] });\n      N.notificar('cliente', `Pedido ${p.codigo}: ${STATUS_PEDIDO[p.status]}.`, 'cliente.html#pedidos');\n      N.salvar();\n      pedidos();\n    }));\n    area.querySelectorAll('[data-cancelar-pedido]').forEach(b => b.addEventListener('click', () => {\n      const p = db.pedidos.find(x => x.id === b.dataset.cancelarPedido);\n      N.confirmar('Cancelar pedido', `Cancelar o pedido ${p.codigo}? As unidades voltam ao estoque.`, 'Cancelar pedido', () => {\n        p.status = 'CANCELADO';\n        p.itens.forEach(i => { db.estoque[i.id] += i.qtd; });\n        p.historico.push({ em: agora(), texto: 'Cancelado pela gestão' });\n        N.notificar('cliente', `Pedido ${p.codigo} foi cancelado pelo salão.`, 'cliente.html#pedidos');\n        N.salvar();\n        pedidos();\n      });\n    }));\n  }\n\n  function manuais() {\n    area.innerHTML = `\n      ${cabeca('Manuais de cuidados', 'Biblioteca usada como base ao concluir atendimentos. O profissional revisa antes de publicar para o cliente.')}\n      ${N.SERVICOS.map(s => {\n        const m = db.manuais[s.id];\n        return `\n          <form class=\"cartao form-grade\" data-manual=\"${s.id}\">\n            <h2>${esc(s.nome)}<\/h2>\n            <div class=\"campo\"><label for=\"mt-${s.id}\">Título<\/label><input id=\"mt-${s.id}\" value=\"${esc(m.titulo)}\"><\/div>\n            <div class=\"campo\"><label for=\"mi-${s.id}\">Orientações (uma por linha)<\/label><textarea id=\"mi-${s.id}\" rows=\"4\">${esc(m.itens.join('\\n'))}<\/textarea><\/div>\n            <div class=\"acoes-linha\">\n              <button type=\"submit\" class=\"btn btn-escuro btn-pequeno\">Salvar<\/button>\n              <button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" data-restaurar=\"${s.id}\">Restaurar padrão<\/button>\n            <\/div>\n          <\/form>`;\n      }).join('')}`;\n    area.querySelectorAll('[data-manual]').forEach(f => f.addEventListener('submit', e => {\n      e.preventDefault();\n      const id = f.dataset.manual;\n      const itens = f.querySelector('#mi-' + id).value.split('\\n').map(l => l.trim()).filter(Boolean);\n      if (!itens.length) { N.toast('Inclua ao menos uma orientação.'); return; }\n      db.manuais[id] = { titulo: f.querySelector('#mt-' + id).value.trim() || db.manuais[id].titulo, itens };\n      N.salvar();\n      N.toast('Manual salvo.');\n    }));\n    area.querySelectorAll('[data-restaurar]').forEach(b => b.addEventListener('click', () => {\n      db.manuais[b.dataset.restaurar] = JSON.parse(JSON.stringify(N.MANUAIS_PADRAO[b.dataset.restaurar]));\n      N.salvar();\n      manuais();\n    }));\n  }\n\n  function notificacoes() {\n    const lista = db.notificacoes.filter(n => n.para === 'gestor');\n    area.innerHTML = `\n      ${cabeca('Notificações')}\n      ${lista.some(n => !n.lida) ? '<div class=\"acoes-linha\"><button type=\"button\" class=\"btn btn-contorno-escuro btn-pequeno\" id=\"marcar-lidas\">Marcar todas como lidas<\/button><\/div>' : ''}\n      ${lista.length ? `<ul class=\"lista-itens\">${lista.map(n => `\n        <li class=\"item-linha\" style=\"grid-template-columns:1fr auto${n.lida ? ';opacity:.7' : ''}\">\n          <div><h3 style=\"font-size:.95rem\">${n.lida ? '' : '<span class=\"selo selo-pendente\">Nova<\/span> '}${esc(n.texto)}<\/h3>\n          <p>${new Date(n.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}<\/p><\/div>\n          <div class=\"item-acoes\">${n.link ? `<a href=\"${n.link}\" class=\"btn btn-contorno-escuro btn-pequeno\" data-ler=\"${n.id}\">Abrir<\/a>` : ''}<\/div>\n        <\/li>`).join('')}<\/ul>` : '<div class=\"estado-vazio\">Nenhuma notificação.<\/div>'}`;\n    const marcar = document.getElementById('marcar-lidas');\n    if (marcar) marcar.addEventListener('click', () => { lista.forEach(n => { n.lida = true; }); N.salvar(); roteador.navegar(); });\n    area.querySelectorAll('[data-ler]').forEach(a => a.addEventListener('click', () => {\n      db.notificacoes.find(n => n.id === a.dataset.ler).lida = true;\n      N.salvar();\n    }));\n  }\n\n  // ============================ ROTEADOR ============================\n  const roteador = N.roteador({\n    secoes: [\n      { id: 'painel', titulo: 'Painel', render: painel },\n      { id: 'agenda', titulo: 'Agenda', render: agenda },\n      { id: 'flow', titulo: 'NORDEN Flow', render: flow, contador: () => janelas().length },\n      { id: 'estoque', titulo: 'Produtos e estoque', render: estoque, contador: () => estoqueBaixo().length },\n      { id: 'pedidos', titulo: 'Pedidos da loja', render: pedidos, contador: () => pedidosAbertos().length },\n      { id: 'manuais', titulo: 'Manuais de cuidados', render: manuais },\n      { id: 'notificacoes', titulo: 'Notificações', render: notificacoes, contador: () => N.naoLidas('gestor') }\n    ],\n    padrao: 'painel',\n    aoMudar: (secao, param) => { document.title = secao.titulo + ' — Gestão NORDEN'; secao.render(param); }\n  });\n  roteador.navegar();\n});\n", "js/loja.js": "/* =========================================================\n   NORDEN Store — catálogo, carrinho e checkout (demonstração)\n   Retirada no salão ou entrega com taxa por quilômetro.\n   Nenhum pagamento é processado.\n   ========================================================= */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { PRODUTOS, SERVICOS, CONFIG, moeda, esc } = N;\n  const db = N.db();\n\n  const miniatura = id => `<div class=\"produto-imagem\" aria-hidden=\"true\"><span class=\"produto-frasco${PRODUTOS[id].forma === 'pote' ? ' pote' : ''}\"><\/span><\/div>`;\n\n  // ============================ CATÁLOGO ============================\n  const lista = document.getElementById('lista-produtos-loja');\n  if (lista) {\n    const categorias = ['Todos', ...new Set(Object.values(PRODUTOS).map(p => p.categoria))];\n    const atual = N.params().get('cat') || 'Todos';\n\n    document.getElementById('filtros-loja').innerHTML = categorias.map(c =>\n      `<a class=\"filtro\" href=\"loja.html${c === 'Todos' ? '' : '?cat=' + encodeURIComponent(c)}\"${c === atual ? ' aria-current=\"page\"' : ''}>${c}<\/a>`\n    ).join('');\n\n    const ids = Object.keys(PRODUTOS).filter(id => atual === 'Todos' || PRODUTOS[id].categoria === atual);\n\n    lista.innerHTML = ids.map(id => {\n      const p = PRODUTOS[id];\n      const estoque = db.estoque[id] || 0;\n      const usadoEm = SERVICOS.filter(s => s.produtos.includes(id)).map(s => s.nome);\n      const infoEstoque = estoque === 0 ? 'Indisponível' : estoque <= CONFIG.estoqueBaixo ? `Últimas ${estoque} unidades` : 'Em estoque';\n      return `\n        <li class=\"produto\">\n          ${miniatura(id)}\n          <div class=\"produto-corpo\">\n            <span class=\"produto-categoria\">${p.categoria}<\/span>\n            <h2 style=\"font-size:1rem\">${esc(p.nome)}<\/h2>\n            <p>${esc(p.desc)}<\/p>\n            ${usadoEm.length ? `<p><small>Usado em: ${usadoEm.join(', ')}<\/small><\/p>` : ''}\n            <span class=\"produto-preco\">${moeda(p.preco)}<\/span>\n          <\/div>\n          <div class=\"produto-rodape\">\n            <span class=\"estoque-info${estoque > 0 && estoque <= CONFIG.estoqueBaixo ? ' baixo' : ''}\">${infoEstoque}<\/span>\n            <button type=\"button\" class=\"btn btn-escuro btn-pequeno\" data-adicionar=\"${id}\" ${estoque === 0 ? 'disabled' : ''} aria-label=\"Adicionar ${esc(p.nome)} ao carrinho\">Adicionar<\/button>\n          <\/div>\n        <\/li>`;\n    }).join('');\n\n    lista.querySelectorAll('[data-adicionar]').forEach(b =>\n      b.addEventListener('click', () => N.adicionarAoCarrinho(b.dataset.adicionar)));\n  }\n\n  // ============================ CARRINHO ============================\n  const area = document.getElementById('area-carrinho');\n  if (!area) return;\n\n  const checkout = { modalidade: 'retirada', km: null };\n\n  function subtotal() { return db.carrinho.reduce((s, i) => s + PRODUTOS[i.id].preco * i.qtd, 0); }\n  function taxa() { return checkout.modalidade === 'entrega' ? N.taxaEntrega(checkout.km) : 0; }\n\n  function render() {\n    if (!db.carrinho.length) {\n      area.innerHTML = `\n        <div class=\"estado-vazio\">\n          <p>Seu carrinho está vazio.<\/p>\n          <a href=\"loja.html\" class=\"btn btn-escuro\">Ir para a loja<\/a>\n        <\/div>`;\n      return;\n    }\n\n    const logado = N.sessao() === 'cliente';\n    area.innerHTML = `\n      <div class=\"carrinho-layout\">\n        <div style=\"display:grid;gap:2rem\">\n          <section aria-labelledby=\"titulo-itens\">\n            <h2 id=\"titulo-itens\" class=\"app-titulo\" style=\"font-size:1.4rem;margin-bottom:1rem\">Itens<\/h2>\n            <ul class=\"lista-itens\">\n              ${db.carrinho.map(i => `\n                <li class=\"carrinho-item\">\n                  <div class=\"carrinho-miniatura\" aria-hidden=\"true\"><span><\/span><\/div>\n                  <div>\n                    <h3 style=\"font-size:1rem\">${esc(PRODUTOS[i.id].nome)}<\/h3>\n                    <p class=\"texto-suave\">${moeda(PRODUTOS[i.id].preco)} cada · ${db.estoque[i.id]} em estoque<\/p>\n                  <\/div>\n                  <div class=\"carrinho-item-acoes\">\n                    <div class=\"qtd-controle\" role=\"group\" aria-label=\"Quantidade de ${esc(PRODUTOS[i.id].nome)}\">\n                      <button type=\"button\" data-menos=\"${i.id}\" aria-label=\"Diminuir\">−<\/button>\n                      <span aria-live=\"polite\">${i.qtd}<\/span>\n                      <button type=\"button\" data-mais=\"${i.id}\" aria-label=\"Aumentar\">+<\/button>\n                    <\/div>\n                    <strong>${moeda(PRODUTOS[i.id].preco * i.qtd)}<\/strong>\n                    <button type=\"button\" class=\"link-remover\" data-remover=\"${i.id}\">Remover<\/button>\n                  <\/div>\n                <\/li>`).join('')}\n            <\/ul>\n          <\/section>\n\n          <section aria-labelledby=\"titulo-recebimento\" style=\"display:grid;gap:1.25rem\">\n            <h2 id=\"titulo-recebimento\" class=\"app-titulo\" style=\"font-size:1.4rem\">Como deseja receber?<\/h2>\n            <div class=\"modalidades\" role=\"radiogroup\" aria-labelledby=\"titulo-recebimento\">\n              <label class=\"modalidade\"><input type=\"radio\" name=\"modalidade\" value=\"retirada\" ${checkout.modalidade === 'retirada' ? 'checked' : ''}>\n                <span><strong>Retirada no salão<\/strong><small>Sem taxa. Retire no seu próximo atendimento ou quando o pedido estiver pronto.<\/small><\/span><\/label>\n              <label class=\"modalidade\"><input type=\"radio\" name=\"modalidade\" value=\"entrega\" ${checkout.modalidade === 'entrega' ? 'checked' : ''}>\n                <span><strong>Entrega<\/strong><small>${moeda(CONFIG.entrega.base)} + ${moeda(CONFIG.entrega.porKm)} por km · até ${CONFIG.entrega.raioMaxKm} km.<\/small><\/span><\/label>\n            <\/div>\n\n            <form id=\"form-entrega\" class=\"form-grade duas\" novalidate ${checkout.modalidade === 'entrega' ? '' : 'hidden'}>\n              <div class=\"campo\"><label for=\"cep\">CEP<\/label><input id=\"cep\" inputmode=\"numeric\" autocomplete=\"postal-code\" maxlength=\"9\" placeholder=\"00000-000\"><p class=\"campo-erro\" id=\"cep-erro\"><\/p><\/div>\n              <div class=\"campo\"><label for=\"km\">Distância até o salão (km)<\/label><input id=\"km\" type=\"number\" min=\"0.1\" step=\"0.1\" inputmode=\"decimal\" value=\"${checkout.km ?? ''}\"><p class=\"campo-erro\" id=\"km-erro\"><\/p><\/div>\n              <div class=\"campo inteiro\"><label for=\"rua\">Endereço<\/label><input id=\"rua\" autocomplete=\"address-line1\"><p class=\"campo-erro\" id=\"rua-erro\"><\/p><\/div>\n              <div class=\"campo\"><label for=\"numero\">Número<\/label><input id=\"numero\" autocomplete=\"address-line2\"><p class=\"campo-erro\" id=\"numero-erro\"><\/p><\/div>\n              <div class=\"campo\"><label for=\"bairro\">Bairro<\/label><input id=\"bairro\"><p class=\"campo-erro\" id=\"bairro-erro\"><\/p><\/div>\n              <p class=\"texto-suave inteiro\">Demonstração: a distância é informada manualmente. Em produção, ela será calculada por um serviço de mapas.<\/p>\n            <\/form>\n          <\/section>\n        <\/div>\n\n        <aside class=\"resumo-pedido\" aria-labelledby=\"titulo-resumo-pedido\">\n          <h2 id=\"titulo-resumo-pedido\">Resumo do pedido<\/h2>\n          <div class=\"linha\"><span>Subtotal<\/span><span>${moeda(subtotal())}<\/span><\/div>\n          <div class=\"linha\"><span>${checkout.modalidade === 'entrega' ? 'Taxa de entrega' : 'Retirada no salão'}<\/span><span id=\"valor-taxa\">${checkout.modalidade === 'entrega' ? (taxa() === null ? 'Informe a distância' : moeda(taxa())) : 'Grátis'}<\/span><\/div>\n          <div class=\"linha total\"><span>Total<\/span><strong id=\"valor-total\">${moeda(subtotal() + (taxa() || 0))}<\/strong><\/div>\n          <div class=\"form-status\" id=\"status-pedido\" role=\"status\" aria-live=\"polite\"><\/div>\n          ${logado\n            ? '<button type=\"button\" class=\"btn btn-primario btn-bloco\" id=\"btn-finalizar\">Confirmar pedido<\/button>'\n            : '<a href=\"login.html?perfil=cliente&voltar=carrinho.html\" class=\"btn btn-primario btn-bloco\">Entrar para finalizar<\/a>'}\n          <p style=\"font-size:.78rem;color:var(--texto-suave-escuro)\">Pagamento não processado nesta demonstração.<\/p>\n        <\/aside>\n      <\/div>`;\n\n    ligarEventos();\n  }\n\n  function alterarQtd(id, delta) {\n    const item = db.carrinho.find(i => i.id === id);\n    if (!item) return;\n    const nova = item.qtd + delta;\n    if (nova > (db.estoque[id] || 0)) { N.toast('Quantidade máxima disponível em estoque.'); return; }\n    if (nova <= 0) db.carrinho = db.carrinho.filter(i => i.id !== id); else item.qtd = nova;\n    N.salvar(); N.atualizarContadorCarrinho(); render();\n  }\n\n  function ligarEventos() {\n    area.querySelectorAll('[data-mais]').forEach(b => b.addEventListener('click', () => alterarQtd(b.dataset.mais, 1)));\n    area.querySelectorAll('[data-menos]').forEach(b => b.addEventListener('click', () => alterarQtd(b.dataset.menos, -1)));\n    area.querySelectorAll('[data-remover]').forEach(b => b.addEventListener('click', () => alterarQtd(b.dataset.remover, -Infinity)));\n\n    area.querySelectorAll('input[name=\"modalidade\"]').forEach(r => r.addEventListener('change', () => {\n      checkout.modalidade = r.value;\n      render();\n      area.querySelector(`input[value=\"${r.value}\"]`).focus();\n    }));\n\n    const km = document.getElementById('km');\n    if (km) km.addEventListener('input', () => {\n      checkout.km = parseFloat(km.value.replace(',', '.'));\n      const t = taxa();\n      document.getElementById('valor-taxa').textContent = t === null ? (checkout.km > CONFIG.entrega.raioMaxKm ? 'Fora da área' : 'Informe a distância') : moeda(t);\n      document.getElementById('valor-total').textContent = moeda(subtotal() + (t || 0));\n    });\n\n    const cep = document.getElementById('cep');\n    if (cep) cep.addEventListener('input', () => {\n      const d = cep.value.replace(/\\D/g, '').slice(0, 8);\n      cep.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;\n    });\n\n    const btn = document.getElementById('btn-finalizar');\n    if (btn) btn.addEventListener('click', finalizar);\n  }\n\n  function validarEntrega() {\n    const regras = {\n      cep: v => v.replace(/\\D/g, '').length === 8 ? '' : 'Informe um CEP com 8 dígitos.',\n      km: v => {\n        const n = parseFloat(v.replace(',', '.'));\n        if (!(n > 0)) return 'Informe a distância em km.';\n        return n > CONFIG.entrega.raioMaxKm ? `Entregamos até ${CONFIG.entrega.raioMaxKm} km. Escolha retirada no salão.` : '';\n      },\n      rua: v => v.length >= 3 ? '' : 'Informe o endereço.',\n      numero: v => v ? '' : 'Informe o número.',\n      bairro: v => v.length >= 2 ? '' : 'Informe o bairro.'\n    };\n    let primeiro = null;\n    Object.entries(regras).forEach(([id, regra]) => {\n      const campo = document.getElementById(id);\n      const msg = regra(campo.value.trim());\n      document.getElementById(id + '-erro').textContent = msg;\n      campo.setAttribute('aria-invalid', msg ? 'true' : 'false');\n      if (msg && !primeiro) primeiro = campo;\n    });\n    if (primeiro) primeiro.focus();\n    return !primeiro;\n  }\n\n  function finalizar() {\n    const status = document.getElementById('status-pedido');\n    if (checkout.modalidade === 'entrega' && !validarEntrega()) return;\n\n    // Revalida estoque no momento da confirmação\n    const faltando = db.carrinho.filter(i => i.qtd > (db.estoque[i.id] || 0));\n    if (faltando.length) {\n      status.className = 'form-status erro';\n      status.textContent = 'Estoque insuficiente para: ' + faltando.map(i => PRODUTOS[i.id].nome).join(', ') + '.';\n      return;\n    }\n\n    const endereco = checkout.modalidade === 'entrega'\n      ? ['rua', 'numero', 'bairro', 'cep'].map(id => document.getElementById(id).value.trim()).join(', ')\n      : null;\n\n    const pedido = {\n      id: N.uid('p'), codigo: N.codigo(), clienteId: N.CLIENTE_DEMO.id, clienteNome: db.perfil.nome,\n      itens: db.carrinho.map(i => ({ id: i.id, qtd: i.qtd, preco: PRODUTOS[i.id].preco })),\n      modalidade: checkout.modalidade, km: checkout.modalidade === 'entrega' ? checkout.km : null, endereco,\n      subtotal: subtotal(), taxa: taxa() || 0, total: subtotal() + (taxa() || 0),\n      status: 'RECEBIDO', criadoEm: new Date().toISOString(),\n      historico: [{ em: new Date().toISOString(), texto: 'Pedido recebido' }]\n    };\n    pedido.itens.forEach(i => { db.estoque[i.id] -= i.qtd; });\n    db.pedidos.unshift(pedido);\n    db.carrinho = [];\n    N.notificar('cliente', `Pedido ${pedido.codigo} recebido. Acompanhe o status em Meus pedidos.`, 'cliente.html#pedidos');\n    N.notificar('gestor', `Novo pedido ${pedido.codigo} (${pedido.modalidade === 'entrega' ? 'entrega' : 'retirada'}).`, 'gestao.html#pedidos');\n    N.salvar();\n    N.atualizarContadorCarrinho();\n\n    area.innerHTML = `\n      <div class=\"estado-vazio\" style=\"max-width:560px;margin:0 auto\">\n        <span class=\"selo selo-concluido\">Pedido recebido · simulação<\/span>\n        <h2 class=\"app-titulo\" style=\"margin-top:1rem\" tabindex=\"-1\" id=\"titulo-pedido-ok\">Pedido ${pedido.codigo}<\/h2>\n        <p style=\"margin-top:.5rem\">Total ${moeda(pedido.total)} · ${pedido.modalidade === 'entrega' ? 'Entrega em ' + esc(endereco) : 'Retirada no salão'}.<\/p>\n        <p style=\"margin-top:.5rem\">Nenhum pagamento foi processado.<\/p>\n        <div style=\"display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem\">\n          <a href=\"loja.html\" class=\"btn btn-contorno-escuro\">Continuar comprando<\/a>\n          <a href=\"cliente.html#pedidos\" class=\"btn btn-escuro\">Ver meus pedidos<\/a>\n        <\/div>\n      <\/div>`;\n    document.getElementById('titulo-pedido-ok').focus();\n  }\n\n  render();\n});\n", "js/publico.js": "/* =========================================================\n   NORDEN — Páginas públicas de serviços e profissionais\n   Renderizadas a partir do catálogo único em core.js\n   ========================================================= */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { SERVICOS, PROFISSIONAIS, PRODUTOS, moeda, duracaoTexto, profissional, esc } = N;\n  const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];\n\n  // ---------------- Serviços ----------------\n  const listaServicos = document.getElementById('lista-servicos-publica');\n  if (listaServicos) {\n    listaServicos.innerHTML = SERVICOS.map((s, i) => `\n      <li class=\"servico\">\n        <span class=\"servico-num\">${String(i + 1).padStart(2, '0')}<\/span>\n        <h2 style=\"font-size:1.25rem\">${esc(s.nome)}<\/h2>\n        <p>${esc(s.desc)}<\/p>\n        <p class=\"texto-suave\"><strong>Profissionais:<\/strong> ${s.profissionais.map(id => profissional(id).nome).join(', ')}<\/p>\n        ${s.produtos.length ? `<p class=\"texto-suave\"><strong>Produtos indicados:<\/strong> ${s.produtos.map(id => PRODUTOS[id].nome).join(', ')}<\/p>` : ''}\n        <div class=\"servico-meta\">\n          <span class=\"servico-preco\">${moeda(s.preco)}<\/span>\n          <span class=\"servico-duracao\">${duracaoTexto(s.duracao)}<\/span>\n        <\/div>\n        <a href=\"agendar.html?servico=${s.id}\" class=\"btn btn-escuro btn-pequeno\" aria-label=\"Agendar ${esc(s.nome)}\">Agendar<\/a>\n      <\/li>`).join('');\n  }\n\n  // ---------------- Profissionais ----------------\n  const listaProf = document.getElementById('lista-profissionais-publica');\n  if (listaProf) {\n    listaProf.innerHTML = PROFISSIONAIS.map(p => {\n      const servicos = SERVICOS.filter(s => s.profissionais.includes(p.id));\n      return `\n      <li class=\"cartao\" style=\"display:grid;gap:1rem;align-content:start\">\n        <div style=\"display:flex;gap:1rem;align-items:center\">\n          <span class=\"avatar-grande\" aria-hidden=\"true\" style=\"width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--grafite);color:var(--bronze-claro);font-family:var(--fonte-marca);font-weight:700\">${p.sigla}<\/span>\n          <div>\n            <h2 style=\"font-size:1.15rem\">${esc(p.nome)}<\/h2>\n            <div class=\"chips\" style=\"margin-top:.35rem\">${p.tags.map(t => `<span class=\"chip\">${esc(t)}<\/span>`).join('')}<\/div>\n          <\/div>\n        <\/div>\n        <p class=\"texto-suave\">${esc(p.bio)}<\/p>\n        <p class=\"texto-suave\"><strong>Atende:<\/strong> ${p.dias.map(d => DIAS[d]).join(', ')}<\/p>\n        <p class=\"texto-suave\"><strong>Serviços:<\/strong> ${servicos.map(s => s.nome).join(', ')}<\/p>\n        <a href=\"agendar.html?profissional=${p.id}\" class=\"btn btn-escuro btn-pequeno\">Agendar com ${esc(p.nome)}<\/a>\n      <\/li>`;\n    }).join('');\n  }\n});\n", "js/script.js": "/* NORDEN — Efeitos das páginas públicas (landing e contato) */\ndocument.body.classList.remove('sem-js');\n\n// Revelação sutil ao rolar (desativada com movimento reduzido)\nconst reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst itensRevelar = document.querySelectorAll('.revelar');\nif (reduzirMovimento || !('IntersectionObserver' in window)) {\n  itensRevelar.forEach(el => el.classList.add('visivel'));\n} else {\n  const observador = new IntersectionObserver(entradas => {\n    entradas.forEach(entrada => {\n      if (entrada.isIntersecting) {\n        entrada.target.classList.add('visivel');\n        observador.unobserve(entrada.target);\n      }\n    });\n  }, { threshold: 0.12 });\n  itensRevelar.forEach(el => observador.observe(el));\n}\n", "js/ui.js": "/* =========================================================\n   NORDEN — Utilitários de interface das áreas logadas\n   Navegação por seções (hash); o modal fica em core.js\n   ========================================================= */\n\n// Roteador simples por hash: #secao ou #secao/parametro\nN.roteador = function ({ secoes, padrao, aoMudar }) {\n  const lateral = document.getElementById('app-lateral');\n  const seletor = document.getElementById('seletor-secao');\n\n  function montarMenus() {\n    const itens = secoes.filter(s => !s.oculta);\n    lateral.innerHTML = `<p>${lateral.dataset.titulo}<\/p>` + itens.map(s =>\n      `<a href=\"#${s.id}\" data-secao=\"${s.id}\">${s.titulo}${s.contador && s.contador() ? `<span class=\"contador\">${s.contador()}<\/span>` : ''}<\/a>`).join('');\n    seletor.innerHTML = `\n      <label class=\"sr-only\" for=\"seletor\">Ir para a seção<\/label>\n      <div class=\"campo\"><select id=\"seletor\">${itens.map(s =>\n        `<option value=\"${s.id}\">${s.titulo}${s.contador && s.contador() ? ` (${s.contador()})` : ''}<\/option>`).join('')}<\/select><\/div>`;\n    seletor.querySelector('select').addEventListener('change', e => { location.hash = e.target.value; });\n  }\n\n  function navegar() {\n    const [id, param] = location.hash.replace('#', '').split('/');\n    const secao = secoes.find(s => s.id === id) || secoes.find(s => s.id === padrao);\n    montarMenus();\n    const ativo = secao.oculta ? secao.pai : secao.id;\n    lateral.querySelectorAll('a').forEach(a => {\n      if (a.dataset.secao === ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');\n    });\n    seletor.querySelector('select').value = ativo;\n    aoMudar(secao, param);\n  }\n\n  window.addEventListener('hashchange', () => { navegar(); window.scrollTo({ top: 0 }); });\n  return { navegar, atualizarMenus: montarMenus };\n};\n"}}</script>
<script>
(() => {
  const { paginas, arquivos } = JSON.parse(document.getElementById('norden-dados').textContent);
  const quadro = document.getElementById('quadro');
  const esc = s => JSON.stringify(s).replace(/</g, '\\u003c');

  // Separa "agendar.html?servico=barba#x" em página, query e hash
  function separar(url) {
    const m = String(url).match(/^([^?#]*)(\?[^#]*)?(#.*)?$/) || [];
    const pagina = (m[1] || 'index.html').split('/').pop() || 'index.html';
    return { pagina: paginas[pagina] ? pagina : 'index.html', query: m[2] || '', hash: m[3] || '' };
  }

  function montar({ pagina, query, hash }) {
    let html = paginas[pagina];
    // Embute CSS e JS
    html = html.replace(/<link rel="stylesheet" href="((?:css)\/[^"]+)">/g, (t, ref) => '<style>' + arquivos[ref] + '</style>');
    html = html.replace(/<script src="((?:js)\/[^"]+)"><\/script>/g, (t, ref) => '<script>' + arquivos[ref].replace(/<\/script/gi, '<\\/script') + '<\/script>');
    // Script de ponte: informa a página atual e intercepta links entre páginas
    // <base> faz links "#secao" ficarem dentro da própria página (e não do arquivo principal)
    const ponte = '<base href="about:srcdoc"><script>' +
      'window.__NORDEN_PAGINA=' + esc(pagina) + ';window.__NORDEN_QUERY=' + esc(query) + ';' +
      'window.__NORDEN_NAV=function(u){parent.postMessage({nordenNav:String(u)},"*")};' +
      (hash ? 'try{history.replaceState(null,"",' + esc(hash) + ')}catch(e){};' : '') +
      'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;' +
      'var h=a.getAttribute("href");if(/^[a-z0-9_-]+\\.html/i.test(h)){e.preventDefault();window.__NORDEN_NAV(h);}},true);' +
      '<\/script>';
    return html.replace(/<head>/i, '<head>' + ponte);
  }

  function abrir(url, registrar) {
    const destino = separar(url);
    quadro.srcdoc = montar(destino);
    const marca = '#' + destino.pagina + destino.query + destino.hash;
    if (registrar && location.hash !== marca) history.pushState(null, '', marca);
  }

  quadro.addEventListener('load', () => {
    try { document.title = quadro.contentDocument.title || 'NORDEN'; } catch (e) {}
  });
  window.addEventListener('message', e => {
    if (e.data && typeof e.data.nordenNav === 'string') abrir(e.data.nordenNav, true);
  });
  window.addEventListener('popstate', () => abrir(location.hash.slice(1) || 'index.html', false));

  abrir(location.hash.slice(1) || 'index.html', false);
})();
</script>
</body>
</html>
